<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']" layout="stack">
        <wu-editor id="d-ed-basic" name="newsBody" [(ngModel)]="newsBody" [style]="{ height: '320px' }" [placeholder]="tx('พิมพ์เนื้อหาข่าว')"></wu-editor>
        <div class="docs-demo-actions">
          <wu-button id="d-ed-save" [label]="tx('บันทึก')" icon="wi wi-save" [loading]="isApiSaving" [disabled]="!newsBody" (onClick)="saveNews()"></wu-button>
          <span class="docs-demo-output">saved: <code id="d-ed-saved">{{ savedCount }}</code></span>
        </div>
        <pre id="d-ed-basic-value" class="docs-csv">{{ newsBody ?? 'null' }}</pre>
      </docs-demo>
    </docs-section>

    <docs-section id="toolbar" [section]="sec['toolbar']">
      <docs-demo [html]="code['toolbar']" [ts]="ts['toolbar']" layout="stack">
        <wu-selectbutton id="d-ed-preset" name="preset" [(ngModel)]="preset" [options]="presets" [allowEmpty]="false"></wu-selectbutton>
        <wu-editor id="d-ed-presets" name="presetBody" [(ngModel)]="presetBody" [toolbar]="preset" [style]="{ height: '160px' }"></wu-editor>
        <wu-editor id="d-ed-custom" name="customBody" [(ngModel)]="customBody" [toolbar]="tools" [style]="{ height: '160px' }"></wu-editor>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']" [ts]="ts['options']" layout="stack">
        <wu-editor id="d-ed-options" name="noticeBody" [(ngModel)]="noticeBody" toolbar="full" [toolOptions]="toolOptions" [style]="{ height: '200px' }"></wu-editor>
      </docs-demo>
    </docs-section>

    <docs-section id="header" [section]="sec['header']">
      <docs-slot-note slot="header"></docs-slot-note>
      <docs-demo [html]="code['header']" layout="stack">
        <wu-editor id="d-ed-header" name="policy" [(ngModel)]="policy" [style]="{ height: '320px' }">
          <ng-template #header>
            <span class="ql-formats">
              <select class="ql-size"></select>
            </span>
            <span class="ql-formats">
              <button class="ql-bold"></button>
              <button class="ql-italic"></button>
              <button class="ql-underline"></button>
              <button class="ql-strike"></button>
            </span>
            <span class="ql-formats">
              <select class="ql-color"></select>
              <select class="ql-background"></select>
            </span>
            <span class="ql-formats">
              <select class="ql-header">
                <option value="1"></option>
                <option value="2"></option>
                <option selected></option>
              </select>
              <button class="ql-list" value="ordered"></button>
              <button class="ql-list" value="bullet"></button>
              <select class="ql-align">
                <option selected></option>
                <option value="center"></option>
                <option value="right"></option>
              </select>
            </span>
            <span class="ql-formats">
              <button class="ql-blockquote"></button>
              <button class="ql-link"></button>
              <button class="ql-clean"></button>
            </span>
          </ng-template>
        </wu-editor>
        <pre id="d-ed-header-value" class="docs-csv">{{ policy ?? 'null' }}</pre>
      </docs-demo>
    </docs-section>

    <docs-section id="images" [section]="sec['images']">
      <docs-demo [html]="code['images']" [ts]="ts['images']" layout="stack">
        <wu-editor
          id="d-ed-images"
          name="imageBody"
          [(ngModel)]="imageBody"
          [toolbar]="['bold', 'italic', '|', 'image', '|', 'undo', 'redo']"
          [imageUpload]="imageUpload"
          [style]="{ height: '240px' }"
          (onImageUpload)="imageUploaded($event)"
          (onImageUploadError)="imageFailed($event)"
        ></wu-editor>
        <span class="docs-demo-output">{{ tx('ล่าสุด') }}: <code id="d-ed-image-log">{{ lastImageEvent || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="defaults" [section]="sec['defaults']">
      <docs-code [code]="$any(ts['defaults'])" lang="ts"></docs-code>
      <docs-code [code]="$any(code['defaults'])" lang="html"></docs-code>
    </docs-section>

    <docs-section id="tables" [section]="sec['tables']">
      <docs-demo [html]="code['tables']" [ts]="ts['tables']" layout="stack">
        <wu-editor
          id="d-ed-tables"
          name="timetable"
          [(ngModel)]="timetable"
          [toolbar]="['bold', '|', 'table', '|', 'undo', 'redo']"
          [toolOptions]="{ table: { rows: 6, cols: 6, headerRow: true } }"
          [style]="{ height: '260px' }"
        ></wu-editor>
      </docs-demo>
    </docs-section>

    <docs-section id="view" [section]="sec['view']">
      <docs-demo [html]="code['view']" [ts]="ts['view']" layout="stack">
        <div id="d-ed-view" wuEditorContent [innerHTML]="announcement"></div>
      </docs-demo>
    </docs-section>

    <docs-section id="readonly" [section]="sec['readonly']">
      <docs-demo [html]="code['readonly']" layout="stack">
        <wu-editor id="d-ed-readonly" name="policyView" [ngModel]="policy" [readonly]="true" toolbar="basic"></wu-editor>
      </docs-demo>
    </docs-section>

    <docs-section id="count" [section]="sec['count']">
      <docs-demo [html]="code['count']" layout="stack">
        <wu-editor id="d-ed-count" name="summary" [(ngModel)]="summary" toolbar="basic" [showCount]="true" [style]="{ height: '120px' }"></wu-editor>
      </docs-demo>
    </docs-section>

    <docs-section id="events" [section]="sec['events']">
      <docs-demo [html]="code['events']" [ts]="ts['events']" layout="stack">
        <wu-editor
          #ed="wuEditor"
          id="d-ed-events"
          name="letter"
          [(ngModel)]="letter"
          toolbar="basic"
          [style]="{ height: '160px' }"
          (onInit)="editorReady($event)"
          (onTextChange)="textChanged($event)"
        ></wu-editor>
        <div class="docs-demo-actions">
          <wu-button id="d-ed-letter" [label]="tx('ใส่จดหมายตัวอย่าง')" icon="wi wi-file" severity="secondary" (onClick)="useLetterTemplate()"></wu-button>
          <wu-button id="d-ed-focus" [label]="tx('ไปที่เนื้อหา')" severity="secondary" [text]="true" (onClick)="ed.getEditor().focus()"></wu-button>
        </div>
        <span class="docs-demo-output">onTextChange: <code id="d-ed-event">{{ lastEvent || '-' }}</code> · onInit: <code id="d-ed-ready">{{ editorIsReady }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="keyboard" [section]="sec['keyboard']"></docs-section>
    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
