<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-radiobutton id="d-free" name="plan" value="free" [(ngModel)]="plan" label="Free"></wt-radiobutton>
        <wt-radiobutton id="d-pro" name="plan" value="pro" [(ngModel)]="plan" label="Pro"></wt-radiobutton>
        <wt-radiobutton id="d-team" name="plan" value="team" [(ngModel)]="plan" label="Team"></wt-radiobutton>
        <span class="docs-demo-output">plan: <code id="d-plan">{{ plan | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wt-radiobutton name="demo-size" value="sm" [(ngModel)]="sizeValue" size="small" label="เล็ก"></wt-radiobutton>
        <wt-radiobutton name="demo-size" value="md" [(ngModel)]="sizeValue" label="ปกติ"></wt-radiobutton>
        <wt-radiobutton name="demo-size" value="lg" [(ngModel)]="sizeValue" size="large" label="ใหญ่"></wt-radiobutton>
      </docs-demo>
    </docs-section>

    <docs-section id="layout" [section]="sec['layout']">
      <docs-demo [html]="code['layout']" layout="stack">
        <div id="d-radio-stack" class="docs-radio-stack">
          <wt-radiobutton name="d-delivery" value="standard" [(ngModel)]="delivery" label="ส่งธรรมดา (3–5 วัน)"></wt-radiobutton>
          <wt-radiobutton name="d-delivery" value="express" [(ngModel)]="delivery" label="ส่งด่วน (1–2 วัน)"></wt-radiobutton>
          <wt-radiobutton name="d-delivery" value="pickup" [(ngModel)]="delivery" label="รับเองที่สาขา"></wt-radiobutton>
        </div>
        <div id="d-radio-row" class="docs-radio-row">
          <wt-radiobutton name="d-payment" value="card" [(ngModel)]="payment" label="บัตรเครดิต"></wt-radiobutton>
          <wt-radiobutton name="d-payment" value="transfer" [(ngModel)]="payment" label="โอนเงิน"></wt-radiobutton>
          <wt-radiobutton name="d-payment" value="qr" [(ngModel)]="payment" label="QR พร้อมเพย์"></wt-radiobutton>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']" layout="stack">
        <form [formGroup]="form" class="docs-demo-form">
          <wt-radiobutton id="r-monthly" name="billing" value="monthly" formControlName="billing" label="รายเดือน"></wt-radiobutton>
          <wt-radiobutton id="r-yearly" name="billing" value="yearly" formControlName="billing" label="รายปี"></wt-radiobutton>
        </form>
        <div class="docs-demo-actions">
          <wt-button id="r-patch" label="patchValue('yearly')" size="small" severity="secondary" (onClick)="patch()"></wt-button>
          <span class="docs-demo-output">billing: <code id="r-billing">{{ form.value.billing | json }}</code> · valid: <b id="r-valid">{{ form.valid }}</b></span>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="dynamic" [section]="sec['dynamic']">
      <docs-demo [html]="code['dynamic']" [ts]="ts['dynamic']">
        @for (s of sizes; track s.value) {
          <wt-radiobutton name="size" [value]="s.value" [label]="s.label" [(ngModel)]="size"></wt-radiobutton>
        }
        <span class="docs-demo-output">size: <code>{{ size | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="disabled" [section]="sec['disabled']">
      <docs-demo [html]="code['disabled']">
        <wt-radiobutton name="d" value="a" [ngModel]="'a'" [disabled]="true" label="ปิดอยู่ (เลือกแล้ว)"></wt-radiobutton>
        <wt-radiobutton name="d" value="b" [ngModel]="'a'" [disabled]="true" label="ปิดอยู่"></wt-radiobutton>
      </docs-demo>
    </docs-section>

    <docs-section id="invalid" [section]="sec['invalid']">
      <docs-demo [html]="code['invalid']">
        <wt-radiobutton name="i" value="x" [invalid]="true" label="ต้องเลือก 1 ข้อ"></wt-radiobutton>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
