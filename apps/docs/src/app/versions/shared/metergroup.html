<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-metergroup id="d-meter-basic" [value]="local(single)" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="multiple" [section]="sec['multiple']">
      <docs-demo [html]="code['multiple']" [ts]="ts['multiple']" layout="stack">
        <wu-metergroup id="d-meter-multi" [value]="local(storage)" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="icons" [section]="sec['icons']">
      <docs-demo [html]="code['icons']" [ts]="ts['icons']" layout="stack">
        <wu-metergroup [value]="local(storageIcons)" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="label" [section]="sec['label']">
      <docs-demo [html]="code['label']" layout="stack">
        <wu-metergroup [value]="local(storage)" labelPosition="start" labelOrientation="vertical" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="vertical" [section]="sec['vertical']">
      <docs-demo [html]="code['vertical']">
        <wu-metergroup id="d-meter-vertical" [value]="local(storage)" orientation="vertical" labelOrientation="vertical" style="height: 20rem" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="reverse" [section]="sec['reverse']">
      <docs-demo [html]="code['reverse']" [ts]="ts['multiple']">
        <div class="docs-demo-labelled">
          <span class="docs-demo-output">{{ tx('ปกติ') }}</span>
          <wu-metergroup id="d-meter-normal" [value]="local(storage)" orientation="vertical" labelOrientation="vertical" style="height: 14rem" [ariaLabel]="tx('พื้นที่จัดเก็บ')"></wu-metergroup>
        </div>
        <div class="docs-demo-labelled">
          <span class="docs-demo-output">[reverse]="true"</span>
          <wu-metergroup
            id="d-meter-reverse"
            [value]="local(storage)"
            orientation="vertical"
            labelOrientation="vertical"
            [reverse]="true"
            style="height: 14rem"
            [ariaLabel]="tx('พื้นที่จัดเก็บ')"
          ></wu-metergroup>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="minmax" [section]="sec['minmax']">
      <docs-demo [html]="code['minmax']" [ts]="ts['minmax']" layout="stack">
        <wu-metergroup [value]="local(usedGb)" [min]="0" [max]="200" [ariaLabel]="tx('พื้นที่ 200 GB')"></wu-metergroup>
      </docs-demo>
    </docs-section>

    <docs-section id="clickable" [section]="sec['clickable']">
      <docs-demo [html]="code['clickable']" [ts]="ts['clickable']" layout="stack">
        <wu-metergroup
          id="d-meter-click"
          [value]="local(tickets)"
          [max]="50"
          [showValue]="true"
          [clickable]="true"
          [ariaLabel]="tx('Ticket ตามสถานะ')"
          (onItemClick)="openStatus($event)"
        ></wu-metergroup>
        <span class="docs-demo-output">onItemClick: <code id="d-meter-picked">{{ picked || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="template" [section]="sec['template']">
      <docs-slot-note slot="label"></docs-slot-note>
      <docs-demo [html]="code['template']" [ts]="ts['multiple']" layout="stack">
        <wu-metergroup id="d-meter-template" [value]="local(storage)" labelPosition="start" [ariaLabel]="tx('พื้นที่จัดเก็บ')">
          <ng-template #label let-value let-percentages="percentages">
            <div class="docs-storage-cards">
              @for (item of value; track item.label; let i = $index) {
                <div class="docs-storage-card">
                  <span class="docs-storage-name">{{ item.label }}</span>
                  <b>{{ percentages[i] }}%</b>
                </div>
              }
            </div>
          </ng-template>
          <ng-template #end let-totalPercent="totalPercent">
            <p class="docs-demo-p docs-storage-total">{{ tx('ใช้ไปทั้งหมด') }} {{ totalPercent }}%</p>
          </ng-template>
        </wu-metergroup>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
