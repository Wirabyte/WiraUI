<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-button [label]="tx('บันทึก')" icon="wi wi-save"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="action" [section]="sec['action']">
      <docs-demo [html]="code['action']" [ts]="ts['action']">
        <wu-button id="demo-save" [label]="tx('ส่งข้อมูล')" icon="wi wi-send" [action]="save"></wu-button>
        <span class="docs-demo-output">
          @if (en()) {
            Sent <b id="demo-saved">{{ saved }}</b> {{ saved === 1 ? 'time' : 'times' }}
          } @else {
            ส่งแล้ว <b id="demo-saved">{{ saved }}</b> ครั้ง
          }
        </span>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']">
        <wu-button label="Primary"></wu-button>
        <wu-button label="Secondary" severity="secondary"></wu-button>
        <wu-button label="Success" severity="success"></wu-button>
        <wu-button label="Info" severity="info"></wu-button>
        <wu-button label="Warn" severity="warn"></wu-button>
        <wu-button label="Help" severity="help"></wu-button>
        <wu-button label="Danger" severity="danger"></wu-button>
        <wu-button label="Contrast" severity="contrast"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="variants" [section]="sec['variants']">
      <docs-demo [html]="code['variants']">
        <wu-button label="Outlined" [outlined]="true"></wu-button>
        <wu-button label="Outlined" severity="secondary" [outlined]="true"></wu-button>
        <wu-button label="Text" [text]="true"></wu-button>
        <wu-button label="Text" severity="danger" [text]="true"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="shape" [section]="sec['shape']">
      <docs-demo [html]="code['shape']">
        <wu-button label="Raised" [raised]="true"></wu-button>
        <wu-button label="Rounded" [rounded]="true"></wu-button>
        <wu-button label="Rounded" severity="secondary" [rounded]="true" [outlined]="true"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wu-button id="d-btn-sm" [label]="tx('เล็ก')" size="small"></wu-button>
        <wu-button id="d-btn-md" [label]="tx('ปกติ')"></wu-button>
        <wu-button id="d-btn-lg" [label]="tx('ใหญ่')" size="large"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="directive" [section]="sec['directive']">
      <docs-demo [html]="code['directive']">
        <button id="d-btn-directive" wuButton type="button" [label]="tx('บันทึก')" icon="wi wi-save" (click)="clicks = clicks + 1"></button>
        <button wuButton type="button" [label]="tx('ลบ')" icon="wi wi-trash" severity="danger" [outlined]="true"></button>
        <a wuButton href="#directive" [label]="tx('ดูคำสั่งซื้อ')" severity="secondary" [text]="true"></a>
        <span class="docs-demo-output">click: <code id="d-btn-directive-count">{{ clicks }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="styleclass" [section]="sec['styleclass']">
      <docs-demo [html]="code['styleclass']">
        <wu-button id="d-btn-styleclass" [label]="tx('ลบ')" icon="wi wi-trash" styleClass="p-button-sm p-button-outlined p-button-danger"></wu-button>
        <button wuButton type="button" [label]="tx('ยกเลิก')" class="p-button-text p-button-secondary"></button>
      </docs-demo>
    </docs-section>

    <docs-section id="icons" [section]="sec['icons']">
      <docs-demo [html]="code['icons']">
        <wu-button [label]="tx('บันทึก')" icon="wi wi-check"></wu-button>
        <wu-button [label]="tx('ส่ง')" icon="wi wi-send" iconPos="right"></wu-button>
        <wu-button icon="wi wi-search" [ariaLabel]="tx('ค้นหา')"></wu-button>
        <wu-button icon="wi wi-trash" severity="danger" [text]="true" [ariaLabel]="tx('ลบ')"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="badge" [section]="sec['badge']">
      <docs-demo [html]="code['badge']">
        <wu-button [label]="tx('แจ้งเตือน')" icon="wi wi-bell" badge="3"></wu-button>
        <wu-button id="d-btn-badge" [label]="tx('ข้อความ')" severity="secondary" badge="12" badgeSeverity="danger"></wu-button>
        <wu-button
          id="d-btn-bell"
          icon="wi wi-bell"
          badge="5"
          badgeSeverity="danger"
          severity="secondary"
          [text]="true"
          [rounded]="true"
          [ariaLabel]="tx('แจ้งเตือน')"
        ></wu-button>
        <wu-button id="d-btn-link" [label]="tx('ดูคำสั่งซื้อ')" [link]="true" [style]="{ minWidth: '8rem' }"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="loading" [section]="sec['loading']">
      <docs-demo [html]="code['loading']">
        <wu-button id="d-btn-draft" [label]="tx('บันทึกแบบร่าง')" icon="wi wi-save" [loading]="isApiSaving" (onClick)="saveDraft()"></wu-button>
        <wu-button [label]="tx('ปิดอยู่')" [disabled]="true"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="fluid" [section]="sec['fluid']">
      <docs-demo [html]="code['fluid']" layout="stack">
        <wu-button [label]="tx('เข้าสู่ระบบ')" [fluid]="true"></wu-button>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
