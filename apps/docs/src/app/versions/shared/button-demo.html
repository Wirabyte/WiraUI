<section class="demo-page" [attr.data-wt-version]="'v' + major">
  <p class="demo-eyebrow" id="demo-version">wiratheme&#64;{{ major }} · Angular {{ range }}</p>
  <h1>Button</h1>
  <p class="demo-lead">ปุ่มแบบ PrimeNG พร้อม <code>[action]</code> ที่แสดง spinner และกันกดซ้ำจนงานเสร็จ</p>

  <div class="demo-box">
    <wt-button label="บันทึก"></wt-button>
    <wt-button label="รอง" severity="secondary"></wt-button>
    <wt-button label="สำเร็จ" severity="success"></wt-button>
    <wt-button label="อันตราย" severity="danger"></wt-button>
    <wt-button label="Outlined" outlined></wt-button>
    <wt-button label="Text" text></wt-button>
    <wt-button label="แจ้งเตือน" badge="3"></wt-button>
  </div>
  <div class="demo-box">
    <wt-button id="demo-save" label="ส่งใบสมัคร" [action]="save"></wt-button>
    <span>ส่งแล้ว <b id="demo-saved">{{ saved }}</b> ครั้ง</span>
  </div>

  <h2>ใช้ใน wiratheme&#64;{{ major }}</h2>
  <pre class="demo-code"><code>{{ snippet }}</code></pre>
  <p class="demo-host" id="demo-host">หน้านี้โหลดแบบ lazy ในแอปหลัก Angular {{ host }} (NgModule)</p>
</section>
