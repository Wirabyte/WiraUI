<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <wu-selectbutton id="d-plan" [options]="plans" optionLabel="label" optionValue="value" [(ngModel)]="plan"></wu-selectbutton>
        <span class="docs-demo-output">plan: <code id="d-plan-value">{{ plan | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wu-selectbutton [options]="plans" optionLabel="label" optionValue="value" [(ngModel)]="sizeValue" size="small"></wu-selectbutton>
        <wu-selectbutton [options]="plans" optionLabel="label" optionValue="value" [(ngModel)]="sizeValue"></wu-selectbutton>
        <wu-selectbutton [options]="plans" optionLabel="label" optionValue="value" [(ngModel)]="sizeValue" size="large"></wu-selectbutton>
      </docs-demo>
    </docs-section>

    <docs-section id="multiple" [section]="sec['multiple']">
      <docs-demo [html]="code['multiple']" [ts]="ts['multiple']">
        <wu-selectbutton id="d-days" [options]="local(days)" [(ngModel)]="workdays" [multiple]="true"></wu-selectbutton>
        <span class="docs-demo-output">workdays: <code id="d-days-value">{{ workdays | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="required" [section]="sec['required']">
      <docs-demo [html]="code['required']">
        <wu-selectbutton id="d-range" [options]="local(['วัน', 'สัปดาห์', 'เดือน'])" [(ngModel)]="range" [allowEmpty]="false"></wu-selectbutton>
        <span class="docs-demo-output">range: <code id="d-range-value">{{ range | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']">
        <form [formGroup]="form" class="docs-demo-form">
          <wu-selectbutton [options]="formPlans" optionLabel="label" optionValue="value" optionDisabled="disabled" formControlName="plan"></wu-selectbutton>
        </form>
        <span class="docs-demo-output">value: <code>{{ form.getRawValue() | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="item" [section]="sec['item']">
      <docs-slot-note slot="item"></docs-slot-note>
      <docs-demo [html]="code['item']" [ts]="ts['item']">
        <wu-selectbutton id="d-sb-item" name="view" [(ngModel)]="view" [options]="local(views)" optionLabel="label" optionValue="value" [unselectable]="true">
          <ng-template #item let-option let-i="index">
            <span class="docs-panel-head"><i [class]="option.icon"></i> {{ i + 1 }}. {{ option.label }}</span>
          </ng-template>
        </wu-selectbutton>
        <span class="docs-demo-output">view: <code id="d-sb-item-value">{{ view }}</code></span>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
