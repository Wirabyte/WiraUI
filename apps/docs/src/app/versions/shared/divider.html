<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <p class="docs-demo-p">{{ tx('ส่วนบน') }}</p>
        <wu-divider></wu-divider>
        <p class="docs-demo-p">{{ tx('ส่วนล่าง') }}</p>
      </docs-demo>
    </docs-section>

    <docs-section id="content" [section]="sec['content']">
      <docs-demo [html]="code['content']" layout="stack">
        <wu-divider align="left"><b>{{ tx('ข้อมูลบัญชี') }}</b></wu-divider>
        <wu-divider align="center">{{ tx('หรือ') }}</wu-divider>
        <wu-divider align="right"><span class="wi wi-check"></span></wu-divider>
      </docs-demo>
    </docs-section>

    <docs-section id="type" [section]="sec['type']">
      <docs-demo [html]="code['type']" layout="stack">
        <wu-divider type="dashed"></wu-divider>
        <wu-divider type="dotted"></wu-divider>
      </docs-demo>
    </docs-section>

    <docs-section id="vertical" [section]="sec['vertical']">
      <docs-demo [html]="code['vertical']" layout="stack">
        <div class="docs-divider-row">
          <span>{{ tx('ซ้าย') }}</span>
          <wu-divider layout="vertical"></wu-divider>
          <span>{{ tx('กลาง') }}</span>
          <wu-divider layout="vertical" align="center">{{ tx('หรือ') }}</wu-divider>
          <span>{{ tx('ขวา') }}</span>
        </div>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
