<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wt-empty-state id="d-es-basic"></wt-empty-state>
      </docs-demo>
    </docs-section>

    <docs-section id="types" [section]="sec['types']">
      <docs-demo [html]="code['types']" layout="stack">
        <div class="docs-demo-grid">
          @for (t of types; track t) {
            <wt-empty-state [id]="'d-es-type-' + t" [type]="t" size="small"></wt-empty-state>
          }
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="actions" [section]="sec['actions']">
      <docs-demo [html]="code['actions']" layout="stack">
        <wt-empty-state id="d-es-actions" [title]="tx('ยังไม่มีนักเรียนในห้องนี้')" [description]="tx('เพิ่มนักเรียนทีละคน หรือนำเข้าจากไฟล์ Excel')">
          <wt-button id="d-es-add" [label]="tx('เพิ่มนักเรียน')" icon="wi wi-plus" (onClick)="added = added + 1"></wt-button>
          <wt-button [label]="tx('นำเข้าจาก Excel')" icon="wi wi-file-excel" severity="secondary" [outlined]="true"></wt-button>
        </wt-empty-state>
        <wt-empty-state id="d-es-search" type="search">
          <wt-button [label]="tx('ล้างตัวกรอง')" severity="secondary" [text]="true"></wt-button>
        </wt-empty-state>
        <span class="docs-demo-output">{{ tx('เพิ่มนักเรียน') }}: <code id="d-es-added">{{ added }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="picture" [section]="sec['picture']">
      <docs-demo [html]="code['picture']" layout="stack">
        <wt-empty-state id="d-es-icon" icon="wi wi-bell" [title]="tx('ยังไม่มีการแจ้งเตือน')" description=""></wt-empty-state>
        <wt-empty-state id="d-es-noimage" type="error" [showImage]="false">
          <wt-button [label]="tx('ลองใหม่')" icon="wi wi-refresh" size="small"></wt-button>
        </wt-empty-state>
      </docs-demo>
    </docs-section>

    <docs-section id="table" [section]="sec['table']">
      <docs-demo [html]="code['table']" layout="stack">
        <wt-table id="d-es-table" [value]="students">
          <ng-template #header>
            <tr>
              <th>{{ tx('รหัส') }}</th>
              <th>{{ tx('ชื่อ - สกุล') }}</th>
              <th>{{ tx('ห้อง') }}</th>
            </tr>
          </ng-template>
          <ng-template #body let-s>
            <tr>
              <td>{{ s.code }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.room }}</td>
            </tr>
          </ng-template>
          <ng-template #emptymessage>
            <tr>
              <td colspan="3">
                <wt-empty-state size="small" [title]="tx('ยังไม่มีนักเรียนในห้องนี้')">
                  <wt-button [label]="tx('เพิ่มนักเรียน')" icon="wi wi-plus" size="small"></wt-button>
                </wt-empty-state>
              </td>
            </tr>
          </ng-template>
        </wt-table>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
