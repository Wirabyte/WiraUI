<section class="demo-page" [attr.data-wt-version]="'v' + major">
  <p class="demo-eyebrow" id="forms-version">wiratheme&#64;{{ major }} · Angular {{ range }}</p>
  <h1>ฟอร์ม</h1>
  <p class="demo-lead">Card, InputText, Textarea, Checkbox, RadioButton และ ToggleSwitch ใช้ได้ทั้ง ngModel และ Reactive Forms</p>

  <wt-card header="ngModel" subheader="ผูกกับ field ใน component">
    <div class="demo-fields">
      <input id="d-name" wtInputText [(ngModel)]="model.name" placeholder="ชื่อ" />
      <textarea id="d-note" wtTextarea autoResize rows="1" [(ngModel)]="model.note" placeholder="หมายเหตุ"></textarea>
    </div>
    <div class="demo-row">
      <wt-checkbox id="d-agree" [(ngModel)]="model.agree" binary label="ยอมรับเงื่อนไข"></wt-checkbox>
      <wt-radiobutton id="d-sci" name="d-plan" value="sci" [(ngModel)]="model.plan" label="วิทย์-คณิต"></wt-radiobutton>
      <wt-radiobutton id="d-art" name="d-plan" value="art" [(ngModel)]="model.plan" label="ศิลป์-ภาษา"></wt-radiobutton>
      <wt-toggleswitch id="d-notify" [(ngModel)]="model.notify" label="แจ้งผล"></wt-toggleswitch>
    </div>
    <pre id="d-model" class="demo-json">{{ model | json }}</pre>
  </wt-card>

  <wt-card header="Reactive Forms" subheader="FormGroup + formControlName">
    <form [formGroup]="form" class="demo-fields">
      <input id="r-name" wtInputText formControlName="name" placeholder="ชื่อ (ต้องกรอก)" />
      <div class="demo-row">
        <wt-checkbox id="r-agree" formControlName="agree" binary label="ยอมรับเงื่อนไข"></wt-checkbox>
        <wt-radiobutton id="r-sci" name="r-plan" value="sci" formControlName="plan" label="วิทย์-คณิต"></wt-radiobutton>
        <wt-radiobutton id="r-art" name="r-plan" value="art" formControlName="plan" label="ศิลป์-ภาษา"></wt-radiobutton>
        <wt-toggleswitch id="r-notify" formControlName="notify" label="แจ้งผล"></wt-toggleswitch>
      </div>
    </form>
    <div wtCardFooter>
      <wt-button id="r-patch" label="ใส่ค่าตัวอย่าง" size="small" severity="secondary" (onClick)="patch()"></wt-button>
      <span>valid: <b id="r-valid">{{ form.valid }}</b></span>
    </div>
  </wt-card>
</section>
