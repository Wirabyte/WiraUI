<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']" layout="stack">
        <wu-site-footer
          id="d-ft-basic"
          brand="WiraUI"
          [description]="tx('ชุด UI สำหรับ Angular ที่เข้าใจงานไทย')"
          [model]="local(columns)"
          [social]="local(social)"
          [legal]="local(legal)"
          [backToTop]="true"
          (onItemClick)="clicked($event)"
        ></wu-site-footer>
        <span class="docs-demo-output">{{ tx('ลิงก์ที่กดล่าสุด') }}: <code id="d-ft-last">{{ last }}</code></span>
        <div class="docs-narrow" id="d-ft-narrow">
          <wu-site-footer brand="WiraUI" [model]="local(columns)" [social]="local(social)" [legal]="local(legal)" (onItemClick)="clicked($event)"></wu-site-footer>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="looks" [section]="sec['looks']">
      <docs-demo [html]="code['looks']" layout="stack">
        <wu-site-footer id="d-ft-simple" look="simple" brand="WiraUI" [model]="local(links)" [social]="local(social)" (onItemClick)="clicked($event)"></wu-site-footer>
        <wu-site-footer id="d-ft-centered" look="centered" brand="WiraUI" [model]="local(links)" [social]="local(social)" [legal]="local(legal)" (onItemClick)="clicked($event)"></wu-site-footer>
      </docs-demo>
    </docs-section>

    <docs-section id="slots" [section]="sec['slots']">
      <docs-demo [html]="code['slots']" layout="stack">
        <wu-site-footer id="d-ft-slots" brand="WiraUI" [model]="local(columns)" (onItemClick)="clicked($event)">
          <ng-template wuTemplate="end">
            <div class="docs-newsletter">
              <label for="d-ft-news">{{ tx('รับข่าวสารทางอีเมล') }}</label>
              <wu-inputgroup>
                <input wuInputText id="d-ft-news" type="email" placeholder="you@example.com" />
                <wu-button [label]="tx('สมัคร')"></wu-button>
              </wu-inputgroup>
            </div>
          </ng-template>
        </wu-site-footer>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
