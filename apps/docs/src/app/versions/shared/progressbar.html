<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-progressbar [value]="64"></wu-progressbar>
        <wu-progressbar [value]="40" [showValue]="false"></wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="dynamic" [section]="sec['dynamic']">
      <docs-demo [html]="code['dynamic']" layout="stack">
        <wu-progressbar id="d-progress" [value]="progress" unit="%"></wu-progressbar>
        <div class="docs-demo-actions">
          <wu-button id="d-more" label="+10" size="small" (onClick)="step()"></wu-button>
          <span class="docs-demo-output">value: <code id="d-progress-value">{{ progress }}</code></span>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="count" [section]="sec['count']">
      <docs-demo [html]="code['count']" layout="stack">
        <wu-progressbar id="d-progress-count" [value]="1000" [max]="2500" [unit]="tx('รายการ')"></wu-progressbar>
        <wu-progressbar [value]="3" [max]="10" [text]="tx('อัปโหลด 3 จาก 10 ไฟล์')"></wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="content" [section]="sec['content']">
      <docs-slot-note slot="content"></docs-slot-note>
      <docs-demo [html]="code['content']" layout="stack">
        <wu-progressbar id="d-progress-content" [value]="50">
          <ng-template #content let-value>{{ value }}/100</ng-template>
        </wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="indeterminate" [section]="sec['indeterminate']">
      <docs-demo [html]="code['indeterminate']" layout="stack">
        <wu-progressbar mode="indeterminate" style="height: 6px"></wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="style" [section]="sec['style']">
      <docs-demo [html]="code['style']" layout="stack">
        <wu-progressbar [value]="72" color="#14b8a6" [showValue]="false" style="height: 6px"></wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="striped" [section]="sec['striped']">
      <docs-demo [html]="code['striped']" layout="stack">
        <wu-progressbar id="d-progress-striped" [value]="45" [striped]="true"></wu-progressbar>
        <wu-progressbar id="d-progress-animated" [value]="60" [animated]="true" [text]="tx('กำลังนำเข้า')"></wu-progressbar>
        <wu-progressbar [value]="80" [striped]="true" color="var(--wu-success-color)" [showValue]="false"></wu-progressbar>
      </docs-demo>
    </docs-section>

    <docs-section id="shimmer" [section]="sec['shimmer']">
      <docs-demo [html]="code['shimmer']" layout="stack">
        <wu-progressbar id="d-progress-shimmer" [value]="70" [shimmer]="true" [text]="tx('กำลังคัดลอก 7 จาก 10 ไฟล์')"></wu-progressbar>
        <wu-progressbar id="d-progress-shimmer-success" [value]="45" [shimmer]="true" color="var(--wu-success-color)" [text]="tx('สำรองข้อมูล')"></wu-progressbar>
        <wu-progressbar id="d-progress-shimmer-busy" mode="indeterminate" [shimmer]="true" style="height: 6px"></wu-progressbar>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
