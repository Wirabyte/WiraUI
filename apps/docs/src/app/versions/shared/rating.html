<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-rating id="d-rating" [(ngModel)]="score" ariaLabel="ความพึงพอใจ" (onRate)="rated = $event.value"></wt-rating>
        <span class="docs-demo-output">score: <code id="d-rating-value">{{ score }}</code> · onRate: <code id="d-rating-rated">{{ rated ?? '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="stars" [section]="sec['stars']">
      <docs-demo [html]="code['stars']">
        <wt-rating [(ngModel)]="score10" [stars]="10" ariaLabel="คะแนน 1 ถึง 10"></wt-rating>
        <span class="docs-demo-output">score10: <code>{{ score10 }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="readonly" [section]="sec['readonly']">
      <docs-demo [html]="code['readonly']">
        <wt-rating [ngModel]="4" [readonly]="true" ariaLabel="Readonly"></wt-rating>
        <wt-rating [ngModel]="2" [disabled]="true" ariaLabel="Disabled"></wt-rating>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
