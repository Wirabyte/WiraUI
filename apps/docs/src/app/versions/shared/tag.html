<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-tag [value]="tx('ใหม่')"></wu-tag>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']">
        <wu-tag value="primary" severity="primary"></wu-tag>
        <wu-tag value="secondary" severity="secondary"></wu-tag>
        <wu-tag value="success" severity="success"></wu-tag>
        <wu-tag value="info" severity="info"></wu-tag>
        <wu-tag value="warn" severity="warn"></wu-tag>
        <wu-tag value="danger" severity="danger"></wu-tag>
        <wu-tag value="help" severity="help"></wu-tag>
        <wu-tag value="contrast" severity="contrast"></wu-tag>
      </docs-demo>
    </docs-section>

    <docs-section id="pill" [section]="sec['pill']">
      <docs-demo [html]="code['pill']">
        <wu-tag [value]="tx('เปิดใช้งาน')" severity="success" [rounded]="true"></wu-tag>
        <wu-tag [value]="tx('ยืนยันแล้ว')" icon="wi wi-check" severity="info"></wu-tag>
      </docs-demo>
    </docs-section>

    <docs-section id="content" [section]="sec['content']">
      <docs-demo [html]="code['content']">
        <wu-tag severity="warn">
          <span class="wi wi-bell"></span> {{ tx('รออนุมัติ 3 รายการ') }}
        </wu-tag>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
