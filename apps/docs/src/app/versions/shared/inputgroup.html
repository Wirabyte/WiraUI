<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="addon" [section]="sec['addon']">
      <docs-demo [html]="code['addon']">
        <wu-inputgroup id="d-inputgroup">
          <wu-inputgroup-addon><i class="wi wi-user"></i></wu-inputgroup-addon>
          <input wuInputText [placeholder]="tx('ชื่อผู้ใช้')" [attr.aria-label]="tx('ชื่อผู้ใช้')" />
        </wu-inputgroup>
        <wu-inputgroup>
          <wu-inputgroup-addon>{{ tx('฿') }}</wu-inputgroup-addon>
          <input wuInputText [placeholder]="tx('ราคา')" [attr.aria-label]="tx('ราคา')" />
          <wu-inputgroup-addon>.00</wu-inputgroup-addon>
        </wu-inputgroup>
      </docs-demo>
    </docs-section>

    <docs-section id="button" [section]="sec['button']">
      <docs-demo [html]="code['button']">
        <wu-inputgroup>
          <input wuInputText [placeholder]="tx('ค้นหาคำสั่งซื้อ')" [attr.aria-label]="tx('ค้นหาคำสั่งซื้อ')" />
          <wu-button [label]="tx('ค้นหา')" icon="wi wi-search"></wu-button>
        </wu-inputgroup>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
