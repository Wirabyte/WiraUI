<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-badge value="8"></wt-badge>
        <wt-badge></wt-badge>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']">
        <wt-badge value="1" severity="primary"></wt-badge>
        <wt-badge value="2" severity="secondary"></wt-badge>
        <wt-badge value="3" severity="success"></wt-badge>
        <wt-badge value="4" severity="info"></wt-badge>
        <wt-badge value="5" severity="warn"></wt-badge>
        <wt-badge value="6" severity="danger"></wt-badge>
        <wt-badge value="7" severity="help"></wt-badge>
        <wt-badge value="8" severity="contrast"></wt-badge>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wt-badge value="2"></wt-badge>
        <wt-badge value="4" size="large"></wt-badge>
        <wt-badge value="6" size="xlarge"></wt-badge>
      </docs-demo>
    </docs-section>

    <docs-section id="inline" [section]="sec['inline']">
      <docs-demo [html]="code['inline']">
        <span>{{ tx('กล่องข้อความ') }} <wt-badge value="12" severity="danger"></wt-badge></span>
        <span>{{ tx('สถานะออนไลน์') }} <wt-badge severity="success"></wt-badge></span>
      </docs-demo>
    </docs-section>

    <docs-section id="directive" [section]="sec['directive']">
      <docs-demo [html]="code['directive']" [ts]="ts['directive']">
        <span id="d-badge-bell" class="docs-badge-icon" wtBadge [value]="unread" severity="danger" [badgeDisabled]="!unread"><i class="pi pi-bell"></i></span>
        <span id="d-badge-mail" class="docs-badge-icon" wtBadge severity="success"><i class="pi pi-envelope"></i></span>
        <span id="d-badge-cal" class="docs-badge-icon" pBadge value="2" badgeSize="large"><i class="pi pi-calendar"></i></span>
        <wt-button id="d-badge-read" [label]="tx('อ่านทั้งหมด')" severity="secondary" [text]="true" (onClick)="markRead()"></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="style" [section]="sec['style']">
      <docs-demo [html]="code['style']">
        <wt-badge id="d-badge-style" value="new" styleClass="uppercase" [style]="{ minWidth: '3rem' }"></wt-badge>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
