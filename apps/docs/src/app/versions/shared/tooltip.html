<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-button id="d-tooltip-top" [label]="tx('บน')" [wuTooltip]="tx('บันทึกแบบร่าง')" tooltipPosition="top"></wu-button>
        <wu-button [label]="tx('ล่าง')" [wuTooltip]="tx('ส่งออกเป็น Excel')" tooltipPosition="bottom"></wu-button>
        <wu-button [label]="tx('ซ้าย')" [wuTooltip]="tx('ย้อนกลับ')" tooltipPosition="left"></wu-button>
        <wu-button [label]="tx('ขวา')" [wuTooltip]="tx('ถัดไป')"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="event" [section]="sec['event']">
      <docs-demo [html]="code['event']">
        <input
          id="d-tooltip-focus"
          wuInputText
          [wuTooltip]="tx('กรอกเลขบัตรประชาชน 13 หลัก')"
          tooltipEvent="focus"
          tooltipPosition="top"
          [placeholder]="tx('เลขบัตรประชาชน')"
          [attr.aria-label]="tx('เลขบัตรประชาชน')"
        />
        <wu-button [label]="tx('ช้าหน่อย')" severity="secondary" [wuTooltip]="tx('แสดงหลัง 500ms')" [showDelay]="500" [hideDelay]="300"></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="html" [section]="sec['html']">
      <docs-demo [html]="code['html']">
        <wu-button
          [label]="tx('รายละเอียด')"
          severity="secondary"
          [wuTooltip]="tx(proHint)"
          [escape]="false"
          tooltipPosition="top"
        ></wu-button>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']">
        <wu-button [label]="tx(off ? 'tooltip ปิดอยู่' : 'tooltip เปิดอยู่')" severity="secondary" [wuTooltip]="tx('แสดงแล้ว')" [tooltipDisabled]="off" (onClick)="off = !off"></wu-button>
        <wu-button [label]="tx('บรรทัดเดียว')" severity="secondary" [wuTooltip]="tx('ข้อความยาวที่ไม่ต้องการให้ตัดขึ้นบรรทัดใหม่')" [fitContent]="true" tooltipPosition="top"></wu-button>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
