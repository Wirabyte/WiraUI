<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-button id="d-tooltip-top" [label]="tx('บน')" [wtTooltip]="tx('บันทึกแบบร่าง')" tooltipPosition="top"></wt-button>
        <wt-button [label]="tx('ล่าง')" [wtTooltip]="tx('ส่งออกเป็น Excel')" tooltipPosition="bottom"></wt-button>
        <wt-button [label]="tx('ซ้าย')" [wtTooltip]="tx('ย้อนกลับ')" tooltipPosition="left"></wt-button>
        <wt-button [label]="tx('ขวา')" [wtTooltip]="tx('ถัดไป')"></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="event" [section]="sec['event']">
      <docs-demo [html]="code['event']">
        <input
          id="d-tooltip-focus"
          wtInputText
          [wtTooltip]="tx('กรอกเลขบัตรประชาชน 13 หลัก')"
          tooltipEvent="focus"
          tooltipPosition="top"
          [placeholder]="tx('เลขบัตรประชาชน')"
          [attr.aria-label]="tx('เลขบัตรประชาชน')"
        />
        <wt-button [label]="tx('ช้าหน่อย')" severity="secondary" [wtTooltip]="tx('แสดงหลัง 500ms')" [showDelay]="500" [hideDelay]="300"></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="html" [section]="sec['html']">
      <docs-demo [html]="code['html']">
        <wt-button
          [label]="tx('รายละเอียด')"
          severity="secondary"
          [wtTooltip]="tx(proHint)"
          [escape]="false"
          tooltipPosition="top"
        ></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']">
        <wt-button [label]="tx(off ? 'tooltip ปิดอยู่' : 'tooltip เปิดอยู่')" severity="secondary" [wtTooltip]="tx('แสดงแล้ว')" [tooltipDisabled]="off" (onClick)="off = !off"></wt-button>
        <wt-button [label]="tx('บรรทัดเดียว')" severity="secondary" [wtTooltip]="tx('ข้อความยาวที่ไม่ต้องการให้ตัดขึ้นบรรทัดใหม่')" [fitContent]="true" tooltipPosition="top"></wt-button>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
