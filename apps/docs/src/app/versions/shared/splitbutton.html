<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <wu-splitButton
          id="d-spb-basic"
          [label]="tx('บันทึก')"
          icon="wi wi-save"
          [model]="local(saveActions)"
          [disabled]="isApiSaving"
          (onClick)="save()"
        ></wu-splitButton>
        <span class="docs-demo-output">
          {{ tx('สั่งล่าสุด') }}: <code id="d-spb-action">{{ lastAction || '-' }}</code> · {{ tx('บันทึกครั้งที่') }}: <code id="d-spb-saved">{{ savedCount }}</code>
        </span>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']" [ts]="ts['severity']">
        <wu-splitButton id="d-spb-secondary" [label]="tx('ส่งออก')" icon="wi wi-download" severity="secondary" [model]="local(exportActions)"></wu-splitButton>
        <wu-splitButton id="d-spb-outlined" [label]="tx('ส่งออก')" severity="success" [outlined]="true" [model]="local(exportActions)"></wu-splitButton>
        <wu-splitButton id="d-spb-text" [label]="tx('ส่งออก')" severity="info" [text]="true" [model]="local(exportActions)"></wu-splitButton>
        <wu-split-button id="d-spb-small" [label]="tx('ส่งออก')" severity="help" [raised]="true" [rounded]="true" size="small" [model]="local(exportActions)"></wu-split-button>
      </docs-demo>
    </docs-section>

    <docs-section id="disabled" [section]="sec['disabled']">
      <docs-demo [html]="code['disabled']" [ts]="ts['disabled']">
        <wu-splitButton id="d-spb-main-off" [label]="tx('อนุมัติ')" [model]="local(reviewActions)" [buttonDisabled]="true"></wu-splitButton>
        <wu-splitButton id="d-spb-menu-off" [label]="tx('อนุมัติ')" [model]="local(reviewActions)" [menuButtonDisabled]="true"></wu-splitButton>
        <wu-splitButton id="d-spb-all-off" [label]="tx('อนุมัติ')" [model]="local(reviewActions)" [disabled]="true"></wu-splitButton>
      </docs-demo>
    </docs-section>

    <docs-section id="icons" [section]="sec['icons']">
      <docs-demo [html]="code['icons']" [ts]="ts['icons']">
        <wu-splitButton
          id="d-spb-icons"
          [label]="tx('พิมพ์')"
          icon="wi wi-print"
          iconPos="right"
          dropdownIcon="wi wi-ellipsis-v"
          severity="secondary"
          [model]="local(exportActions)"
          (onMenuShow)="logMenu('onMenuShow')"
          (onMenuHide)="logMenu('onMenuHide')"
        ></wu-splitButton>
        <span class="docs-demo-output">event: <code id="d-spb-events">{{ menuEvents.join(' · ') || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
