<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <div class="docs-demo-labelled">
          <label for="d-ts-attachment">{{ tx('เอกสารที่แนบ') }}</label>
          <wu-treeSelect
            id="d-ts-basic"
            inputId="d-ts-attachment"
            name="attachment"
            [(ngModel)]="attachment"
            [options]="local(folders)"
            [placeholder]="tx('เลือกเอกสาร')"
            [filter]="true"
            [showClear]="true"
            (onClear)="clearedField()"
            [style]="{ width: '20rem' }"
          ></wu-treeSelect>
        </div>
        <span class="docs-demo-output">ngModel: <code id="d-ts-basic-value">{{ attachment?.label || 'null' }}</code> · onClear: <code id="d-ts-cleared">{{ cleared }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="multiple" [section]="sec['multiple']">
      <docs-demo [html]="code['multiple']" [ts]="ts['multiple']">
        <div class="docs-demo-labelled">
          <label for="d-ts-rooms">{{ tx('ห้องที่รับผิดชอบ') }}</label>
          <wu-tree-select
            id="d-ts-multi"
            inputId="d-ts-rooms"
            name="myRooms"
            [(ngModel)]="myRooms"
            [options]="local(roomTree)"
            selectionMode="checkbox"
            display="chip"
            [placeholder]="tx('เลือกห้องที่รับผิดชอบ')"
            [style]="{ width: '20rem' }"
          ></wu-tree-select>
        </div>
        <span class="docs-demo-output">{{ tx('ห้องที่รับผิดชอบ') }}: <code id="d-ts-multi-count">{{ roomCount() }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="value"></docs-slot-note>
      <docs-demo [html]="code['templates']">
        <wu-treeSelect
          id="d-ts-tpl"
          name="styledAttachment"
          [(ngModel)]="styledAttachment"
          [options]="local(templateFolders)"
          variant="filled"
          [ariaLabel]="tx('เอกสารที่แนบ')"
          [placeholder]="tx('เลือกเอกสาร')"
          [style]="{ width: '20rem' }"
        >
          <ng-template #value let-node let-placeholder="placeholder">
            @if (node) {
              <span class="docs-ts-value"><i [class]="node.icon"></i> {{ node.label }}</span>
            } @else {
              <span class="docs-ts-placeholder">{{ placeholder }}</span>
            }
          </ng-template>
        </wu-treeSelect>
      </docs-demo>
    </docs-section>

    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
