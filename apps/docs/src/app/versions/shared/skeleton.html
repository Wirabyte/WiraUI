<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-skeleton></wu-skeleton>
        <wu-skeleton width="60%"></wu-skeleton>
        <wu-skeleton width="10rem" height="2rem"></wu-skeleton>
      </docs-demo>
    </docs-section>

    <docs-section id="shapes" [section]="sec['shapes']">
      <docs-demo [html]="code['shapes']">
        <wu-skeleton shape="circle" size="3rem"></wu-skeleton>
        <wu-skeleton size="3rem" borderRadius="12px"></wu-skeleton>
      </docs-demo>
    </docs-section>

    <docs-section id="card" [section]="sec['card']">
      <docs-demo [html]="code['card']" layout="stack">
        <div class="docs-skeleton-card">
          <div class="docs-skeleton-row">
            <wu-skeleton shape="circle" size="3rem"></wu-skeleton>
            <div class="docs-skeleton-lines">
              <wu-skeleton width="40%"></wu-skeleton>
              <wu-skeleton width="70%" height="0.75rem"></wu-skeleton>
            </div>
          </div>
          <wu-skeleton height="8rem"></wu-skeleton>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="animation" [section]="sec['animation']">
      <docs-demo [html]="code['animation']" layout="stack">
        <wu-skeleton animation="none"></wu-skeleton>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
