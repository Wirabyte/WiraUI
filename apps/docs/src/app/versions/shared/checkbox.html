<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-checkbox id="d-agree" [(ngModel)]="agree" [binary]="true" label="ยอมรับเงื่อนไขการใช้งาน"></wt-checkbox>
        <span class="docs-demo-output">agree: <code id="d-agree-value">{{ agree | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wt-checkbox [(ngModel)]="sizeValue" [binary]="true" size="small" label="เล็ก"></wt-checkbox>
        <wt-checkbox [(ngModel)]="sizeValue" [binary]="true" label="ปกติ"></wt-checkbox>
        <wt-checkbox [(ngModel)]="sizeValue" [binary]="true" size="large" label="ใหญ่"></wt-checkbox>
      </docs-demo>
    </docs-section>

    <docs-section id="group" [section]="sec['group']">
      <docs-demo [html]="code['group']" [ts]="ts['group']">
        @for (t of topics; track t.value) {
          <wt-checkbox [id]="'d-' + t.value" name="topic" [value]="t.value" [label]="t.label" [(ngModel)]="selected"></wt-checkbox>
        }
        <span class="docs-demo-output">selected: <code id="d-selected">{{ selected | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']" layout="stack">
        <form [formGroup]="form" class="docs-demo-form">
          <wt-checkbox id="r-terms" formControlName="terms" [binary]="true" label="ยอมรับเงื่อนไขการใช้งาน"></wt-checkbox>
          <wt-checkbox id="r-privacy" formControlName="privacy" [binary]="true" label="ยินยอมตามนโยบายความเป็นส่วนตัว"></wt-checkbox>
        </form>
        <div class="docs-demo-actions">
          <wt-button id="r-patch" [label]="en() ? 'Check all' : 'ติ๊กทั้งหมด'" size="small" severity="secondary" (onClick)="patch()"></wt-button>
          <span class="docs-demo-output">valid: <b id="r-valid">{{ form.valid }}</b></span>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="values" [section]="sec['values']">
      <docs-demo [html]="code['values']">
        <wt-checkbox id="d-newsletter" [(ngModel)]="newsletter" [binary]="true" trueValue="Y" falseValue="N" label="รับข่าวสารทางอีเมล"></wt-checkbox>
        <span class="docs-demo-output">newsletter: <code id="d-newsletter-value">{{ newsletter | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="disabled" [section]="sec['disabled']">
      <docs-demo [html]="code['disabled']">
        <wt-checkbox [ngModel]="true" [binary]="true" [disabled]="true" label="ปิดอยู่ (ติ๊กแล้ว)"></wt-checkbox>
        <wt-checkbox [ngModel]="false" [binary]="true" [disabled]="true" label="ปิดอยู่"></wt-checkbox>
      </docs-demo>
    </docs-section>

    <docs-section id="invalid" [section]="sec['invalid']">
      <docs-demo [html]="code['invalid']">
        <wt-checkbox [(ngModel)]="invalidAgree" [binary]="true" [invalid]="true" label="ต้องยอมรับก่อนดำเนินการต่อ"></wt-checkbox>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
