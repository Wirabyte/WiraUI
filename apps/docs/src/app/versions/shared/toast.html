<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <wt-button id="d-toast-save" label="บันทึก" icon="pi pi-check" (onClick)="save()"></wt-button>
        <wt-button id="d-toast-dialog" label="toast เหนือ dialog" severity="secondary" (onClick)="dialogOpen = true"></wt-button>
        <wt-dialog header="ส่งใบเสนอราคา" [(visible)]="dialogOpen" [style]="{ width: '24rem' }">
          <p class="docs-demo-p">{{ en() ? 'The toast shows above this dialog.' : 'toast ขึ้นเหนือ dialog นี้' }}</p>
          <ng-template #footer>
            <wt-button id="d-toast-from-dialog" label="ส่ง" icon="pi pi-send" (onClick)="fromDialog()"></wt-button>
          </ng-template>
        </wt-dialog>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']" [ts]="ts['severity']">
        @for (s of severities; track s) {
          <wt-button [label]="s" [severity]="$any(s)" size="small" (onClick)="show(s)"></wt-button>
        }
      </docs-demo>
    </docs-section>

    <docs-section id="position" [section]="sec['position']">
      <docs-demo [html]="code['position']">
        <wt-button label="ล่างซ้าย" severity="secondary" [outlined]="true" (onClick)="at('bl', 'ล่างซ้าย')"></wt-button>
        <wt-button label="บนกลาง" severity="secondary" [outlined]="true" (onClick)="at('tc', 'บนกลาง')"></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="life" [section]="sec['life']">
      <docs-demo [html]="code['life']">
        <wt-button label="ค้างไว้" severity="warn" (onClick)="sticky()"></wt-button>
        <wt-button label="10 วินาที" severity="info" (onClick)="long()"></wt-button>
        <wt-button label="ล้างทั้งหมด" severity="secondary" (onClick)="clear()"></wt-button>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="message"></docs-slot-note>
      <docs-demo [html]="code['templates']" [ts]="ts['templates']">
        <wt-button label="แชร์เอกสาร" icon="pi pi-send" (onClick)="share()"></wt-button>
      </docs-demo>
    </docs-section>

    <!-- The toasts the demos above send to. -->
    <wt-toast></wt-toast>
    <wt-toast key="bl" position="bottom-left"></wt-toast>
    <wt-toast key="tc" position="top-center"></wt-toast>
    <wt-toast key="invite" position="bottom-right">
      <ng-template #message let-m>
        <div class="docs-toast-invite">
          <wt-avatar [label]="m.data?.initial" shape="circle"></wt-avatar>
          <div>
            <b>{{ m.summary }}</b>
            <p class="docs-demo-p">{{ m.detail }}</p>
          </div>
        </div>
      </ng-template>
    </wt-toast>
  </ng-template>
</docs-component-page>
