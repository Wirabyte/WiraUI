<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-floatlabel id="d-floatlabel">
          <input wuInputText id="fl-name" [(ngModel)]="name" />
          <label for="fl-name">{{ tx('ชื่อ-นามสกุล') }}</label>
        </wu-floatlabel>
      </docs-demo>
    </docs-section>

    <docs-section id="variants" [section]="sec['variants']">
      <docs-demo [html]="code['variants']">
        <wu-floatlabel variant="over">
          <input wuInputText id="fl-over" [(ngModel)]="over" />
          <label for="fl-over">Over</label>
        </wu-floatlabel>
        <wu-floatlabel variant="on">
          <input wuInputText id="fl-on" [(ngModel)]="on" />
          <label for="fl-on">On</label>
        </wu-floatlabel>
        <wu-floatlabel variant="in">
          <input wuInputText id="fl-in" [(ngModel)]="inside" />
          <label for="fl-in">In</label>
        </wu-floatlabel>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
