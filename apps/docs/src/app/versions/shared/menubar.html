<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-slot-note slot="start"></docs-slot-note>
      <docs-demo [html]="code['basic']" [ts]="ts['basic']" layout="stack">
        <wt-menubar id="d-mb-basic" [model]="local(items)" [ariaLabel]="tx('เมนูหลัก')">
          <ng-template #start>
            <span class="docs-menubar-brand"><i class="pi pi-book"></i> WiraSchool</span>
          </ng-template>
          <ng-template #end>
            <wt-button [label]="tx('ออกจากระบบ')" icon="pi pi-sign-out" severity="secondary" [text]="true"></wt-button>
          </ng-template>
        </wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="header" [section]="sec['header']">
      <docs-demo [html]="code['header']" layout="stack">
        <wt-menubar id="d-mb-header">
          <ng-template #start>
            <span class="docs-menubar-brand"><i class="pi pi-building"></i> {{ tx('ระบบรับสมัคร') }}</span>
          </ng-template>
          <ng-template #end>
            <div class="docs-menubar-actions">
              <wt-iconfield>
                <wt-inputicon icon="pi pi-search"></wt-inputicon>
                <input wtInputText [placeholder]="tx('ค้นหาผู้สมัคร')" [attr.aria-label]="tx('ค้นหาผู้สมัคร')" />
              </wt-iconfield>
              <wt-button icon="pi pi-bell" [rounded]="true" [text]="true" [ariaLabel]="tx('การแจ้งเตือน')"></wt-button>
              <wt-avatar icon="pi pi-user" shape="circle"></wt-avatar>
            </div>
          </ng-template>
        </wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="router" [section]="sec['router']">
      <docs-demo [html]="code['router']" [ts]="ts['router']" layout="stack">
        <wt-menubar id="d-mb-router" [model]="local(links)" [ariaLabel]="tx('หัวข้อในหน้านี้')"></wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="commands" [section]="sec['commands']">
      <docs-demo [html]="code['commands']" [ts]="ts['commands']" layout="stack">
        <wt-menubar id="d-mb-commands" [model]="local(fileItems)" [ariaLabel]="tx('เมนูเอกสาร')"></wt-menubar>
        <span class="docs-demo-output">{{ tx('สั่งล่าสุด') }}: <code id="d-mb-command">{{ lastCommand || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="states" [section]="sec['states']">
      <docs-demo [html]="code['states']" [ts]="ts['states']" layout="stack">
        <wt-menubar id="d-mb-states" [model]="local(accountItems)" [ariaLabel]="tx('บัญชี')"></wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-demo [html]="code['templates']" [ts]="ts['templates']" layout="stack">
        <wt-menubar id="d-mb-template" [model]="local(editorItems)" [ariaLabel]="tx('เมนูเอกสาร')">
          <ng-template #item let-item let-root="root" let-hasSubmenu="hasSubmenu">
            @if (item.icon) {
              <i [class]="item.icon"></i>
            }
            <span>{{ item.label }}</span>
            @if (item.shortcut) {
              <kbd class="docs-menubar-shortcut">{{ item.shortcut }}</kbd>
            }
            @if (hasSubmenu) {
              <i [class]="root ? 'pi pi-angle-down' : 'pi pi-angle-right'"></i>
            }
          </ng-template>
        </wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="narrow" [section]="sec['narrow']">
      <docs-demo [html]="code['narrow']" layout="stack">
        <wt-menubar id="d-mb-narrow" [model]="local(items)" breakpoint="9999px" [ariaLabel]="tx('เมนูหลัก')">
          <ng-template #start>
            <span class="docs-menubar-brand">WiraSchool</span>
          </ng-template>
          <ng-template #menuicon>
            <i class="pi pi-bars"></i>
          </ng-template>
        </wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="auto" [section]="sec['auto']">
      <docs-demo [html]="code['auto']" layout="stack">
        <wt-menubar id="d-mb-click" [model]="local(items)" [autoDisplay]="false" [ariaLabel]="tx('คลิกเพื่อเปิด')"></wt-menubar>
        <wt-menubar id="d-mb-hover" [model]="local(items)" [autoDisplay]="true" [autoHide]="true" [autoHideDelay]="300" [ariaLabel]="tx('ชี้เพื่อเปิด')"></wt-menubar>
      </docs-demo>
    </docs-section>

    <docs-section id="keyboard" [section]="sec['keyboard']"></docs-section>
    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
