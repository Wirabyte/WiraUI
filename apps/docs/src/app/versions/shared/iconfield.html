<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-iconfield id="d-iconfield">
          <wt-inputicon icon="pi pi-search"></wt-inputicon>
          <input wtInputText [placeholder]="tx('ค้นหา')" [attr.aria-label]="tx('ค้นหา')" />
        </wt-iconfield>
        <wt-iconfield>
          <input wtInputText [placeholder]="tx('อีเมล')" [attr.aria-label]="tx('อีเมล')" />
          <wt-inputicon icon="pi pi-envelope"></wt-inputicon>
        </wt-iconfield>
      </docs-demo>
    </docs-section>

    <docs-section id="position" [section]="sec['position']">
      <docs-demo [html]="code['position']">
        <wt-iconfield id="d-iconfield-right" iconPosition="right">
          <wt-inputicon icon="pi pi-search"></wt-inputicon>
          <input wtInputText [placeholder]="tx('ค้นหา')" [attr.aria-label]="tx('ค้นหา')" />
        </wt-iconfield>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
