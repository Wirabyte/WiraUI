<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-iconfield id="d-iconfield">
          <wu-inputicon icon="wi wi-search"></wu-inputicon>
          <input wuInputText [placeholder]="tx('ค้นหา')" [attr.aria-label]="tx('ค้นหา')" />
        </wu-iconfield>
        <wu-iconfield>
          <input wuInputText [placeholder]="tx('อีเมล')" [attr.aria-label]="tx('อีเมล')" />
          <wu-inputicon icon="wi wi-envelope"></wu-inputicon>
        </wu-iconfield>
      </docs-demo>
    </docs-section>

    <docs-section id="position" [section]="sec['position']">
      <docs-demo [html]="code['position']">
        <wu-iconfield id="d-iconfield-right" iconPosition="right">
          <wu-inputicon icon="wi wi-search"></wu-inputicon>
          <input wuInputText [placeholder]="tx('ค้นหา')" [attr.aria-label]="tx('ค้นหา')" />
        </wu-iconfield>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
