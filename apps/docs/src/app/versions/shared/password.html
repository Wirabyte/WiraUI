<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-password id="d-password" inputId="d-password-input" [(ngModel)]="password" [placeholder]="tx('รหัสผ่าน')" [ariaLabel]="tx('รหัสผ่าน')"></wu-password>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']" layout="stack">
        <wu-password [(ngModel)]="sizeValue" size="small" [feedback]="false" [placeholder]="tx('เล็ก')" [ariaLabel]="tx('เล็ก')"></wu-password>
        <wu-password [(ngModel)]="sizeValue" [feedback]="false" [placeholder]="tx('ปกติ')" [ariaLabel]="tx('ปกติ')"></wu-password>
        <wu-password [(ngModel)]="sizeValue" size="large" [feedback]="false" [placeholder]="tx('ใหญ่')" [ariaLabel]="tx('ใหญ่')"></wu-password>
      </docs-demo>
    </docs-section>

    <docs-section id="toggle" [section]="sec['toggle']">
      <docs-demo [html]="code['toggle']" layout="stack">
        <wu-password id="d-pin" inputId="d-pin-input" [(ngModel)]="pin" [feedback]="false" [toggleMask]="true" placeholder="PIN" ariaLabel="PIN"></wu-password>
      </docs-demo>
    </docs-section>

    <docs-section id="labels" [section]="sec['labels']">
      <docs-demo [html]="code['labels']" layout="stack">
        <wu-password
          [(ngModel)]="secret"
          [promptLabel]="tx('ตั้งรหัสอย่างน้อย 8 ตัว')"
          [weakLabel]="tx('ง่ายไป')"
          [mediumLabel]="tx('พอใช้')"
          [strongLabel]="tx('ดีมาก')"
          [strongRegex]="strongRule"
          [ariaLabel]="tx('รหัสผ่านใหม่')"
        ></wu-password>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']" layout="stack">
        <form [formGroup]="form" class="docs-demo-form">
          <wu-password formControlName="password" [toggleMask]="true" [fluid]="true" [placeholder]="tx('อย่างน้อย 8 ตัวอักษร')" [ariaLabel]="tx('รหัสผ่าน')"></wu-password>
        </form>
        <span class="docs-demo-output">valid: <code>{{ form.valid }}</code></span>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
