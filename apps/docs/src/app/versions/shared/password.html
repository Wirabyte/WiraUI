<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wt-password id="d-password" inputId="d-password-input" [(ngModel)]="password" placeholder="รหัสผ่าน" ariaLabel="รหัสผ่าน"></wt-password>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']" layout="stack">
        <wt-password [(ngModel)]="sizeValue" size="small" [feedback]="false" placeholder="เล็ก" ariaLabel="เล็ก"></wt-password>
        <wt-password [(ngModel)]="sizeValue" [feedback]="false" placeholder="ปกติ" ariaLabel="ปกติ"></wt-password>
        <wt-password [(ngModel)]="sizeValue" size="large" [feedback]="false" placeholder="ใหญ่" ariaLabel="ใหญ่"></wt-password>
      </docs-demo>
    </docs-section>

    <docs-section id="toggle" [section]="sec['toggle']">
      <docs-demo [html]="code['toggle']" layout="stack">
        <wt-password id="d-pin" inputId="d-pin-input" [(ngModel)]="pin" [feedback]="false" [toggleMask]="true" placeholder="PIN" ariaLabel="PIN"></wt-password>
      </docs-demo>
    </docs-section>

    <docs-section id="labels" [section]="sec['labels']">
      <docs-demo [html]="code['labels']" layout="stack">
        <wt-password
          [(ngModel)]="secret"
          promptLabel="ตั้งรหัสอย่างน้อย 8 ตัว"
          weakLabel="ง่ายไป"
          mediumLabel="พอใช้"
          strongLabel="ดีมาก"
          [strongRegex]="strongRule"
          ariaLabel="รหัสผ่านใหม่"
        ></wt-password>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']" layout="stack">
        <form [formGroup]="form" class="docs-demo-form">
          <wt-password formControlName="password" [toggleMask]="true" [fluid]="true" placeholder="อย่างน้อย 8 ตัวอักษร" ariaLabel="รหัสผ่าน"></wt-password>
        </form>
        <span class="docs-demo-output">valid: <code>{{ form.valid }}</code></span>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
