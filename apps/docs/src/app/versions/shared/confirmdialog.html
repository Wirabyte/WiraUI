<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
      <docs-code [code]="importCode" lang="ts"></docs-code>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <wt-button id="d-confirm-open" [label]="tx('ลบลูกค้า')" severity="danger" icon="pi pi-trash" (onClick)="remove()"></wt-button>
        <span class="docs-demo-output">result: <code id="d-confirm-result">{{ result || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="icons" [section]="sec['icons']">
      <docs-demo [html]="code['icons']" [ts]="ts['icons']">
        @for (i of icons; track i) {
          <wt-button [label]="i" size="small" severity="secondary" [outlined]="true" (onClick)="ask(i)"></wt-button>
        }
      </docs-demo>
    </docs-section>

    <docs-section id="key" [section]="sec['key']">
      <docs-demo [html]="code['key']" [ts]="ts['key']">
        <wt-button [label]="tx('ยืนยันด้านบน')" severity="secondary" (onClick)="askTop()"></wt-button>
        <span class="docs-demo-output">result: <code>{{ result || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="message"></docs-slot-note>
      <docs-demo [html]="code['templates']" [ts]="ts['templates']">
        <wt-button [label]="tx('คำเชิญเข้าทีม')" icon="pi pi-user" (onClick)="invite()"></wt-button>
        <span class="docs-demo-output">result: <code>{{ result || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="fallback" [section]="sec['fallback']">
      <docs-demo [html]="code['fallback']" [ts]="ts['fallback']">
        <wt-button [label]="tx('ถามโดยไม่มีกล่อง')" severity="secondary" (onClick)="askNowhere()"></wt-button>
        <span class="docs-demo-output">result: <code>{{ result || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <!-- The dialogs the demos above talk to. -->
    <wt-confirmdialog></wt-confirmdialog>
    <wt-confirmdialog key="top" position="top"></wt-confirmdialog>
    <wt-confirmdialog key="custom" #cd>
      <ng-template #message let-c>
        <div class="docs-confirm-invite">
          <wt-avatar [label]="tx('ก')" shape="circle" size="large"></wt-avatar>
          <p class="docs-demo-p">{{ c?.message }}</p>
        </div>
      </ng-template>
      <ng-template #footer>
        <wt-button [label]="tx('ไว้ก่อน')" [text]="true" (onClick)="cd.reject()"></wt-button>
        <wt-button [label]="tx('เข้าร่วม')" icon="pi pi-check" (onClick)="cd.accept()"></wt-button>
      </ng-template>
    </wt-confirmdialog>
  </ng-template>
</docs-component-page>
