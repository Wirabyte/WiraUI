<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-avatar label="ส"></wt-avatar>
        <wt-avatar icon="pi pi-user"></wt-avatar>
        <wt-avatar [image]="image" ariaLabel="สมชาย ใจดี"></wt-avatar>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wt-avatar label="A" shape="circle"></wt-avatar>
        <wt-avatar label="B" size="large" shape="circle"></wt-avatar>
        <wt-avatar label="C" size="xlarge" shape="circle"></wt-avatar>
        <wt-avatar label="D" size="xlarge"></wt-avatar>
      </docs-demo>
    </docs-section>

    <docs-section id="group" [section]="sec['group']">
      <docs-demo [html]="code['group']">
        <wt-avatar-group>
          <wt-avatar label="ส" shape="circle"></wt-avatar>
          <wt-avatar label="ก" shape="circle"></wt-avatar>
          <wt-avatar label="ม" shape="circle"></wt-avatar>
          <wt-avatar label="+5" shape="circle"></wt-avatar>
        </wt-avatar-group>
      </docs-demo>
    </docs-section>

    <docs-section id="fallback" [section]="sec['fallback']">
      <docs-code [code]="$any(code['fallback'])" lang="html"></docs-code>
    </docs-section>
  </ng-template>
</docs-component-page>
