<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-avatar [label]="tx('ส')"></wu-avatar>
        <wu-avatar icon="wi wi-user"></wu-avatar>
        <wu-avatar [image]="image" [ariaLabel]="tx('สมชาย ใจดี')"></wu-avatar>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wu-avatar label="A" shape="circle"></wu-avatar>
        <wu-avatar label="B" size="large" shape="circle"></wu-avatar>
        <wu-avatar label="C" size="xlarge" shape="circle"></wu-avatar>
        <wu-avatar label="D" size="xlarge"></wu-avatar>
      </docs-demo>
    </docs-section>

    <docs-section id="severity" [section]="sec['severity']">
      <docs-demo [html]="code['severity']">
        <wu-avatar id="d-av-info" icon="wi wi-ticket" severity="info" [ariaLabel]="tx('Ticket ที่เปิดอยู่')"></wu-avatar>
        <wu-avatar icon="wi wi-check-circle" severity="success" [ariaLabel]="tx('ปิดงานแล้ว')"></wu-avatar>
        <wu-avatar icon="wi wi-clock" severity="warn" [ariaLabel]="tx('รอตรวจสอบ')"></wu-avatar>
        <wu-avatar id="d-av-danger" icon="wi wi-exclamation-triangle" severity="danger" [ariaLabel]="tx('ล่าช้า')"></wu-avatar>
        <wu-avatar [label]="tx('ว')" severity="help" shape="circle"></wu-avatar>
        <wu-avatar [label]="tx('น')" severity="primary" shape="circle"></wu-avatar>
        <wu-avatar icon="wi wi-user" severity="secondary" shape="circle"></wu-avatar>
        <wu-avatar label="AI" severity="contrast" shape="circle"></wu-avatar>
      </docs-demo>
    </docs-section>

    <docs-section id="group" [section]="sec['group']">
      <docs-demo [html]="code['group']">
        <wu-avatar-group>
          <wu-avatar [label]="tx('ส')" shape="circle"></wu-avatar>
          <wu-avatar [label]="tx('ก')" shape="circle"></wu-avatar>
          <wu-avatar [label]="tx('ม')" shape="circle"></wu-avatar>
          <wu-avatar label="+5" shape="circle"></wu-avatar>
        </wu-avatar-group>
      </docs-demo>
    </docs-section>

    <docs-section id="fallback" [section]="sec['fallback']">
      <docs-code [code]="$any(code['fallback'])" lang="html"></docs-code>
    </docs-section>
  </ng-template>
</docs-component-page>
