<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-togglebutton inputId="d-pin" [(ngModel)]="pinned"></wu-togglebutton>
        <span class="docs-demo-output">pinned: <code id="d-pin-value">{{ pinned }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="sizes" [section]="sec['sizes']">
      <docs-demo [html]="code['sizes']">
        <wu-togglebutton [(ngModel)]="sizeValue" size="small" [onLabel]="tx('เล็ก')" [offLabel]="tx('เล็ก')"></wu-togglebutton>
        <wu-togglebutton [(ngModel)]="sizeValue" [onLabel]="tx('ปกติ')" [offLabel]="tx('ปกติ')"></wu-togglebutton>
        <wu-togglebutton [(ngModel)]="sizeValue" size="large" [onLabel]="tx('ใหญ่')" [offLabel]="tx('ใหญ่')"></wu-togglebutton>
      </docs-demo>
    </docs-section>

    <docs-section id="labels" [section]="sec['labels']">
      <docs-demo [html]="code['labels']">
        <wu-togglebutton
          [(ngModel)]="following"
          [onLabel]="tx('ติดตามแล้ว')"
          [offLabel]="tx('ติดตาม')"
          onIcon="wi wi-check"
          offIcon="wi wi-plus"
        ></wu-togglebutton>
      </docs-demo>
    </docs-section>

    <docs-section id="reactive" [section]="sec['reactive']">
      <docs-demo [html]="code['reactive']" [ts]="ts['reactive']">
        <form [formGroup]="form" class="docs-demo-form">
          <wu-togglebutton inputId="r-notify" formControlName="notify" [onLabel]="tx('แจ้งเตือนเปิด')" [offLabel]="tx('แจ้งเตือนปิด')"></wu-togglebutton>
        </form>
        <span class="docs-demo-output">value: <code id="r-notify-value">{{ form.getRawValue() | json }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="disabled" [section]="sec['disabled']">
      <docs-demo [html]="code['disabled']">
        <wu-togglebutton [ngModel]="true" [disabled]="true" [onLabel]="tx('ปิดอยู่')"></wu-togglebutton>
        <wu-togglebutton [invalid]="true" offLabel="Invalid"></wu-togglebutton>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
