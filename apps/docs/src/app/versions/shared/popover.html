<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wt-button id="d-popover-btn" [label]="tx('แชร์')" icon="pi pi-send" (onClick)="op.toggle($event)"></wt-button>
        <wt-popover #op id="d-popover">
          <div class="docs-popover-body">
            <p class="docs-demo-p">{{ tx('ส่งลิงก์ให้ทีม') }}</p>
            <input wtInputText value="https://example.com/r/10234" [readonly]="true" [fluid]="true" [attr.aria-label]="tx('ลิงก์')" />
          </div>
        </wt-popover>
      </docs-demo>
    </docs-section>

    <docs-section id="select" [section]="sec['select']">
      <docs-demo [html]="code['select']" [ts]="ts['select']">
        <wt-button id="d-popover-owner" [label]="owner || tx('เลือกผู้รับผิดชอบ')" icon="pi pi-user" severity="secondary" (onClick)="people.toggle($event)"></wt-button>
        <wt-popover #people>
          <div class="docs-popover-list">
            @for (p of local(team); track p) {
              <button type="button" class="docs-popover-item" (click)="owner = p; people.hide()">{{ p }}</button>
            }
          </div>
        </wt-popover>
        <span class="docs-demo-output">owner: <code id="d-popover-owner-value">{{ owner || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']">
        <wt-button [label]="tx('ตัวกรอง')" severity="secondary" [outlined]="true" (onClick)="filters.toggle($event)"></wt-button>
        <wt-popover #filters [showCloseIcon]="true" [dismissable]="false">
          <div class="docs-popover-body">
            <b>{{ tx('ตัวกรอง') }}</b>
            <wt-checkbox [ngModel]="true" [binary]="true" [label]="tx('ชำระแล้ว')"></wt-checkbox>
            <wt-checkbox [ngModel]="false" [binary]="true" [label]="tx('รอจัดส่ง')"></wt-checkbox>
          </div>
        </wt-popover>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
