<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']">
        <wu-button id="d-popover-btn" [label]="tx('แชร์')" icon="wi wi-send" (onClick)="op.toggle($event)"></wu-button>
        <wu-popover #op id="d-popover">
          <div class="docs-popover-body">
            <p class="docs-demo-p">{{ tx('ส่งลิงก์ให้ทีม') }}</p>
            <input wuInputText value="https://example.com/r/10234" [readonly]="true" [fluid]="true" [attr.aria-label]="tx('ลิงก์')" />
          </div>
        </wu-popover>
      </docs-demo>
    </docs-section>

    <docs-section id="select" [section]="sec['select']">
      <docs-demo [html]="code['select']" [ts]="ts['select']">
        <wu-button id="d-popover-owner" [label]="owner || tx('เลือกผู้รับผิดชอบ')" icon="wi wi-user" severity="secondary" (onClick)="people.toggle($event)"></wu-button>
        <wu-popover #people>
          <div class="docs-popover-list">
            @for (p of local(team); track p) {
              <button type="button" class="docs-popover-item" (click)="owner = p; people.hide()">{{ p }}</button>
            }
          </div>
        </wu-popover>
        <span class="docs-demo-output">owner: <code id="d-popover-owner-value">{{ owner || '-' }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="content" [section]="sec['content']">
      <docs-demo [html]="code['content']">
        <wu-button id="d-pop-notify" [label]="tx('ตั้งค่าการแจ้งเตือน')" icon="wi wi-bell" severity="secondary" (onClick)="notify.toggle($event)"></wu-button>
        <wu-popover #notify id="d-pop-notify-panel">
          <ng-template #content let-closeCallback="closeCallback">
            <p class="docs-demo-p">{{ tx('รับการแจ้งเตือนทางอีเมลทุกเช้า') }}</p>
            <wu-button id="d-pop-notify-ok" [label]="tx('ตกลง')" size="small" (onClick)="closeCallback()"></wu-button>
          </ng-template>
        </wu-popover>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']">
        <wu-button [label]="tx('ตัวกรอง')" severity="secondary" [outlined]="true" (onClick)="filters.toggle($event)"></wu-button>
        <wu-popover #filters [showCloseIcon]="true" [dismissable]="false">
          <div class="docs-popover-body">
            <b>{{ tx('ตัวกรอง') }}</b>
            <wu-checkbox [ngModel]="true" [binary]="true" [label]="tx('ชำระแล้ว')"></wu-checkbox>
            <wu-checkbox [ngModel]="false" [binary]="true" [label]="tx('รอจัดส่ง')"></wu-checkbox>
          </div>
        </wu-popover>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
