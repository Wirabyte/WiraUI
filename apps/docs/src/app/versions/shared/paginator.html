<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']" layout="stack">
        <ul class="docs-pg-list" id="d-pg-list">
          @for (s of pageItems; track s.id) {
            <li>{{ s.name }} · {{ s.room }}</li>
          }
        </ul>
        <wu-paginator id="d-pg-basic" [first]="first" [rows]="rows" [totalRecords]="students.length" (onPageChange)="changePage($event)"></wu-paginator>
      </docs-demo>
    </docs-section>

    <docs-section id="pagesize" [section]="sec['pagesize']">
      <docs-demo [html]="code['pagesize']" layout="stack">
        <wu-paginator
          id="d-pg-report"
          [first]="reportFirst"
          [rows]="reportRows"
          [totalRecords]="1250"
          [rowsPerPageOptions]="[10, 20, 50]"
          [showCurrentPageReport]="true"
          (onPageChange)="changeReport($event)"
        ></wu-paginator>
      </docs-demo>
    </docs-section>

    <docs-section id="report" [section]="sec['report']">
      <docs-api-table [group]="placeholders"></docs-api-table>
      <docs-demo [html]="code['report']" [ts]="ts['report']" layout="stack">
        <wu-paginator
          id="d-pg-report-own"
          [first]="reportFirst"
          [rows]="reportRows"
          [totalRecords]="1250"
          [showCurrentPageReport]="true"
          [currentPageReportTemplate]="tx('หน้า {currentPage} จาก {totalPages} · นักเรียน {totalRecords} คน')"
          (onPageChange)="changeReport($event)"
        ></wu-paginator>
      </docs-demo>
    </docs-section>

    <docs-section id="options" [section]="sec['options']">
      <docs-demo [html]="code['options']" layout="stack">
        <wu-paginator id="d-pg-options" [first]="optionFirst" [rows]="10" [totalRecords]="1250" [pageLinkSize]="3" [showFirstLastIcon]="false" (onPageChange)="changeOptions($event)"></wu-paginator>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="start"></docs-slot-note>
      <docs-demo [html]="code['templates']" layout="stack">
        <wu-paginator id="d-pg-slots" [first]="slotFirst" [rows]="10" [totalRecords]="120" (onPageChange)="changeSlots($event)">
          <ng-template #start>
            <wu-button id="d-pg-reload" icon="wi wi-refresh" [rounded]="true" [text]="true" [ariaLabel]="tx('โหลดใหม่')" (onClick)="reload()"></wu-button>
          </ng-template>
          <ng-template #end let-p>
            <span id="d-pg-right">{{ tx('หน้า') }} {{ p.page + 1 }} / {{ p.pageCount }}</span>
          </ng-template>
        </wu-paginator>
        <span class="docs-demo-output">reload: <code id="d-pg-reloads">{{ reloads }}</code></span>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
