<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']" layout="stack">
        <wu-steps id="d-steps-basic" [model]="local(steps)" [activeIndex]="activeIndex"></wu-steps>
        <div class="docs-steps-actions">
          <wu-button id="d-steps-back" [label]="tx('ย้อนกลับ')" icon="wi wi-chevron-left" severity="secondary" [text]="true" [disabled]="activeIndex === 0" (onClick)="back()"></wu-button>
          <wu-button id="d-steps-next" [label]="tx('ถัดไป')" icon="wi wi-chevron-right" iconPos="right" [disabled]="activeIndex === steps.length - 1" (onClick)="next()"></wu-button>
        </div>
        <span class="docs-demo-output">activeIndex: <code id="d-steps-basic-value">{{ activeIndex }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="interactive" [section]="sec['interactive']">
      <docs-demo [html]="code['interactive']" [ts]="ts['interactive']" layout="stack">
        <wu-steps id="d-steps-pick" [model]="local(admission)" [(activeIndex)]="current" [readonly]="false"></wu-steps>
        <span class="docs-demo-output">
          activeIndex: <code id="d-steps-pick-value">{{ current }}</code> · {{ tx('ขั้นล่าสุด') }}: <code id="d-steps-command">{{ lastStep || '-' }}</code>
        </span>
      </docs-demo>
    </docs-section>

    <docs-section id="disabled" [section]="sec['disabled']">
      <docs-demo [html]="code['disabled']" [ts]="ts['disabled']" layout="stack">
        <wu-steps id="d-steps-disabled" [model]="local(checks)" [(activeIndex)]="checkIndex" [readonly]="false"></wu-steps>
        <span class="docs-demo-output">activeIndex: <code id="d-steps-disabled-value">{{ checkIndex }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="layout" [section]="sec['layout']"></docs-section>
    <docs-section id="layout-bottom" [section]="sec['layout-bottom']" [level]="3">
      <docs-demo [html]="code['layout-bottom']" [ts]="ts['layout']" layout="stack">
        <wu-steps id="d-steps-bottom" [model]="local(enrolSteps)" [activeIndex]="enrolIndex"></wu-steps>
      </docs-demo>
    </docs-section>
    <docs-section id="layout-right" [section]="sec['layout-right']" [level]="3">
      <docs-demo [html]="code['layout-right']" layout="stack">
        <wu-steps id="d-steps-right" [model]="local(enrolSteps)" [activeIndex]="enrolIndex" labelPosition="right"></wu-steps>
      </docs-demo>
    </docs-section>
    <docs-section id="layout-vertical" [section]="sec['layout-vertical']" [level]="3">
      <docs-demo [html]="code['layout-vertical']" layout="stack">
        <wu-steps
          id="d-steps-vertical"
          [model]="local(enrolSteps)"
          [(activeIndex)]="enrolIndex"
          orientation="vertical"
          [readonly]="false"
        ></wu-steps>
        <span class="docs-demo-output">activeIndex: <code id="d-steps-vertical-value">{{ enrolIndex }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="keyboard" [section]="sec['keyboard']"></docs-section>
    <docs-section id="stepper" [section]="sec['stepper']">
      <p>
        <a id="d-steps-stepper-link" [routerLink]="['/', version.id, 'components', 'stepper']">{{ en() ? 'Open the Stepper page' : 'ไปหน้า Stepper' }}</a>
      </p>
    </docs-section>
    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
