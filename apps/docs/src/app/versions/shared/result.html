<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="status" [section]="sec['status']">
      <docs-demo [html]="code['status']" layout="stack">
        <wu-result
          id="d-rs-success"
          status="success"
          [title]="tx('ส่งใบสมัครเรียบร้อยแล้ว')"
          [subtitle]="tx('เลขที่ใบสมัคร 69-000123 ระบบส่งอีเมลยืนยันไปที่ wira@example.com แล้ว')"
        >
          <wu-button wuResultExtra [label]="tx('ดูใบสมัคร')"></wu-button>
          <wu-button wuResultExtra [label]="tx('กลับหน้าแรก')" severity="secondary" [outlined]="true"></wu-button>
        </wu-result>
        <div class="docs-demo-grid">
          <wu-result id="d-rs-error" status="error"></wu-result>
          <wu-result id="d-rs-info" status="info"></wu-result>
          <wu-result id="d-rs-warning" status="warning"></wu-result>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="codes" [section]="sec['codes']">
      <docs-demo [html]="code['codes']" layout="stack">
        <div class="docs-demo-grid">
          <wu-result id="d-rs-403" status="403">
            <wu-button wuResultExtra [label]="tx('ติดต่อผู้ดูแลระบบ')" severity="secondary" [outlined]="true"></wu-button>
          </wu-result>
          <wu-result id="d-rs-404" status="404">
            <wu-button wuResultExtra [label]="tx('กลับหน้าแรก')" icon="wi wi-house"></wu-button>
          </wu-result>
          <wu-result id="d-rs-500" status="500">
            <wu-button wuResultExtra [label]="tx('ย้อนกลับ')" severity="secondary" [text]="true"></wu-button>
          </wu-result>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="extra" [section]="sec['extra']">
      <docs-demo [html]="code['extra']" layout="stack">
        <wu-result id="d-rs-extra" status="error" [title]="tx('ชำระเงินไม่สำเร็จ')" [subtitle]="tx('บัตรถูกปฏิเสธโดยธนาคาร')">
          <wu-button wuResultExtra [label]="tx('ลองอีกครั้ง')" icon="wi wi-refresh"></wu-button>
          <wu-button wuResultExtra [label]="tx('กลับหน้าแรก')" severity="secondary" [outlined]="true"></wu-button>
          <p>{{ tx('ยอดที่ต้องชำระ 3,500.00 บาท') }}</p>
        </wu-result>
      </docs-demo>
    </docs-section>

    <docs-section id="custom" [section]="sec['custom']">
      <docs-demo [html]="code['custom']" layout="stack">
        <wu-result id="d-rs-icon" status="warning" icon="wi wi-wrench" [title]="tx('กำลังปิดปรับปรุงระบบ')" [subtitle]="tx('เปิดให้ใช้งานอีกครั้งเวลา 06:00 น.')"></wu-result>
        <wu-result id="d-rs-noicon" status="success" [showIcon]="false" [title]="tx('ส่งใบสมัครเรียบร้อยแล้ว')" subtitle=""></wu-result>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
