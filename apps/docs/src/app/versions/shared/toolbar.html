<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-toolbar id="d-toolbar" [ariaLabel]="tx('จัดการเอกสาร')">
          <wu-button wuToolbarStart [label]="tx('สร้างใหม่')" icon="wi wi-plus"></wu-button>
          <wu-button wuToolbarStart [label]="tx('ส่งออก')" severity="secondary" [outlined]="true"></wu-button>
          <wu-iconfield wuToolbarCenter>
            <wu-inputicon icon="wi wi-search"></wu-inputicon>
            <input wuInputText [placeholder]="tx('ค้นหา')" [attr.aria-label]="tx('ค้นหา')" />
          </wu-iconfield>
          <wu-button wuToolbarEnd icon="wi wi-bell" [ariaLabel]="tx('การแจ้งเตือน')" [text]="true" [rounded]="true"></wu-button>
        </wu-toolbar>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="start"></docs-slot-note>
      <docs-demo [html]="code['templates']" layout="stack">
        <wu-toolbar id="d-toolbar-tpl">
          <ng-template #start>
            <wu-button [label]="tx('สร้างใหม่')" icon="wi wi-plus"></wu-button>
          </ng-template>
          <ng-template #center>
            <b>{{ tx('จัดการเอกสาร') }}</b>
          </ng-template>
          <ng-template #end>
            <wu-button icon="wi wi-bell" [ariaLabel]="tx('การแจ้งเตือน')" [text]="true" [rounded]="true"></wu-button>
          </ng-template>
        </wu-toolbar>
      </docs-demo>
    </docs-section>

    <docs-section id="wrap" [section]="sec['wrap']">
      <docs-demo [html]="code['wrap']" layout="stack">
        <div style="max-width: min(300px, 100%)">
          <wu-toolbar id="d-toolbar-wrap">
            <wu-button [label]="tx('บันทึก')" icon="wi wi-check"></wu-button>
            <wu-button [label]="tx('ยกเลิก')" severity="secondary" [text]="true"></wu-button>
            <span wuToolbarEnd>{{ tx('บันทึกอัตโนมัติ · แก้ไขล่าสุด 10:24 น.') }}</span>
          </wu-toolbar>
        </div>
      </docs-demo>
    </docs-section>
  </ng-template>
</docs-component-page>
