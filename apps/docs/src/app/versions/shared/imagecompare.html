<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-slot-note slot="left"></docs-slot-note>
      <docs-demo [html]="code['basic']" layout="stack">
        <wu-imageCompare id="d-icmp" [ariaLabel]="tx('เทียบภาพก่อนและหลังปรับสี')" [style]="{ maxWidth: '36rem' }">
          <ng-template #left>
            <div class="docs-icmp-pic">
              <img [src]="photo" [alt]="tx('ภาพสีหลังปรับ')" />
              <span class="docs-icmp-tag docs-icmp-tag-end" id="d-icmp-after">{{ tx('หลัง') }}</span>
            </div>
          </ng-template>
          <ng-template #right>
            <div class="docs-icmp-pic">
              <img class="docs-icmp-old" [src]="photo" [alt]="tx('ภาพขาวดำก่อนปรับสี')" />
              <span class="docs-icmp-tag" id="d-icmp-before">{{ tx('ก่อน') }}</span>
            </div>
          </ng-template>
        </wu-imageCompare>
      </docs-demo>
    </docs-section>

    <docs-section id="value" [section]="sec['value']">
      <docs-demo [html]="code['value']" [ts]="ts['value']" layout="stack">
        <wu-imageCompare id="d-icmp-value" [(value)]="divider" [step]="5" [ariaLabel]="tx('เทียบภาพก่อนและหลังปรับสี')" [style]="{ maxWidth: '36rem' }">
          <ng-template #left>
            <div class="docs-icmp-pic"><img [src]="photo" [alt]="tx('ภาพสีหลังปรับ')" /></div>
          </ng-template>
          <ng-template #right>
            <div class="docs-icmp-pic"><img class="docs-icmp-old" [src]="photo" [alt]="tx('ภาพขาวดำก่อนปรับสี')" /></div>
          </ng-template>
        </wu-imageCompare>
        <div class="docs-demo-actions">
          <wu-button id="d-icmp-25" label="25%" severity="secondary" [outlined]="true" (onClick)="divider = 25"></wu-button>
          <wu-button id="d-icmp-50" label="50%" severity="secondary" [outlined]="true" (onClick)="divider = 50"></wu-button>
          <wu-button id="d-icmp-75" label="75%" severity="secondary" [outlined]="true" (onClick)="divider = 75"></wu-button>
          <span class="docs-demo-output">{{ tx('ตำแหน่งเส้นแบ่ง') }}: <code id="d-icmp-value-out">{{ divider }}</code></span>
        </div>
      </docs-demo>
    </docs-section>

    <docs-section id="keyboard" [section]="sec['keyboard']"></docs-section>
    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
