<docs-component-page [doc]="doc">
  <ng-template docsFeatures>
    <docs-section id="import" [section]="sec['import']">
      <docs-import [names]="doc"></docs-import>
    </docs-section>

    <docs-section id="basic" [section]="sec['basic']">
      <docs-demo [html]="code['basic']" [ts]="ts['basic']">
        <wt-button id="d-dr-open" [label]="tx('เปิดเมนู')" icon="wi wi-bars" (onClick)="menuOpen = true"></wt-button>
        <wt-drawer id="d-dr-menu" [header]="tx('เมนู')" [(visible)]="menuOpen" (onShow)="logDrawer('onShow')" (onHide)="logDrawer('onHide')">
          <wt-menu id="d-dr-menu-list" [model]="local(menuItems)" [style]="{ width: '100%', border: 'none' }" [ariaLabel]="tx('เมนู')"></wt-menu>
        </wt-drawer>
        <span class="docs-demo-output">
          command: <code id="d-dr-page">{{ lastPage || '-' }}</code> · event: <code id="d-dr-events">{{ drawerEvents.join(' · ') || '-' }}</code>
        </span>
      </docs-demo>
    </docs-section>

    <docs-section id="position" [section]="sec['position']">
      <docs-demo [html]="code['position']" [ts]="ts['position']">
        <wt-button id="d-dr-left" [label]="tx('ซ้าย')" severity="secondary" (onClick)="openAt('left')"></wt-button>
        <wt-button id="d-dr-right" [label]="tx('ขวา')" severity="secondary" (onClick)="openAt('right')"></wt-button>
        <wt-button id="d-dr-top" [label]="tx('บน')" severity="secondary" (onClick)="openAt('top')"></wt-button>
        <wt-button id="d-dr-bottom" [label]="tx('ล่าง')" severity="secondary" (onClick)="openAt('bottom')"></wt-button>
        <wt-button id="d-dr-full" [label]="tx('เต็มจอ')" severity="secondary" (onClick)="openAt('full')"></wt-button>
        <wt-drawer id="d-dr-notice" [header]="tx('แจ้งเตือน')" [position]="side" [(visible)]="noticeOpen">
          <p class="docs-demo-p">{{ tx('มีการบ้านใหม่ 2 วิชา') }}</p>
          <p class="docs-demo-p">{{ tx('ประกาศวันหยุดเพิ่ม') }}</p>
        </wt-drawer>
      </docs-demo>
    </docs-section>

    <docs-section id="templates" [section]="sec['templates']">
      <docs-slot-note slot="footer"></docs-slot-note>
      <docs-demo [html]="code['templates']" [ts]="ts['templates']">
        <wt-button id="d-dr-contact" [label]="tx('แก้ไขข้อมูลติดต่อ')" icon="wi wi-pencil" severity="secondary" (onClick)="contactOpen = true"></wt-button>
        <wt-drawer id="d-dr-form" [(visible)]="contactOpen" position="right" [style]="{ width: '24rem' }">
          <ng-template #header>
            <span class="docs-dr-person">
              <wt-avatar icon="wi wi-user" shape="circle"></wt-avatar>
              <span>{{ tx('สมหญิง ใจดี') }}</span>
            </span>
          </ng-template>
          <div class="docs-demo-labelled">
            <label for="d-dr-phone">{{ tx('เบอร์โทรผู้ปกครอง') }}</label>
            <input id="d-dr-phone" name="parentPhone" wtInputText [(ngModel)]="parentPhone" />
          </div>
          <ng-template #footer>
            <wt-button id="d-dr-cancel" [label]="tx('ยกเลิก')" severity="secondary" [text]="true" (onClick)="contactOpen = false"></wt-button>
            <wt-button id="d-dr-save" [label]="tx('บันทึก')" icon="wi wi-check" [loading]="isApiSaving" (onClick)="saveContact()"></wt-button>
          </ng-template>
        </wt-drawer>
        <span class="docs-demo-output">saved: <code id="d-dr-saved">{{ savedContact }}</code></span>
      </docs-demo>
    </docs-section>

    <docs-section id="headless" [section]="sec['headless']">
      <docs-demo [html]="code['headless']">
        <wt-button id="d-dr-preview" [label]="tx('ตัวอย่างใบประกาศ')" icon="wi wi-image" severity="secondary" (onClick)="previewOpen = true"></wt-button>
        <wt-drawer #preview id="d-dr-headless" [(visible)]="previewOpen" position="bottom" [style]="{ height: '16rem' }">
          <ng-template #headless>
            <div class="docs-dr-preview">
              <img src="samples/card-cover.svg" [alt]="tx('ตัวอย่างใบประกาศ')" />
              <wt-button id="d-dr-preview-close" icon="wi wi-times" [rounded]="true" [text]="true" [ariaLabel]="tx('ปิด')" (onClick)="preview.hide()"></wt-button>
            </div>
          </ng-template>
        </wt-drawer>
      </docs-demo>
    </docs-section>

    <docs-section id="modal" [section]="sec['modal']">
      <docs-demo [html]="code['modal']" [ts]="ts['modal']">
        <wt-button id="d-dr-chat" [label]="tx('แชตกับครู')" icon="wi wi-inbox" severity="secondary" (onClick)="chatOpen = true"></wt-button>
        <wt-drawer id="d-dr-chat-panel" [header]="tx('แชตกับครู')" position="right" [modal]="false" [(visible)]="chatOpen">
          <input id="d-dr-message" name="message" wtInputText [(ngModel)]="message" [placeholder]="tx('พิมพ์ข้อความ')" />
        </wt-drawer>
      </docs-demo>
    </docs-section>

    <docs-section id="migration" [section]="sec['migration']"></docs-section>
  </ng-template>
</docs-component-page>
