<div
  #root
  class="wu-select wu-multiselect p-multiselect p-component"
  [ngClass]="styleClass || ''"
  [class.wu-select-open]="open"
  [class.p-multiselect-open]="open"
  [class.wu-select-focus]="focused || open"
  [class.p-focus]="focused || open"
  [class.wu-select-disabled]="disabled"
  [class.p-disabled]="disabled"
  [class.wu-select-invalid]="invalid"
  [class.p-invalid]="invalid"
  [class.wu-select-filled]="variant === 'filled'"
  [class.wu-select-sm]="sizeKey === 'sm'"
  [class.wu-select-lg]="sizeKey === 'lg'"
  [class.wu-select-loading]="loading"
  [class.wu-multiselect-chips]="chips"
  [class.p-multiselect-chip]="display === 'chip'"
  [class.p-multiselect-clearable]="clearable"
  (mousedown)="fieldMousedown($event)"
  (click)="fieldClick($event)"
>
  <input
    #focusInput
    type="text"
    class="wu-select-input p-hidden-accessible"
    role="combobox"
    readonly
    inputmode="none"
    autocomplete="off"
    [id]="inputId || baseId"
    [attr.tabindex]="disabled ? -1 : tabindex"
    [attr.aria-label]="ariaLabel || (ariaLabelledBy ? null : placeholderText || null)"
    [attr.aria-labelledby]="ariaLabelledBy || null"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="open ? listId : null"
    [attr.aria-activedescendant]="filter && showHeader ? null : activeId"
    [attr.aria-disabled]="disabled || null"
    [attr.aria-busy]="loading || null"
    [disabled]="disabled"
    (keydown)="keydown($event)"
    (focus)="fieldFocus($event)"
  />
  <div class="wu-select-label wu-multiselect-label p-multiselect-label" [class.wu-select-placeholder]="!filled" [class.p-placeholder]="!filled">
    <ng-container *ngIf="selectedItemsTemplate; else ownLabel">
      <ng-container *ngTemplateOutlet="selectedItemsTemplate; context: selectedItemsContext"></ng-container>
    </ng-container>
    <ng-template #ownLabel>
      <ng-container *ngIf="chips; else commaLabel">
        <span *ngFor="let item of selectedItems; trackBy: trackIndex" class="wu-multiselect-chip p-multiselect-token">
          <span class="wu-multiselect-chip-label p-multiselect-token-label">{{ item.label }}</span>
          <button
            *ngIf="!disabled && !readonly"
            type="button"
            class="wu-multiselect-chip-remove p-multiselect-token-icon"
            tabindex="-1"
            [attr.aria-label]="removeLabel(item)"
            (click)="remove(item.value, $event)"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"></path></svg>
          </button>
        </span>
        <span class="wu-multiselect-more p-multiselect-token" hidden aria-hidden="true"></span>
      </ng-container>
      <ng-template #commaLabel>{{ labelText || ' ' }}</ng-template>
    </ng-template>
  </div>
  <button *ngIf="clearable" type="button" class="wu-select-clear p-multiselect-clear-icon" tabindex="-1" [attr.aria-label]="t.clear" (click)="clear($event)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
  </button>
  <span class="wu-select-dropdown p-multiselect-trigger" aria-hidden="true">
    <span *ngIf="loading; else arrow" class="wu-select-spinner p-multiselect-loading-icon"></span>
    <ng-template #arrow>
      <ng-container *ngIf="dropdownIconTemplate; else chevron"><ng-container *ngTemplateOutlet="dropdownIconTemplate"></ng-container></ng-container>
      <ng-template #chevron>
        <svg class="p-multiselect-trigger-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"></path></svg>
      </ng-template>
    </ng-template>
  </span>
</div>

<div
  *ngIf="open"
  #panel
  popover="manual"
  class="wu-select-overlay wu-multiselect-overlay p-multiselect-panel p-component"
  [ngClass]="panelStyleClass || ''"
  [ngStyle]="panelStyle || null"
  (mousedown)="panelMousedown($event)"
>
  <ng-container *ngIf="headerTemplate"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container>
  <div *ngIf="showHeader && (showToggleAll || filter)" class="wu-select-header wu-multiselect-header p-multiselect-header">
    <span
      *ngIf="showToggleAll"
      class="wu-checkbox wu-multiselect-toggle-all"
      role="checkbox"
      tabindex="-1"
      [class.wu-checkbox-checked]="allSelected"
      [attr.aria-checked]="allSelected ? true : someSelected ? 'mixed' : false"
      [attr.aria-label]="t.selectAll"
      (click)="toggleAll($event)"
    >
      <span class="wu-checkbox-control p-checkbox p-component" aria-hidden="true">
        <span class="wu-checkbox-box p-checkbox-box" [class.p-highlight]="allSelected" [class.wu-checkbox-mixed]="someSelected">
          <svg class="wu-checkbox-icon p-checkbox-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
      </span>
    </span>
    <div *ngIf="filter" class="wu-select-filter-wrap p-multiselect-filter-container">
      <input
        #filterInput
        type="text"
        class="wu-inputtext wu-select-filter p-multiselect-filter p-inputtext"
        role="searchbox"
        autocomplete="off"
        [value]="filterText"
        [attr.placeholder]="filterPlaceholder || t.search"
        [attr.aria-label]="ariaFilterLabel || t.search"
        [attr.aria-controls]="listId"
        [attr.aria-activedescendant]="activeId"
        (input)="search($event)"
        (keydown)="keydown($event)"
      />
      <svg class="wu-select-filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
    </div>
  </div>
  <div class="wu-select-list-container p-multiselect-items-wrapper" [style.max-height]="scrollHeight">
    <ul #listBox class="wu-select-list p-multiselect-items" role="listbox" aria-multiselectable="true" [id]="listId" [attr.aria-label]="ariaLabel || placeholderText || null">
      <ng-container *ngFor="let item of visible; let i = index; trackBy: trackIndex">
        <li *ngIf="item.group; else option" class="wu-select-group p-multiselect-item-group" role="presentation">
          <ng-container *ngIf="groupTemplate; else groupLabel">
            <ng-container *ngTemplateOutlet="groupTemplate; context: { $implicit: item.option }"></ng-container>
          </ng-container>
          <ng-template #groupLabel>{{ item.label }}</ng-template>
        </li>
        <ng-template #option>
          <li
            class="wu-select-option wu-multiselect-option p-multiselect-item"
            role="option"
            [id]="optionId(i)"
            [class.wu-select-option-selected]="isSelected(item)"
            [class.p-highlight]="isSelected(item)"
            [class.wu-select-option-active]="i === activeIndex"
            [class.p-focus]="i === activeIndex"
            [class.wu-select-option-disabled]="item.disabled || isBlocked(item)"
            [class.p-disabled]="item.disabled || isBlocked(item)"
            [attr.aria-selected]="isSelected(item)"
            [attr.aria-disabled]="item.disabled || isBlocked(item) || null"
            (click)="toggleItem(item, $event)"
            (mousemove)="hover(i)"
          >
            <span class="wu-checkbox wu-multiselect-check" [class.wu-checkbox-checked]="isSelected(item)" aria-hidden="true">
              <span class="wu-checkbox-control p-checkbox p-component">
                <span class="wu-checkbox-box p-checkbox-box" [class.p-highlight]="isSelected(item)">
                  <svg class="wu-checkbox-icon p-checkbox-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>
                </span>
              </span>
            </span>
            <ng-container *ngIf="itemTemplate; else optionLabel">
              <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item.option, selected: isSelected(item), index: i }"></ng-container>
            </ng-container>
            <ng-template #optionLabel><span class="wu-select-option-label">{{ item.label || ' ' }}</span></ng-template>
          </li>
        </ng-template>
      </ng-container>
      <li *ngIf="!visible.length" class="wu-select-empty p-multiselect-empty-message" role="option" aria-disabled="true">
        <ng-container *ngIf="emptyTemplate; else emptyLabel"><ng-container *ngTemplateOutlet="emptyTemplate"></ng-container></ng-container>
        <ng-template #emptyLabel>{{ emptyText }}</ng-template>
      </li>
    </ul>
  </div>
  <ng-container *ngIf="footerTemplate"><ng-container *ngTemplateOutlet="footerTemplate"></ng-container></ng-container>
</div>
