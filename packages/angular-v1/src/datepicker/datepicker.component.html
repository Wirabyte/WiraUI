<span
  #root
  class="wu-datepicker p-calendar"
  [ngClass]="styleClass || ''"
  [ngStyle]="style || null"
  [class.wu-datepicker-has-dropdown]="hasDropdown && !inline"
  [class.p-calendar-w-btn]="hasDropdown && !inline"
  [class.wu-datepicker-has-input-icon]="hasInputIcon && !inline"
  [class.wu-datepicker-has-clear]="hasClear && !inline"
  [class.p-calendar-clearable]="hasClear"
  [class.p-calendar-timeonly]="timeOnly"
  [class.p-calendar-disabled]="isDisabled"
>
  <span *ngIf="!inline" class="wu-datepicker-field">
    <input
      #input
      type="text"
      role="combobox"
      autocomplete="off"
      aria-autocomplete="none"
      aria-haspopup="dialog"
      class="wu-inputtext p-inputtext p-component p-element wu-datepicker-input"
      [class.wu-inputtext-sm]="sizeKey === 'sm'"
      [class.p-inputtext-sm]="sizeKey === 'sm'"
      [class.wu-inputtext-lg]="sizeKey === 'lg'"
      [class.p-inputtext-lg]="sizeKey === 'lg'"
      [ngClass]="inputStyleClass || ''"
      [ngStyle]="inputStyle || null"
      [class.wu-invalid]="invalid"
      [class.p-invalid]="invalid"
      [class.wu-filled]="filled"
      [class.p-filled]="filled"
      [id]="id"
      [attr.name]="name || null"
      [attr.placeholder]="placeholder || null"
      [attr.aria-label]="ariaLabel || null"
      [attr.aria-labelledby]="ariaLabelledBy || null"
      [attr.aria-invalid]="invalid || null"
      [attr.aria-required]="required || null"
      [attr.aria-expanded]="open"
      [attr.aria-controls]="open ? panelId : null"
      [attr.tabindex]="tabindex ?? null"
      [attr.inputmode]="touchLayout ? 'none' : null"
      [value]="inputText"
      [disabled]="isDisabled"
      [readOnly]="readonlyInput"
      (click)="show()"
      (focus)="inputFocus($event)"
      (blur)="inputBlur($event)"
      (input)="typed($event)"
      (keydown)="inputKeydown($event)"
    />
    <button
      *ngIf="hasClear"
      type="button"
      tabindex="-1"
      class="wu-datepicker-clear p-calendar-clear-icon"
      [attr.aria-label]="t.clear"
      (click)="clearField()"
    >
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"></path></svg>
    </button>
    <span
      *ngIf="hasInputIcon"
      class="wu-datepicker-input-icon p-datepicker-icon"
      aria-hidden="true"
      (click)="inputIconTemplate ? null : toggle()"
    >
      <ng-container *ngIf="inputIconTemplate; else defaultIcon">
        <ng-container *ngTemplateOutlet="inputIconTemplate; context: iconContext"></ng-container>
      </ng-container>
    </span>
  </span>
  <button
    *ngIf="hasDropdown && !inline"
    type="button"
    class="wu-datepicker-dropdown p-datepicker-trigger p-button p-component p-button-icon-only"
    [attr.aria-label]="t.chooseDate"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="open ? panelId : null"
    [disabled]="isDisabled"
    (click)="toggle()"
  >
    <ng-container *ngIf="triggerIconTemplate; else defaultIcon">
      <ng-container *ngTemplateOutlet="triggerIconTemplate; context: iconContext"></ng-container>
    </ng-container>
  </button>

  <div
    #panel
    *ngIf="inline || open"
    role="dialog"
    class="wu-datepicker-panel p-datepicker p-component"
    [ngClass]="panelStyleClass || ''"
    [ngStyle]="panelStyle || null"
    [id]="panelId"
    [attr.popover]="inline ? null : 'manual'"
    [attr.aria-label]="t.chooseDate"
    [class.wu-datepicker-popup]="!inline"
    [class.wu-datepicker-inline]="inline"
    [class.p-datepicker-inline]="inline"
    [class.p-datepicker-timeonly]="timeOnly"
    [class.p-datepicker-touch-ui]="touchUI"
    [class.wu-datepicker-disabled]="inline && isDisabled"
    [class.p-disabled]="isDisabled"
    (mousedown)="panelMousedown($event)"
    (keydown)="panelKeydown($event)"
  >
    <div *ngIf="!timeOnly" class="p-datepicker-group-container">
      <div class="p-datepicker-group">
        <div class="wu-datepicker-header p-datepicker-header">
          <button
            type="button"
            class="wu-datepicker-nav p-datepicker-prev p-link"
            [attr.aria-label]="previousLabel"
            [disabled]="!state.canGo(-1) || isDisabled"
            (click)="go(-1)"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"></path></svg>
          </button>
          <div class="wu-datepicker-title p-datepicker-title">
            <button
              *ngIf="state.view === 'date'"
              type="button"
              class="wu-datepicker-title-button p-datepicker-month p-link"
              [disabled]="isDisabled"
              (click)="showView('month')"
            >{{ state.monthLabel }}</button>
            <button
              *ngIf="state.view !== 'year'"
              type="button"
              class="wu-datepicker-title-button p-datepicker-year p-link"
              [disabled]="isDisabled"
              (click)="showView('year')"
            >{{ state.yearLabel }}</button>
            <span *ngIf="state.view === 'year'" class="wu-datepicker-decade p-datepicker-decade" aria-live="polite">{{ state.decadeLabel }}</span>
          </div>
          <button
            type="button"
            class="wu-datepicker-nav p-datepicker-next p-link"
            [attr.aria-label]="nextLabel"
            [disabled]="!state.canGo(1) || isDisabled"
            (click)="go(1)"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"></path></svg>
          </button>
        </div>

        <div class="wu-datepicker-body p-datepicker-calendar-container">
          <table
            *ngIf="state.view === 'date'"
            role="grid"
            class="wu-datepicker-days p-datepicker-calendar"
            [attr.aria-label]="state.monthLabel + ' ' + state.yearLabel"
            (keydown)="gridKeydown($event)"
          >
            <thead>
              <tr>
                <th *ngFor="let d of weekdays" scope="col" [attr.abbr]="d.long"><span>{{ d.short }}</span></th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let week of weeks; trackBy: trackIndex">
                <td
                  *ngFor="let c of week; trackBy: trackIndex"
                  [class.wu-datepicker-other-month]="c.otherMonth"
                  [class.p-datepicker-other-month]="c.otherMonth"
                  [class.wu-datepicker-today]="c.today"
                  [class.p-datepicker-today]="c.today"
                  [attr.aria-selected]="c.selected || c.inRange"
                  [attr.aria-disabled]="!c.selectable || null"
                >
                  <span
                    *ngIf="showOtherMonths || !c.otherMonth"
                    role="button"
                    class="wu-datepicker-cell"
                    [class.wu-datepicker-selected]="c.selected"
                    [class.wu-datepicker-in-range]="c.inRange"
                    [class.p-highlight]="(c.selected || c.inRange) && c.selectable"
                    [class.p-disabled]="!c.selectable"
                    [attr.tabindex]="c.focused ? 0 : -1"
                    [attr.aria-label]="c.label"
                    [attr.aria-current]="c.today ? 'date' : null"
                    [attr.aria-disabled]="!c.selectable || null"
                    [attr.data-date]="c.date.getFullYear() + '-' + (c.date.getMonth() + 1) + '-' + c.date.getDate()"
                    (click)="pickDay(c)"
                  ><ng-container *ngIf="dateTemplate; else plainDay"><ng-container *ngTemplateOutlet="dateTemplate; context: { $implicit: c }"></ng-container></ng-container><ng-template #plainDay>{{ c.day }}</ng-template></span>
                </td>
              </tr>
            </tbody>
          </table>

          <div
            *ngIf="state.view === 'month'"
            class="wu-datepicker-grid p-monthpicker"
            role="group"
            [attr.aria-label]="state.yearLabel"
            (keydown)="gridKeydown($event)"
          >
            <span
              *ngFor="let m of months; trackBy: trackIndex"
              role="button"
              class="wu-datepicker-cell p-monthpicker-month"
              [class.wu-datepicker-selected]="m.selected"
              [class.p-highlight]="m.selected"
              [class.p-disabled]="!m.selectable"
              [class.wu-datepicker-current]="m.current"
              [attr.tabindex]="m.focused ? 0 : -1"
              [attr.aria-label]="t.monthNames[m.month] + ' ' + state.yearLabel"
              [attr.aria-pressed]="m.selected"
              [attr.aria-disabled]="!m.selectable || null"
              (click)="pickMonth(m)"
            >{{ m.label }}</span>
          </div>

          <div
            *ngIf="state.view === 'year'"
            class="wu-datepicker-grid p-yearpicker"
            role="group"
            [attr.aria-label]="state.decadeLabel"
            (keydown)="gridKeydown($event)"
          >
            <span
              *ngFor="let y of years; trackBy: trackIndex"
              role="button"
              class="wu-datepicker-cell p-yearpicker-year"
              [class.wu-datepicker-selected]="y.selected"
              [class.wu-datepicker-outside]="y.outside"
              [class.p-highlight]="y.selected"
              [class.p-disabled]="!y.selectable"
              [attr.tabindex]="y.focused ? 0 : -1"
              [attr.aria-pressed]="y.selected"
              [attr.aria-disabled]="!y.selectable || null"
              (click)="pickYear(y)"
            >{{ y.label }}</span>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="showTime || timeOnly" class="wu-datepicker-time p-timepicker">
      <ng-container *ngFor="let u of timeUnits; let last = last">
        <div class="wu-datepicker-time-field" [ngClass]="'p-' + u + '-picker'">
          <button
            type="button"
            tabindex="-1"
            class="wu-datepicker-time-step p-link"
            [attr.aria-label]="t[u] + ' +'"
            [disabled]="isDisabled"
            (mousedown)="$event.preventDefault()"
            (pointerdown)="startRepeat($event, u, 1)"
            (pointerup)="stopRepeat()"
            (pointerleave)="stopRepeat()"
            (pointercancel)="stopRepeat()"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4"></path></svg>
          </button>
          <input
            type="text"
            role="spinbutton"
            inputmode="numeric"
            maxlength="2"
            autocomplete="off"
            class="wu-datepicker-time-input"
            [attr.data-unit]="u"
            [attr.aria-label]="t[u]"
            [attr.aria-valuenow]="state.timeText(u)"
            [attr.aria-valuemin]="u === 'hour' && hourFormat === '12' ? 1 : 0"
            [attr.aria-valuemax]="timeMax(u)"
            [value]="timeText(u)"
            [readOnly]="timeReadonlyInput"
            [disabled]="isDisabled"
            (focus)="timeFocus(u, $event)"
            (input)="timeTyped(u, $event)"
            (blur)="timeBlur(u)"
            (keydown)="timeKeydown(u, $event)"
          />
          <button
            type="button"
            tabindex="-1"
            class="wu-datepicker-time-step p-link"
            [attr.aria-label]="t[u] + ' −'"
            [disabled]="isDisabled"
            (mousedown)="$event.preventDefault()"
            (pointerdown)="startRepeat($event, u, -1)"
            (pointerup)="stopRepeat()"
            (pointerleave)="stopRepeat()"
            (pointercancel)="stopRepeat()"
          >
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
          </button>
        </div>
        <span *ngIf="!last" class="wu-datepicker-time-separator p-separator" aria-hidden="true">:</span>
      </ng-container>
      <div *ngIf="hourFormat === '12'" class="wu-datepicker-time-field p-ampm-picker">
        <button type="button" tabindex="-1" class="wu-datepicker-time-step p-link" aria-hidden="true" [disabled]="isDisabled" (mousedown)="$event.preventDefault()" (click)="togglePeriod()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"></path></svg>
        </button>
        <button
          type="button"
          role="spinbutton"
          class="wu-datepicker-time-period"
          [attr.aria-valuetext]="state.pm ? t.pm : t.am"
          [disabled]="isDisabled"
          (click)="togglePeriod()"
          (keydown)="periodKeydown($event)"
        >{{ state.pm ? t.pm : t.am }}</button>
        <button type="button" tabindex="-1" class="wu-datepicker-time-step p-link" aria-hidden="true" [disabled]="isDisabled" (mousedown)="$event.preventDefault()" (click)="togglePeriod()">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
        </button>
      </div>
    </div>

    <div *ngIf="showButtonBar" class="wu-datepicker-buttonbar p-datepicker-buttonbar">
      <button type="button" class="wu-datepicker-bar-button p-button p-button-text" [disabled]="isDisabled" (click)="today($event)">{{ t.today }}</button>
      <button type="button" class="wu-datepicker-bar-button p-button p-button-text" [disabled]="isDisabled" (click)="clearAll($event)">{{ t.clear }}</button>
    </div>
  </div>
</span>

<ng-template #defaultIcon>
  <i *ngIf="icon; else builtInIcon" [class]="icon + ' wu-datepicker-icon-custom'"></i>
</ng-template>
<ng-template #builtInIcon>
  <ng-container *ngIf="timeOnly; else calendarIcon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"></circle><path d="M8 4.75V8l2.25 1.5"></path></svg></ng-container>
</ng-template>
<ng-template #calendarIcon>
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"></rect><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"></path></svg>
</ng-template>
