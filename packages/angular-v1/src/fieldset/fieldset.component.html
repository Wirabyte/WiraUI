<fieldset [class]="classes" [style]="rootStyle">
  <legend class="wu-fieldset-legend p-fieldset-legend">
    <button
      *ngIf="toggleable; else plainLegend"
      type="button"
      class="wu-fieldset-toggle"
      [attr.aria-expanded]="!isCollapsed"
      [attr.aria-controls]="contentId"
      (click)="toggle()"
    >
      <svg *ngIf="isCollapsed" class="p-fieldset-toggler" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
      <svg *ngIf="!isCollapsed" class="p-fieldset-toggler" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg>
      <span class="p-fieldset-legend-text"><ng-container *ngIf="headerTemplate; else legendText"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container></span>
    </button>
    <ng-template #plainLegend>
      <span class="wu-fieldset-legend-label p-fieldset-legend-text"><ng-container *ngIf="headerTemplate; else legendText"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container></span>
    </ng-template>
  </legend>
  <div class="wu-fieldset-content-container p-toggleable-content" [id]="contentId" [attr.inert]="isCollapsed ? '' : null">
    <div class="wu-fieldset-content-inner">
      <div class="wu-fieldset-content p-fieldset-content"><ng-content></ng-content></div>
    </div>
  </div>
</fieldset>
<ng-template #legendText>{{ legend }}</ng-template>
