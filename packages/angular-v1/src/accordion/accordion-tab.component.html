<div [class]="classes">
  <button
    type="button"
    class="wt-accordion-header p-accordion-header p-accordion-header-link"
    [class.p-highlight]="active"
    [id]="headerId"
    [attr.aria-expanded]="active"
    [attr.aria-controls]="contentId"
    [disabled]="disabled"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <svg class="wt-accordion-toggle-icon p-accordion-toggle-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
    <span class="wt-accordion-header-text p-accordion-header-text">{{ header }}</span>
  </button>
  <div class="wt-accordion-content-container p-toggleable-content" [id]="contentId" role="region" [attr.aria-labelledby]="headerId" [attr.inert]="active ? null : ''">
    <div class="wt-accordion-content-inner">
      <div class="wt-accordion-content p-accordion-content"><ng-content></ng-content></div>
    </div>
  </div>
</div>
