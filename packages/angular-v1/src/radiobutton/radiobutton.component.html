<label class="wu-radiobutton" [class]="styleClass || ''" [style]="rootStyle" [class.wu-radiobutton-checked]="checked" [class.wu-radiobutton-disabled]="isDisabled" [class.wu-invalid]="invalid">
  <input
    type="radio"
    class="wu-radiobutton-input"
    [id]="id"
    [attr.name]="name || null"
    [checked]="checked"
    [disabled]="isDisabled"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-label]="ariaLabel || null"
    (change)="select($event)"
    (blur)="onTouched()"
  />
  <span class="wu-radiobutton-control p-radiobutton p-component" [class.p-radiobutton-checked]="checked" [class.p-radiobutton-disabled]="isDisabled" aria-hidden="true">
    <span class="wu-radiobutton-box p-radiobutton-box" [class.p-highlight]="checked" [class.p-disabled]="isDisabled"><span class="wu-radiobutton-dot p-radiobutton-icon"></span></span>
  </span>
  <span *ngIf="label" class="wu-radiobutton-label p-radiobutton-label" [class.p-radiobutton-label-active]="checked">{{ label }}</span>
</label>
