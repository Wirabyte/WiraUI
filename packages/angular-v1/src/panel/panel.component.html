<div [class]="classes" [style]="rootStyle">
  <div class="wu-panel-header p-panel-header" [style.cursor]="toggleable && toggler === 'header' ? 'pointer' : null" (click)="headerClick()">
    <span *ngIf="header" class="wu-panel-title p-panel-title" [id]="titleId">{{ header }}</span>
    <ng-container *ngIf="headerTemplate"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container>
    <ng-content select="[wuPanelHeader], wu-header"></ng-content>
    <div class="wu-panel-icons p-panel-icons">
      <ng-content select="[wuPanelIcons]"></ng-content>
      <ng-container *ngIf="iconsTemplate"><ng-container *ngTemplateOutlet="iconsTemplate"></ng-container></ng-container>
      <button
        *ngIf="toggleable"
        type="button"
        class="wu-panel-toggler p-panel-header-icon p-panel-toggler p-link"
        [attr.aria-expanded]="!isCollapsed"
        [attr.aria-controls]="contentId"
        [attr.aria-label]="togglerLabel"
        (click)="toggle($event)"
      >
        <svg *ngIf="isCollapsed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
        <svg *ngIf="!isCollapsed" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg>
      </button>
    </div>
  </div>
  <div
    class="wu-panel-content-container p-toggleable-content"
    [id]="contentId"
    role="region"
    [attr.aria-labelledby]="header ? titleId : null"
    [attr.inert]="isCollapsed ? '' : null"
  >
    <div class="wu-panel-content-inner">
      <div class="wu-panel-content p-panel-content"><ng-content></ng-content></div>
      <div class="wu-panel-footer p-panel-footer"><ng-content select="[wuPanelFooter], wu-footer"></ng-content><ng-container *ngIf="footerTemplate"><ng-container *ngTemplateOutlet="footerTemplate"></ng-container></ng-container></div>
    </div>
  </div>
</div>
