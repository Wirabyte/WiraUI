<div [class]="classes" [style]="rootStyle" [attr.role]="sev === 'danger' || sev === 'warn' ? 'alert' : 'status'">
  <span class="wt-message-icon p-inline-message-icon" aria-hidden="true" [ngSwitch]="icon ? 'custom' : sev">
    <span *ngSwitchCase="'custom'" [class]="icon"></span>
    <svg *ngSwitchCase="'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
    <svg *ngSwitchCase="'warn'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4M12 17h.01"></path></svg>
    <svg *ngSwitchCase="'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg>
    <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
  </span>
  <div class="wt-message-text p-inline-message-text"><ng-container *ngIf="text"><ng-container *ngIf="escape; else htmlText">{{ text }}</ng-container><ng-template #htmlText><span [innerHTML]="text"></span></ng-template></ng-container><ng-content></ng-content></div>
  <button *ngIf="closable" type="button" class="wt-message-close p-message-close" [attr.aria-label]="closeLabel" (click)="close($event)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
  </button>
</div>
