<div
  #panel
  *ngIf="overlayVisible"
  popover="manual"
  role="dialog"
  class="wu-popover p-overlaypanel p-component"
  [ngClass]="styleClass || ''"
  [ngStyle]="style || null"
  (keydown)="keydown($event)"
>
  <div class="wu-popover-content p-overlaypanel-content">
    <ng-content></ng-content><ng-container *ngIf="contentTemplate"><ng-container *ngTemplateOutlet="contentTemplate; context: contentContext"></ng-container></ng-container>
  </div>
  <button
    *ngIf="showCloseIcon"
    type="button"
    class="wu-popover-close p-overlaypanel-close p-link"
    [attr.aria-label]="ariaCloseLabel || t.close"
    (click)="hide()"
  >
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
  </button>
</div>
