<div
  class="wu-table p-datatable p-component"
  [ngClass]="styleClass || ''"
  [ngStyle]="style || null"
  [class.wu-table-gridlines]="showGridlines"
  [class.p-datatable-gridlines]="showGridlines"
  [class.wu-table-striped]="stripedRows"
  [class.p-datatable-striped]="stripedRows"
  [class.wu-table-sm]="sizeKey === 'sm'"
  [class.p-datatable-sm]="sizeKey === 'sm'"
  [class.wu-table-lg]="sizeKey === 'lg'"
  [class.p-datatable-lg]="sizeKey === 'lg'"
  [class.wu-table-hoverable]="rowHover"
  [class.p-datatable-hoverable-rows]="rowHover"
  [class.wu-table-scrollable]="scrollable"
  [class.p-datatable-scrollable]="scrollable"
  [class.wu-table-flex]="flexScroll"
  [class.wu-table-stack]="responsiveLayout === 'stack'"
  [class.p-datatable-responsive-stack]="responsiveLayout === 'stack'"
  [class.p-datatable-responsive-scroll]="responsiveLayout !== 'stack'"
  [class.wu-table-stacked]="stacked"
  [class.wu-table-loading]="loading"
  [attr.aria-busy]="loading || null"
>
  <div *ngIf="showMask" class="wu-table-mask p-datatable-loading-overlay p-component-overlay">
    <i *ngIf="loadingIcon; else spinner" [class]="'wu-table-loading-icon p-datatable-loading-icon ' + loadingIcon" aria-hidden="true"></i>
    <ng-template #spinner><span class="wu-table-spinner" role="status" [attr.aria-label]="t.loading"></span></ng-template>
  </div>
  <div *ngIf="captionTemplate" class="wu-table-header p-datatable-header">
    <ng-container *ngTemplateOutlet="captionTemplate"></ng-container>
  </div>
  <wu-paginator
    *ngIf="showPaginatorTop"
    class="wu-table-paginator p-paginator-top"
    [styleClass]="paginatorStyleClass"
    [first]="pageFirst"
    [rows]="rows"
    [totalRecords]="total"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="showCurrentPageReport"
    [currentPageReportTemplate]="currentPageReportTemplate"
    [pageLinkSize]="pageLinks"
    [alwaysShow]="alwaysShowPaginator"
    [leftTemplate]="paginatorLeftTemplate"
    [rightTemplate]="paginatorRightTemplate"
    (onPageChange)="pageChange($event)"
  ></wu-paginator>
  <div class="wu-table-wrapper p-datatable-wrapper" [style.max-height]="wrapperMaxHeight">
    <table class="wu-table-table p-datatable-table" role="table" [ngClass]="tableStyleClass || ''" [ngStyle]="tableStyle || null">
      <ng-container *ngIf="colgroupTemplate"><ng-container *ngTemplateOutlet="colgroupTemplate; context: columnsContext"></ng-container></ng-container>
      <thead *ngIf="headerTemplate" class="wu-table-thead p-datatable-thead">
        <ng-container *ngTemplateOutlet="headerTemplate; context: columnsContext"></ng-container>
      </thead>
      <tbody *ngIf="frozenValue.length && frozenBodyTemplate" class="wu-table-tbody wu-table-frozen-tbody p-datatable-frozen-tbody">
        <ng-container *ngFor="let row of frozenValue; let i = index">
          <ng-container *ngTemplateOutlet="frozenBodyTemplate; context: frozenContext(row, i)"></ng-container>
        </ng-container>
      </tbody>
      <tbody class="wu-table-tbody p-datatable-tbody">
        <ng-container *ngIf="showLoadingBody; else rowsBody">
          <ng-container *ngTemplateOutlet="loadingBodyTemplate; context: columnsContext"></ng-container>
        </ng-container>
        <ng-template #rowsBody>
          <ng-container *ngIf="bodyTemplate">
            <ng-container *ngFor="let row of pageRows; let i = index; trackBy: trackRow">
              <ng-container *ngIf="groupHeaderTemplate && isGroupStart(i)">
                <ng-container *ngTemplateOutlet="groupHeaderTemplate; context: rowContext(row, i)"></ng-container>
              </ng-container>
              <ng-container *ngTemplateOutlet="bodyTemplate; context: rowContext(row, i)"></ng-container>
              <ng-container *ngIf="rowExpansionTemplate && isRowExpanded(row)">
                <ng-container *ngTemplateOutlet="rowExpansionTemplate; context: rowContext(row, i)"></ng-container>
              </ng-container>
              <ng-container *ngIf="groupFooterTemplate && isGroupEnd(i)">
                <ng-container *ngTemplateOutlet="groupFooterTemplate; context: rowContext(row, i)"></ng-container>
              </ng-container>
            </ng-container>
          </ng-container>
          <ng-container *ngIf="isEmpty && !loading">
            <ng-container *ngIf="emptyTemplate; else defaultEmpty"><ng-container *ngTemplateOutlet="emptyTemplate; context: columnsContext"></ng-container></ng-container>
            <ng-template #defaultEmpty><tr class="wu-table-empty-row"><td class="wu-table-empty" colspan="100">{{ t.emptyMessage }}</td></tr></ng-template>
          </ng-container>
        </ng-template>
      </tbody>
      <tfoot *ngIf="footerTemplate" class="wu-table-tfoot p-datatable-tfoot">
        <ng-container *ngTemplateOutlet="footerTemplate; context: columnsContext"></ng-container>
      </tfoot>
    </table>
  </div>
  <wu-paginator
    *ngIf="showPaginatorBottom"
    class="wu-table-paginator p-paginator-bottom"
    [styleClass]="paginatorStyleClass"
    [first]="pageFirst"
    [rows]="rows"
    [totalRecords]="total"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="showCurrentPageReport"
    [currentPageReportTemplate]="currentPageReportTemplate"
    [pageLinkSize]="pageLinks"
    [alwaysShow]="alwaysShowPaginator"
    [leftTemplate]="paginatorLeftTemplate"
    [rightTemplate]="paginatorRightTemplate"
    (onPageChange)="pageChange($event)"
  ></wu-paginator>
  <div *ngIf="summaryTemplate" class="wu-table-footer p-datatable-footer">
    <ng-container *ngTemplateOutlet="summaryTemplate"></ng-container>
  </div>
</div>
