<div
  #root
  class="wu-select p-dropdown p-component"
  [ngClass]="styleClass || ''"
  [class.wu-select-open]="open"
  [class.p-dropdown-open]="open"
  [class.wu-select-focus]="focused || open"
  [class.p-focus]="focused || open"
  [class.wu-select-disabled]="disabled"
  [class.p-disabled]="disabled"
  [class.wu-select-invalid]="invalid"
  [class.p-invalid]="invalid"
  [class.wu-select-filled]="variant === 'filled'"
  [class.p-input-filled]="variant === 'filled'"
  [class.wu-select-sm]="sizeKey === 'sm'"
  [class.wu-select-lg]="sizeKey === 'lg'"
  [class.wu-select-clearable]="clearable"
  [class.p-dropdown-clearable]="clearable"
  [class.wu-select-loading]="loading"
  [class.p-select-loading]="loading"
  (mousedown)="fieldMousedown($event)"
  (click)="fieldClick($event)"
>
  <input
    *ngIf="editable; else readOnlyField"
    #focusInput
    type="text"
    class="wu-select-label wu-select-editable p-dropdown-label p-inputtext"
    role="combobox"
    autocomplete="off"
    [id]="inputId || baseId"
    [value]="filled && !selectedItem ? value : (selectedItem?.label ?? '')"
    [attr.placeholder]="placeholder || null"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-labelledby]="ariaLabelledBy || null"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open"
    [attr.aria-controls]="open ? listId : null"
    [attr.aria-activedescendant]="activeId"
    [disabled]="disabled"
    [readOnly]="readonly || loading"
    [attr.aria-busy]="loading || null"
    (input)="editInput($event)"
    (keydown)="keydown($event)"
    (focus)="fieldFocus($event)"
  />
  <ng-template #readOnlyField>
    <input
      #focusInput
      type="text"
      class="wu-select-input p-hidden-accessible"
      role="combobox"
      readonly
      inputmode="none"
      autocomplete="off"
      [id]="inputId || baseId"
      [attr.tabindex]="disabled ? -1 : tabindex"
      [attr.aria-label]="ariaLabel || (ariaLabelledBy ? null : labelText || placeholder || null)"
      [attr.aria-labelledby]="ariaLabelledBy || null"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open"
      [attr.aria-controls]="open ? listId : null"
      [attr.aria-activedescendant]="filter ? null : activeId"
      [attr.aria-disabled]="disabled || null"
    [attr.aria-busy]="loading || null"
      [disabled]="disabled"
      (keydown)="keydown($event)"
      (focus)="fieldFocus($event)"
    />
    <span class="wu-select-label p-dropdown-label p-inputtext" [class.wu-select-placeholder]="showPlaceholder" [class.p-placeholder]="showPlaceholder" aria-hidden="true">
      <ng-container *ngIf="selectedItemTemplate && selectedItem; else plainLabel">
        <ng-container *ngTemplateOutlet="selectedItemTemplate; context: { $implicit: selectedItem.option }"></ng-container>
      </ng-container>
      <ng-template #plainLabel>{{ labelText || ' ' }}</ng-template>
    </span>
  </ng-template>
  <button *ngIf="clearable" type="button" class="wu-select-clear p-dropdown-clear-icon" tabindex="-1" [attr.aria-label]="t.clear" (click)="clear($event)">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
  </button>
  <span class="wu-select-dropdown p-dropdown-trigger" aria-hidden="true">
    <span *ngIf="loading; else arrow" class="wu-select-spinner p-dropdown-loading-icon"></span>
    <ng-template #arrow>
      <ng-container *ngIf="dropdownIconTemplate; else defaultArrow"><ng-container *ngTemplateOutlet="dropdownIconTemplate"></ng-container></ng-container>
      <ng-template #defaultArrow>
        <svg class="p-dropdown-trigger-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"></path></svg>
      </ng-template>
    </ng-template>
  </span>
</div>

<div
  *ngIf="open"
  #panel
  popover="manual"
  class="wu-select-overlay p-dropdown-panel p-component"
  [ngClass]="panelStyleClass || ''"
  [ngStyle]="panelStyle || null"
  (mousedown)="panelMousedown($event)"
>
  <ng-container *ngIf="headerTemplate"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container>
  <div *ngIf="filter" class="wu-select-header p-dropdown-header">
    <div class="wu-select-filter-wrap p-dropdown-filter-container">
      <input
        #filterInput
        type="text"
        class="wu-inputtext wu-select-filter p-dropdown-filter p-inputtext"
        role="searchbox"
        autocomplete="off"
        [value]="filterText"
        [attr.placeholder]="filterPlaceholder || t.search"
        [attr.aria-label]="ariaFilterLabel || t.search"
        [attr.aria-controls]="listId"
        [attr.aria-activedescendant]="activeId"
        (input)="search($event)"
        (keydown)="keydown($event)"
      />
      <svg class="wu-select-filter-icon p-dropdown-filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
    </div>
  </div>
  <div class="wu-select-list-container p-dropdown-items-wrapper" [style.max-height]="scrollHeight">
    <ul #listBox class="wu-select-list p-dropdown-items" role="listbox" [id]="listId" [attr.aria-label]="ariaLabel || placeholder || null">
      <ng-container *ngFor="let item of visible; let i = index; trackBy: trackIndex">
        <li *ngIf="item.group; else optionRow" class="wu-select-group p-dropdown-item-group" role="presentation">
          <ng-container *ngIf="groupTemplate; else groupLabel"><ng-container *ngTemplateOutlet="groupTemplate; context: { $implicit: item.option }"></ng-container></ng-container>
          <ng-template #groupLabel>{{ item.label }}</ng-template>
        </li>
        <ng-template #optionRow>
          <li
            class="wu-select-option p-dropdown-item"
            role="option"
            [id]="optionId(i)"
            [class.wu-select-option-selected]="isSelected(item)"
            [class.p-highlight]="isSelected(item)"
            [class.wu-select-option-active]="i === activeIndex"
            [class.p-focus]="i === activeIndex"
            [class.wu-select-option-disabled]="item.disabled"
            [class.p-disabled]="item.disabled"
            [attr.aria-selected]="isSelected(item)"
            [attr.aria-disabled]="item.disabled || null"
            (click)="pick(item, $event)"
            (mousemove)="hover(i)"
          >
            <svg *ngIf="checkmark" class="wu-select-check" [class.wu-select-check-on]="isSelected(item)" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.5 3 3 6-7"></path></svg>
            <ng-container *ngIf="itemTemplate; else optionLabel">
              <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item.option, selected: isSelected(item), index: i }"></ng-container>
            </ng-container>
            <ng-template #optionLabel><span class="wu-select-option-label">{{ item.label || ' ' }}</span></ng-template>
          </li>
        </ng-template>
      </ng-container>
      <li *ngIf="!visible.length" class="wu-select-empty p-dropdown-empty-message" role="option" aria-disabled="true">
        <ng-container *ngIf="emptyTemplate; else emptyLabel"><ng-container *ngTemplateOutlet="emptyTemplate"></ng-container></ng-container>
        <ng-template #emptyLabel>{{ emptyText }}</ng-template>
      </li>
    </ul>
  </div>
  <ng-container *ngIf="footerTemplate"><ng-container *ngTemplateOutlet="footerTemplate"></ng-container></ng-container>
</div>
