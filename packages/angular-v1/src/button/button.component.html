<button
  [attr.type]="type"
  [class]="classes"
  [style]="rootStyle"
  [disabled]="disabled || busy"
  [attr.aria-busy]="busy || null"
  [attr.aria-label]="ariaLabel || null"
  (click)="handleClick($event)"
  (pointerdown)="handlePointerDown($event)"
>
  <span *ngIf="busy" class="wu-btn-spinner p-button-loading-icon" aria-hidden="true"></span>
  <span *ngIf="showIcon && iconPos === 'left'" [class]="'wu-btn-icon p-button-icon p-button-icon-left ' + icon" aria-hidden="true"></span>
  <span *ngIf="label" class="wu-btn-label p-button-label">{{ label }}</span>
  <ng-content></ng-content>
  <span *ngIf="showIcon && iconPos === 'right'" [class]="'wu-btn-icon p-button-icon p-button-icon-right ' + icon" aria-hidden="true"></span>
  <span *ngIf="hasBadge" class="wu-btn-badge p-badge p-component" [class]="badgeSeverity ? 'wu-btn-badge-' + badgeSeverity + ' p-badge-' + badgeSeverity : ''">{{ badge }}</span>
</button>
