<label class="wt-toggleswitch" [class]="styleClass || ''" [style]="rootStyle" [class.wt-toggleswitch-checked]="checked" [class.wt-toggleswitch-disabled]="isDisabled" [class.wt-invalid]="invalid">
  <input
    type="checkbox"
    role="switch"
    class="wt-toggleswitch-input"
    [id]="id"
    [attr.name]="name || null"
    [checked]="checked"
    [disabled]="isDisabled"
    [attr.aria-checked]="checked"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-readonly]="readonly || null"
    [attr.aria-label]="ariaLabel || null"
    (change)="toggle($event)"
    (blur)="onTouched()"
  />
  <span class="wt-toggleswitch-control p-inputswitch p-component" [class.p-inputswitch-checked]="checked" [class.p-disabled]="isDisabled" aria-hidden="true">
    <span class="wt-toggleswitch-track p-inputswitch-slider"><span class="wt-toggleswitch-handle"></span></span>
  </span>
  <span *ngIf="label" class="wt-toggleswitch-label">{{ label }}</span>
</label>
