<ng-container *ngIf="popup; else inline">
  <div
    *ngIf="visible"
    #panel
    popover="manual"
    class="wt-menu wt-menu-overlay p-menu p-menu-overlay p-component"
    [ngClass]="styleClass || ''"
    [ngStyle]="style || null"
    (focusin)="focusIn($event)"
    (focusout)="focusOut($event)"
  >
    <ng-container *ngTemplateOutlet="body"></ng-container>
  </div>
</ng-container>
<ng-template #inline>
  <div class="wt-menu p-menu p-component" [ngClass]="styleClass || ''" [ngStyle]="style || null" (focusin)="focusIn($event)" (focusout)="focusOut($event)">
    <ng-container *ngTemplateOutlet="body"></ng-container>
  </div>
</ng-template>

<ng-template #body>
  <div *ngIf="startTemplate" class="wt-menu-start p-menu-start"><ng-container *ngTemplateOutlet="startTemplate"></ng-container></div>
  <ul
    class="wt-menu-list p-menu-list p-reset"
    role="menu"
    [id]="listId"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-labelledby]="ariaLabelledBy || null"
    (keydown)="keydown($event)"
  >
    <ng-container *ngFor="let item of items; let i = index; trackBy: trackIndex">
      <li *ngIf="item.separator" class="wt-menu-separator p-menu-separator" role="separator"></li>
      <ng-container *ngIf="!item.separator && isGroup(item)">
        <li class="wt-menu-submenu-label p-submenu-header" role="none" [ngClass]="item.styleClass || ''" [ngStyle]="item.style || null">
          <ng-container *ngIf="submenuHeaderTemplate; else headerText">
            <ng-container *ngTemplateOutlet="submenuHeaderTemplate; context: { $implicit: item }"></ng-container>
          </ng-container>
          <ng-template #headerText>{{ item.label }}</ng-template>
        </li>
        <ng-container *ngFor="let child of visibleOf(item.items); let j = index; trackBy: trackIndex">
          <ng-container *ngTemplateOutlet="row; context: { $implicit: child, key: keyOf('' + i, j) }"></ng-container>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="!item.separator && !isGroup(item)">
        <ng-container *ngTemplateOutlet="row; context: { $implicit: item, key: keyOf('', i) }"></ng-container>
      </ng-container>
    </ng-container>
  </ul>
  <div *ngIf="endTemplate" class="wt-menu-end p-menu-end"><ng-container *ngTemplateOutlet="endTemplate"></ng-container></div>
</ng-template>

<ng-template #row let-item let-key="key">
  <li *ngIf="item.separator; else entry" class="wt-menu-separator p-menu-separator" role="separator"></li>
  <ng-template #entry>
    <li
      class="wt-menu-item p-menuitem"
      role="none"
      [ngClass]="item.styleClass || ''"
      [ngStyle]="item.style || null"
      [class.wt-menu-item-disabled]="item.disabled"
    >
      <div class="wt-menu-item-content">
        <a
          *ngIf="routed(item); else plain"
          class="wt-menu-item-link p-menuitem-link"
          role="menuitem"
          [id]="itemId(key)"
          [attr.data-wt-key]="key"
          [attr.tabindex]="tabindexOf(key)"
          [attr.title]="item.title || null"
          [attr.target]="item.target || null"
          [attr.data-automationid]="item.automationId || null"
          [routerLink]="item.routerLink"
          [queryParams]="item.queryParams"
          [queryParamsHandling]="item.queryParamsHandling"
          [fragment]="item.fragment"
          [preserveFragment]="!!item.preserveFragment"
          [skipLocationChange]="!!item.skipLocationChange"
          [replaceUrl]="!!item.replaceUrl"
          [state]="item.state"
          routerLinkActive="wt-menu-link-active p-menuitem-link-active"
          [routerLinkActiveOptions]="item.routerLinkActiveOptions || { exact: false }"
          (click)="itemClick($event, item, key)"
        >
          <ng-container *ngTemplateOutlet="content; context: { $implicit: item }"></ng-container>
        </a>
        <ng-template #plain>
          <a
            class="wt-menu-item-link p-menuitem-link"
            role="menuitem"
            [class.p-disabled]="item.disabled"
            [id]="itemId(key)"
            [attr.data-wt-key]="key"
            [attr.tabindex]="tabindexOf(key)"
            [attr.href]="hrefOf(item)"
            [attr.title]="item.title || null"
            [attr.target]="item.url ? item.target || null : null"
            [attr.data-automationid]="item.automationId || null"
            [attr.aria-disabled]="item.disabled || null"
            (click)="itemClick($event, item, key)"
          >
            <ng-container *ngTemplateOutlet="content; context: { $implicit: item }"></ng-container>
          </a>
        </ng-template>
      </div>
    </li>
  </ng-template>
</ng-template>

<ng-template #content let-item>
  <ng-container *ngIf="itemTemplate; else defaultContent">
    <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
  </ng-container>
  <ng-template #defaultContent>
    <span *ngIf="item.icon" class="wt-menu-item-icon p-menuitem-icon" [ngClass]="item.icon" [ngStyle]="item.iconStyle || null" aria-hidden="true"></span>
    <span *ngIf="item.escape === false; else textLabel" class="wt-menu-item-label p-menuitem-text" [innerHTML]="item.label"></span>
    <ng-template #textLabel><span class="wt-menu-item-label p-menuitem-text">{{ item.label }}</span></ng-template>
    <span *ngIf="item.badge" class="wt-menu-badge p-menuitem-badge p-badge" [ngClass]="item.badgeStyleClass || ''">{{ item.badge }}</span>
  </ng-template>
</ng-template>
