<div [class]="classes" [style]="rootStyle" role="group" [attr.aria-labelledby]="ariaLabelledBy || null">
  <button
    *ngFor="let option of options || []; let i = index"
    type="button"
    [class]="optionClasses(option)"
    [attr.aria-pressed]="isSelected(option)"
    [disabled]="isDisabled || isOptionDisabled(option)"
    (click)="select(option, i, $event)"
    (blur)="onTouched()"
  >
    <ng-container *ngIf="itemTemplate; else plainLabel"><ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: option, index: i }"></ng-container></ng-container>
    <ng-template #plainLabel><span class="p-button-label">{{ labelOf(option) }}</span></ng-template>
  </button>
</div>
