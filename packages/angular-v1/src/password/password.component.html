<div #root [class]="classes" [style]="rootStyle">
  <input
    [id]="id"
    [attr.name]="name || null"
    [type]="unmasked ? 'text' : 'password'"
    [class]="inputStyleClass || ''"
    [style]="inputStyleObject"
    class="wu-inputtext p-inputtext p-component p-element p-password-input"
    [class.wu-inputtext-sm]="sizeKey === 'sm'"
    [class.p-inputtext-sm]="sizeKey === 'sm'"
    [class.wu-inputtext-lg]="sizeKey === 'lg'"
    [class.p-inputtext-lg]="sizeKey === 'lg'"
    [class.wu-invalid]="invalid"
    [class.wu-filled]="!!value"
    [class.p-filled]="!!value"
    [value]="value"
    [attr.placeholder]="placeholder || null"
    [disabled]="isDisabled"
    [attr.autocomplete]="autocomplete || null"
    [attr.maxlength]="maxLength ?? null"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-describedby]="showFeedback ? feedbackId : null"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
  <button
    *ngIf="toggleMask"
    type="button"
    class="wu-password-toggle"
    [attr.aria-label]="toggleLabel"
    [attr.aria-pressed]="unmasked"
    [attr.aria-controls]="id"
    [disabled]="isDisabled"
    (click)="unmasked = !unmasked"
  >
    <svg *ngIf="unmasked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
    <svg *ngIf="!unmasked" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>
  <div #panel *ngIf="showFeedback" popover="manual" class="wu-password-panel p-password-panel p-component" [id]="feedbackId" aria-live="polite">
    <div class="wu-password-meter p-password-meter" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="wu-password-info p-password-info">{{ info }}</div>
  </div>
</div>
