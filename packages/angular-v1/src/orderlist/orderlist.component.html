<div
  class="wu-orderlist p-orderlist p-component"
  [class.wu-orderlist-wide]="!stacked"
  [class.wu-orderlist-stacked]="stacked"
  [class.wu-orderlist-controls-left]="controlsPosition !== 'right'"
  [class.p-orderlist-controls-left]="controlsPosition !== 'right'"
  [class.wu-orderlist-controls-right]="controlsPosition === 'right'"
  [class.p-orderlist-controls-right]="controlsPosition === 'right'"
  [class.wu-orderlist-striped]="stripedRows"
  [class.p-orderlist-striped]="stripedRows"
  [class.wu-orderlist-disabled]="disabled"
  [class.p-disabled]="disabled"
  [class.wu-orderlist-dragdrop]="dragdrop && !disabled"
  [ngClass]="styleClass || ''"
  [ngStyle]="style || null"
>
  <div class="wu-picklist-controls wu-orderlist-controls p-orderlist-controls" role="group">
    <button type="button" [class]="buttonClass('wu-orderlist-move-up')" [disabled]="!canReorder" [attr.aria-label]="upButtonAriaLabel || t.moveUp" (click)="reorder('up')">
      <svg class="wu-picklist-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10 8 5.5l4.5 4.5"></path></svg>
    </button>
    <button type="button" [class]="buttonClass('wu-orderlist-move-top')" [disabled]="!canReorder" [attr.aria-label]="topButtonAriaLabel || t.moveTop" (click)="reorder('top')">
      <svg class="wu-picklist-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 3h9M3.5 11.5 8 7l4.5 4.5"></path></svg>
    </button>
    <button type="button" [class]="buttonClass('wu-orderlist-move-down')" [disabled]="!canReorder" [attr.aria-label]="downButtonAriaLabel || t.moveDown" (click)="reorder('down')">
      <svg class="wu-picklist-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"></path></svg>
    </button>
    <button type="button" [class]="buttonClass('wu-orderlist-move-bottom')" [disabled]="!canReorder" [attr.aria-label]="bottomButtonAriaLabel || t.moveBottom" (click)="reorder('bottom')">
      <svg class="wu-picklist-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13h9M3.5 4.5 8 9l4.5-4.5"></path></svg>
    </button>
  </div>
  <div class="wu-picklist-box wu-orderlist-box p-orderlist-list-container">
    <div *ngIf="hasHeader" class="wu-picklist-header p-orderlist-header" [id]="headerId">
      <ng-container *ngIf="headerTemplate; else plainHeader">
        <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
      </ng-container>
      <ng-template #plainHeader>
        <div class="wu-picklist-title p-orderlist-title">{{ header }}</div>
      </ng-template>
    </div>
    <div *ngIf="showFilter" class="wu-picklist-filter p-orderlist-filter-container">
      <ng-container *ngIf="filterTemplate; else plainFilter">
        <ng-container *ngTemplateOutlet="filterTemplate; context: { options: filterOptions }"></ng-container>
      </ng-container>
      <ng-template #plainFilter>
          <div class="wu-picklist-filter-field p-orderlist-filter">
            <input
              type="text"
              class="wu-inputtext wu-picklist-filter-input p-orderlist-filter-input p-inputtext p-component"
              role="searchbox"
              autocomplete="off"
              [value]="list.query"
              [disabled]="disabled"
              [attr.placeholder]="filterPlaceholder || t.search"
              [attr.aria-label]="ariaFilterLabel || filterPlaceholder || t.search"
              [attr.aria-controls]="listId"
              (input)="filterInput($event)"
            />
            <svg class="wu-picklist-filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
          </div>
      </ng-template>
    </div>
    <ul
      class="wu-picklist-list wu-orderlist-list p-orderlist-list"
      [class.wu-picklist-list-focused]="focused"
      role="listbox"
      aria-multiselectable="true"
      [id]="listId"
      data-wu-list="list"
      [attr.tabindex]="disabled ? -1 : tabindex"
      [attr.aria-labelledby]="ariaLabelledBy || (hasHeader ? headerId : null)"
      [attr.aria-label]="ariaLabel || null"
      [attr.aria-activedescendant]="activeId"
      [attr.aria-disabled]="disabled || null"
      [ngStyle]="listStyles"
      (focus)="listFocus($event)"
      (blur)="listBlur($event)"
      (keydown)="listKeydown($event)"
    >
      <ng-container *ngFor="let item of value; let i = index; trackBy: trackAny">
          <li
            *ngIf="isVisible(item)"
            class="wu-picklist-item p-orderlist-item"
            role="option"
            [id]="itemId(i)"
            [attr.data-wu-index]="i"
            [attr.aria-selected]="isSelected(item)"
            [class.wu-picklist-item-selected]="isSelected(item)"
            [class.p-highlight]="isSelected(item)"
            [class.wu-picklist-item-focused]="isFocused(i)"
            [class.p-focus]="isFocused(i)"
            (pointerdown)="pointerDown($event, i)"
            (click)="itemClick($event, item, i)"
          >
            <ng-container *ngIf="itemTemplate; else plainItem">
              <ng-container *ngTemplateOutlet="itemTemplate; context: itemContext(item, i)"></ng-container>
            </ng-container>
            <ng-template #plainItem><span class="wu-picklist-item-label">{{ label(item) }}</span></ng-template>
          </li>
      </ng-container>
      <ng-container *ngIf="isEmpty">
        <li *ngIf="emptyTemplate; else plainEmpty" class="wu-picklist-empty p-orderlist-empty-message" role="presentation">
          <ng-container *ngTemplateOutlet="emptyTemplate"></ng-container>
        </li>
        <ng-template #plainEmpty>
          <li *ngIf="emptyText" class="wu-picklist-empty p-orderlist-empty-message" role="presentation">{{ emptyText }}</li>
        </ng-template>
      </ng-container>
    </ul>
  </div>
</div>
