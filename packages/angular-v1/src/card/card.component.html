<div [class]="classes" [style]="rootStyle" [attr.aria-busy]="loading || null">
  <div class="wt-card-header p-card-header"><ng-content select="[wtCardHeader], wt-header"></ng-content><ng-container *ngIf="headerTemplate"><ng-container *ngTemplateOutlet="headerTemplate"></ng-container></ng-container></div>
  <div class="wt-card-body p-card-body">
    <div class="wt-card-caption">
      <div *ngIf="header || subheader || titleTemplate || subtitleTemplate" class="wt-card-titles p-card-caption">
        <div *ngIf="header || titleTemplate" class="wt-card-title p-card-title">{{ header }}<ng-container *ngIf="titleTemplate"><ng-container *ngTemplateOutlet="titleTemplate"></ng-container></ng-container></div>
        <div *ngIf="subheader || subtitleTemplate" class="wt-card-subtitle p-card-subtitle">{{ subheader }}<ng-container *ngIf="subtitleTemplate"><ng-container *ngTemplateOutlet="subtitleTemplate"></ng-container></ng-container></div>
      </div>
      <div class="wt-card-actions"><ng-content select="[wtCardActions]"></ng-content></div>
    </div>
    <div *ngIf="loading" class="wt-card-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="wt-card-content p-card-content" [hidden]="loading"><ng-content></ng-content><ng-container *ngIf="contentTemplate"><ng-container *ngTemplateOutlet="contentTemplate"></ng-container></ng-container></div>
    <div class="wt-card-footer p-card-footer"><ng-content select="[wtCardFooter], wt-footer"></ng-content><ng-container *ngIf="footerTemplate"><ng-container *ngTemplateOutlet="footerTemplate"></ng-container></ng-container></div>
  </div>
</div>
