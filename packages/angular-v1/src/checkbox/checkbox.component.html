<label class="wu-checkbox" [class]="styleClass || ''" [style]="rootStyle" [class.wu-checkbox-checked]="checked" [class.wu-checkbox-disabled]="isDisabled" [class.wu-invalid]="invalid">
  <input
    type="checkbox"
    class="wu-checkbox-input"
    [id]="id"
    [attr.name]="name || null"
    [checked]="checked"
    [disabled]="isDisabled"
    [attr.aria-invalid]="invalid || null"
    [attr.aria-readonly]="readonly || null"
    [attr.aria-label]="ariaLabel || null"
    (change)="toggle($event)"
    (blur)="onTouched()"
  />
  <span class="wu-checkbox-control p-checkbox p-component" [class.p-checkbox-checked]="checked" [class.p-checkbox-disabled]="isDisabled" aria-hidden="true">
    <span class="wu-checkbox-box p-checkbox-box" [class.p-highlight]="checked" [class.p-disabled]="isDisabled">
      <svg class="wu-checkbox-icon p-checkbox-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>
    </span>
  </span>
  <span *ngIf="label" class="wu-checkbox-label p-checkbox-label" [class.p-checkbox-label-active]="checked">{{ label }}</span>
</label>
