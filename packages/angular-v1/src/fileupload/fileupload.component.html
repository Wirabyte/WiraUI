<input
  type="file"
  class="wu-fileupload-input"
  tabindex="-1"
  aria-hidden="true"
  [attr.accept]="accept || null"
  [attr.name]="name || null"
  [multiple]="multiple"
  [disabled]="disabled"
  (change)="onFileSelect($event)"
/>
<div *ngIf="basic; else advanced" class="wu-fileupload wu-fileupload-basic p-fileupload p-fileupload-basic p-component" [class.wu-fileupload-disabled]="disabled" [ngClass]="styleClass || ''" [ngStyle]="style || null">
  <wu-message *ngFor="let m of msgs; let i = index" class="wu-fileupload-message" severity="error" [text]="m" [closable]="true" (onClose)="dismissMessage(i)"></wu-message>
  <div class="wu-fileupload-basic-row">
    <button type="button" [class]="buttonClass(chooseStyleClass, 'wu-fileupload-choose p-fileupload-choose')" [disabled]="!canChoose" [attr.tabindex]="tabindex ?? null" (click)="choose()">
      <ng-container *ngTemplateOutlet="chooseIconTpl"></ng-container>
      <span class="wu-btn-label p-button-label">{{ chooseText }}</span>
    </button>
    <ng-container *ngIf="hasFiles() && !auto">
      <span class="wu-fileupload-chosen p-fileupload-filename">{{ chosenText }}</span>
      <button type="button" [class]="removeClass()" [disabled]="uploading || disabled" [attr.aria-label]="t.clear" (click)="clear()">
        <ng-container *ngTemplateOutlet="removeIconTpl"></ng-container>
      </button>
    </ng-container>
  </div>
</div>

<ng-template #advanced>
  <div class="wu-fileupload p-fileupload p-fileupload-advanced p-component" [class.wu-fileupload-disabled]="disabled" [ngClass]="styleClass || ''" [ngStyle]="style || null">
    <ng-container *ngIf="headerTemplate; else buttonbar">
      <ng-container *ngTemplateOutlet="headerTemplate; context: context"></ng-container>
    </ng-container>
    <ng-template #buttonbar>
      <div class="wu-fileupload-header p-fileupload-buttonbar">
        <button type="button" [class]="buttonClass(chooseStyleClass, 'wu-fileupload-choose p-fileupload-choose')" [disabled]="!canChoose" [attr.tabindex]="tabindex ?? null" (click)="choose()">
          <ng-container *ngTemplateOutlet="chooseIconTpl"></ng-container>
          <span class="wu-btn-label p-button-label">{{ chooseText }}</span>
        </button>
        <button *ngIf="!auto && showUploadButton" type="button" [class]="buttonClass(uploadStyleClass, 'wu-fileupload-upload')" [disabled]="!canUpload" (click)="upload()">
          <i *ngIf="uploadIcon; else uploadSvg" [class]="uploadIcon + ' wu-btn-icon'" aria-hidden="true"></i>
          <ng-template #uploadSvg>
            <svg class="wu-fileupload-icon wu-btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 11v2.5h11V11"></path></svg>
          </ng-template>
          <span class="wu-btn-label p-button-label">{{ uploadText }}</span>
        </button>
        <button *ngIf="!auto && showCancelButton" type="button" [class]="buttonClass(cancelStyleClass, 'wu-fileupload-cancel')" [disabled]="!canCancel" (click)="clear()">
          <i *ngIf="cancelIcon; else cancelSvg" [class]="cancelIcon + ' wu-btn-icon'" aria-hidden="true"></i>
          <ng-template #cancelSvg>
            <svg class="wu-fileupload-icon wu-btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg>
          </ng-template>
          <span class="wu-btn-label p-button-label">{{ cancelText }}</span>
        </button>
        <ng-container *ngIf="toolbarTemplate">
          <ng-container *ngTemplateOutlet="toolbarTemplate"></ng-container>
        </ng-container>
      </div>
    </ng-template>
    <div
      class="wu-fileupload-content p-fileupload-content"
      [class.wu-fileupload-highlight]="dragHighlight"
      [class.p-fileupload-highlight]="dragHighlight"
      (dragenter)="dragEnter($event)"
      (dragover)="dragOver($event)"
      (dragleave)="dragLeave()"
      (drop)="drop($event)"
    >
      <div *ngIf="uploading" class="wu-fileupload-progress p-progressbar p-component" role="progressbar" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="progress" [attr.aria-label]="uploadText">
        <div class="wu-fileupload-progress-value p-progressbar-value" [style.width.%]="progress"></div>
      </div>
      <wu-message *ngFor="let m of msgs; let i = index" class="wu-fileupload-message" severity="error" [text]="m" [closable]="true" (onClose)="dismissMessage(i)"></wu-message>
      <div *ngIf="showFileList" class="wu-fileupload-files p-fileupload-files" role="list">
        <ng-container *ngFor="let file of files; let i = index">
          <ng-container *ngIf="fileTemplate; else plainFile">
            <ng-container *ngTemplateOutlet="fileTemplate; context: { $implicit: file, index: i, file: file }"></ng-container>
          </ng-container>
          <ng-template #plainFile>
            <div class="wu-fileupload-file p-fileupload-row" role="listitem">
              <ng-container *ngTemplateOutlet="fileView; context: { $implicit: file }"></ng-container>
              <span class="wu-fileupload-badge wu-fileupload-badge-pending">{{ t.pending }}</span>
              <button type="button" [class]="removeClass()" [disabled]="uploading || disabled" [attr.aria-label]="t.remove + ' ' + file.name" (click)="remove($event, i)">
                <ng-container *ngTemplateOutlet="removeIconTpl"></ng-container>
              </button>
            </div>
          </ng-template>
        </ng-container>
      </div>
      <div *ngIf="showUploaded" class="wu-fileupload-files wu-fileupload-uploaded" role="list">
        <div *ngFor="let file of uploadedFiles; let i = index" class="wu-fileupload-file p-fileupload-row" role="listitem">
          <ng-container *ngTemplateOutlet="fileView; context: { $implicit: file }"></ng-container>
          <span class="wu-fileupload-badge wu-fileupload-badge-done">{{ t.completed }}</span>
          <button type="button" [class]="removeClass()" [disabled]="disabled" [attr.aria-label]="t.remove + ' ' + file.name" (click)="removeUploadedFile(i)">
            <ng-container *ngTemplateOutlet="removeIconTpl"></ng-container>
          </button>
        </div>
      </div>
      <ng-container *ngIf="contentTemplate">
        <ng-container *ngTemplateOutlet="contentTemplate; context: context"></ng-container>
      </ng-container>
      <div *ngIf="showEmpty" class="wu-fileupload-empty p-fileupload-empty">
        <ng-container *ngIf="emptyTemplate; else defaultEmpty">
          <ng-container *ngTemplateOutlet="emptyTemplate"></ng-container>
        </ng-container>
        <ng-template #defaultEmpty>
          <svg class="wu-fileupload-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.9-8.9A6 6 0 0 1 17.7 8 4 4 0 0 1 17 18"></path><path d="M12 12v8M9 15l3-3 3 3"></path></svg>
          <span class="wu-fileupload-empty-text">{{ t.dropFiles }}</span>
        </ng-template>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #chooseIconTpl>
  <i *ngIf="chooseIcon; else chooseSvg" [class]="chooseIcon + ' wu-btn-icon'" aria-hidden="true"></i>
  <ng-template #chooseSvg>
    <svg class="wu-fileupload-icon wu-btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
  </ng-template>
</ng-template>

<ng-template #removeIconTpl>
  <svg class="wu-fileupload-icon wu-btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg>
</ng-template>

<ng-template #fileView let-file>
  <img *ngIf="isImage(file); else fileIcon" class="wu-fileupload-thumb p-fileupload-file-thumbnail" [src]="urlOf(file)" [attr.width]="previewWidth" alt="" (error)="imageError($event)" />
  <ng-template #fileIcon>
    <span class="wu-fileupload-file-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
    </span>
  </ng-template>
  <div class="wu-fileupload-file-info p-fileupload-file-info">
    <div class="wu-fileupload-file-name p-fileupload-filename">{{ file.name }}</div>
    <div class="wu-fileupload-file-size">{{ formatSize(file.size) }}</div>
  </div>
</ng-template>
