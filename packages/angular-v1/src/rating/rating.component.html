<div [class]="classes" role="radiogroup" [attr.aria-label]="ariaLabel || null" (mouseleave)="preview(null)">
  <label *ngFor="let star of starList" [class]="optionClasses(star)" (mouseenter)="preview(star)">
    <input
      type="radio"
      [name]="name"
      [value]="star"
      [checked]="value === star"
      [disabled]="!interactive"
      [attr.aria-label]="star + ' / ' + stars"
      (change)="rate(star, $event)"
      (blur)="onTouched()"
    />
    <svg class="wt-rating-icon p-rating-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.2l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17.1 6.6 20l1-6.1-4.4-4.3 6.1-.9z"></path>
    </svg>
  </label>
</div>
