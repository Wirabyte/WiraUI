<dialog
  *ngIf="rendered"
  #mask
  class="wu-drawer-mask p-drawer-mask p-sidebar-mask p-overlay-mask"
  [ngClass]="(maskStyleClass || '') + ' wu-drawer-mask-' + side"
  [class.wu-drawer-modal]="modal"
  [class.wu-drawer-leaving]="leaving"
  [attr.aria-labelledby]="labelledBy"
  [attr.aria-label]="ariaLabel || null"
  (keydown)="keydown($event)"
  (cancel)="cancel($event)"
  (close)="nativeClose()"
  (pointerdown)="maskPointerdown($event)"
  (click)="maskClick($event)"
>
  <div class="wu-drawer p-drawer p-sidebar p-component" tabindex="-1" [ngClass]="panelClass" [ngStyle]="style || null">
    <ng-container *ngIf="headlessTemplate; else regular">
      <ng-container *ngTemplateOutlet="headlessTemplate"></ng-container>
    </ng-container>
    <ng-template #regular>
      <div class="wu-drawer-header p-drawer-header p-sidebar-header">
        <div class="wu-drawer-title p-drawer-title" [id]="titleId">
          <ng-container *ngIf="headerTemplate; else headerText">
            <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
          </ng-container>
          <ng-template #headerText>{{ header }}</ng-template>
        </div>
        <button *ngIf="closable" type="button" [class]="closeClass" [attr.aria-label]="ariaCloseLabel || t.close" (click)="close($event)">
          <ng-container *ngIf="closeIconTemplate; else defaultIcon">
            <ng-container *ngTemplateOutlet="closeIconTemplate"></ng-container>
          </ng-container>
          <ng-template #defaultIcon>
            <span *ngIf="closeIcon; else cross" [class]="'wu-btn-icon ' + closeIcon" aria-hidden="true"></span>
            <ng-template #cross>
              <svg class="wu-btn-icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
            </ng-template>
          </ng-template>
        </button>
      </div>
      <div class="wu-drawer-content p-drawer-content p-sidebar-content">
        <ng-content></ng-content>
        <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
      </div>
      <div *ngIf="footerTemplate" class="wu-drawer-footer p-drawer-footer p-sidebar-footer">
        <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
      </div>
    </ng-template>
  </div>
</dialog>
