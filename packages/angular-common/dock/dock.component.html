<div [ngClass]="classes" [ngStyle]="rootStyle" [style.--wu-dock-item-size.px]="itemSize" [attr.data-position]="position" [attr.data-look]="look">
  <div class="wu-dock-list-container p-dock-list-container">
    <span class="wu-dock-spacer" aria-hidden="true"></span>
    <div class="wu-dock-center">
      <div *ngIf="startTemplate" class="wu-dock-start">
        <ng-container *ngTemplateOutlet="startTemplate"></ng-container>
      </div>
      <ul
        #list
        class="wu-dock-list p-dock-list"
        role="menu"
        [attr.aria-orientation]="vertical ? 'vertical' : 'horizontal'"
        [attr.aria-label]="ariaLabel || null"
        [attr.aria-labelledby]="ariaLabelledBy || null"
        (focusin)="focusIn($event)"
        (focusout)="focusOut($event)"
        (keydown)="key($event)"
      >
        <ng-container *ngFor="let item of items; let i = index">
          <li *ngIf="item.separator; else entry" class="wu-dock-separator p-dock-separator" role="separator"></li>
          <ng-template #entry>
            <li
              class="wu-dock-item p-dock-item"
              role="none"
              [attr.data-index]="i"
              [class.wu-dock-item-active]="item['active']"
              [class.wu-dock-item-current]="item['current']"
              [class.wu-dock-item-disabled]="item.disabled"
              [class.p-disabled]="item.disabled"
              [class.wu-dock-bounce]="bouncing === i"
              [ngClass]="item.styleClass || ''"
              [ngStyle]="item.style || null"
            >
              <a
                *ngIf="hasRoute(item); else plain"
                class="wu-dock-action p-dock-item-link"
                role="menuitem"
                [routerLink]="item.routerLink"
                [queryParams]="item.queryParams"
                [fragment]="item.fragment"
                [attr.target]="item.target || null"
                [attr.tabindex]="tabIndexOf(i)"
                [attr.aria-label]="item.label || null"
                [attr.title]="item.title || null"
                (click)="pick(item, i, $event)"
              >
                <ng-container *ngTemplateOutlet="itemTemplate || plainItem; context: { $implicit: item, index: i }"></ng-container>
              </a>
              <ng-template #plain>
                <a
                  class="wu-dock-action p-dock-item-link"
                  role="menuitem"
                  [attr.href]="item.url && !item.disabled ? item.url : null"
                  [attr.target]="item.target || null"
                  [attr.tabindex]="tabIndexOf(i)"
                  [attr.aria-label]="item.label || null"
                  [attr.aria-disabled]="item.disabled ? true : null"
                  [attr.title]="item.title || null"
                  (click)="pick(item, i, $event)"
                >
                  <ng-container *ngTemplateOutlet="itemTemplate || plainItem; context: { $implicit: item, index: i }"></ng-container>
                </a>
              </ng-template>
              <span *ngIf="item.label" class="wu-dock-tip" aria-hidden="true">{{ item.label }}</span>
              <span class="wu-dock-dot" aria-hidden="true"></span>
            </li>
          </ng-template>
        </ng-container>
      </ul>
    </div>
    <div class="wu-dock-end">
      <ng-container *ngIf="endTemplate">
        <ng-container *ngTemplateOutlet="endTemplate"></ng-container>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #plainItem let-item>
  <img *ngIf="item.image" class="wu-dock-image" [src]="item.image" alt="" draggable="false" />
  <span *ngIf="!item.image && item.icon" class="wu-dock-icon" [ngClass]="item.icon"></span>
  <span *ngIf="item.badge" class="wu-dock-badge">{{ item.badge }}</span>
</ng-template>
