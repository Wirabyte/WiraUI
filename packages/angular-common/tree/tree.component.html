<div
  class="wt-tree p-tree p-component"
  [class.wt-tree-selectable]="!!selectionMode"
  [class.p-tree-selectable]="!!selectionMode"
  [class.wt-tree-loading]="loading"
  [class.p-tree-loading]="loading"
  [class]="styleClass || ''"
  [style]="rootStyle"
>
  <div *ngIf="headerTemplate" class="wt-tree-header p-tree-header">
    <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
  </div>
  <div *ngIf="filter" class="wt-select-filter-wrap wt-tree-filter-container p-tree-filter-container p-iconfield">
    <input
      type="text"
      class="wt-inputtext wt-select-filter p-tree-filter p-inputtext"
      role="searchbox"
      autocomplete="off"
      [value]="query"
      [attr.placeholder]="filterPlaceholder || t.search"
      [attr.aria-label]="t.search"
      [attr.aria-controls]="treeId"
      (input)="search($event)"
      (keydown.enter)="$event.preventDefault()"
    />
    <svg class="wt-select-filter-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
  </div>
  <div class="wt-tree-container-wrap p-tree-wrapper" [style.max-height]="scrollHeight || null">
    <ul
      *ngIf="tabKey as tabStop; else noRows"
      class="wt-tree-container p-tree-root-children p-tree-container"
      role="tree"
      [id]="treeId"
      [attr.aria-label]="ariaLabel || null"
      [attr.aria-labelledby]="ariaLabelledBy || null"
      [attr.aria-multiselectable]="selectionMode === 'multiple' || checkbox || null"
      [attr.aria-busy]="loading || null"
      (focusin)="focusIn($event)"
      (keydown)="keydown($event)"
    >
      <li
        *ngFor="let row of rows; trackBy: trackRow"
        class="wt-tree-node p-tree-node p-treenode"
        role="treeitem"
        [id]="rowId(row)"
        [attr.data-wt-key]="row.key"
        [attr.tabindex]="row.key === tabStop ? 0 : -1"
        [attr.aria-level]="row.level + 1"
        [attr.aria-setsize]="row.size"
        [attr.aria-posinset]="row.pos"
        [attr.aria-expanded]="isLeaf(row.node) ? null : isOpen(row.node)"
        [attr.aria-selected]="selectionMode && !checkbox && selectable(row.node) ? isSelected(row.node) : null"
        [attr.aria-checked]="checkbox && selectable(row.node) ? (isSelected(row.node) ? true : isPartial(row.node) ? 'mixed' : false) : null"
        [attr.aria-label]="row.node.label || null"
        [attr.aria-busy]="row.node.loading || null"
        [ngClass]="row.node.styleClass || ''"
        [ngStyle]="row.node.style || null"
        [class.p-tree-node-leaf]="isLeaf(row.node)"
      >
        <div
          class="wt-tree-node-content p-tree-node-content p-treenode-content"
          [style.padding-inline-start]="'calc(' + row.level + ' * var(--wt-tree-indent) + var(--wt-tree-node-padding-x))'"
          [class.wt-tree-node-selected]="!checkbox && isSelected(row.node)"
          [class.p-tree-node-selected]="!checkbox && isSelected(row.node)"
          [class.p-highlight]="!checkbox && isSelected(row.node)"
          [class.wt-tree-node-selectable]="selectable(row.node)"
          [class.p-tree-node-selectable]="selectable(row.node)"
          (click)="nodeClick($event, row)"
          (dblclick)="nodeDblClick($event, row)"
          (contextmenu)="nodeContextMenu($event, row)"
        >
          <button
            type="button"
            class="wt-tree-toggler p-tree-node-toggle-button p-tree-toggler"
            tabindex="-1"
            [attr.aria-label]="togglerAriaLabel || (isOpen(row.node) ? t.collapse : t.expand)"
            [class.wt-tree-toggler-hidden]="isLeaf(row.node)"
            [class.wt-tree-toggler-open]="isOpen(row.node)"
            (click)="toggle($event, row)"
          >
            <ng-container *ngIf="row.node.loading; else arrow">
              <span class="wt-tree-spinner" aria-hidden="true"></span>
            </ng-container>
            <ng-template #arrow>
              <ng-container *ngIf="togglerIconTemplate; else chevron">
                <ng-container *ngTemplateOutlet="togglerIconTemplate; context: { $implicit: isOpen(row.node) }"></ng-container>
              </ng-container>
              <ng-template #chevron>
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 3.5 4.5 4.5-4.5 4.5"></path></svg>
              </ng-template>
            </ng-template>
          </button>
          <span *ngIf="checkbox" class="wt-checkbox wt-tree-check" [class.wt-checkbox-checked]="isSelected(row.node)" [class.wt-tree-check-disabled]="!selectable(row.node)" aria-hidden="true">
            <span class="wt-checkbox-control p-checkbox p-component" [class.p-checkbox-checked]="isSelected(row.node)">
              <span class="wt-checkbox-box p-checkbox-box" [class.wt-checkbox-mixed]="isPartial(row.node)">
                <svg class="wt-checkbox-icon p-checkbox-icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></svg>
              </span>
            </span>
          </span>
          <span *ngIf="iconOf(row.node) as icon" class="wt-tree-node-icon p-tree-node-icon p-treenode-icon" [ngClass]="icon" aria-hidden="true"></span>
          <span class="wt-tree-node-label p-tree-node-label p-treenode-label">
            <ng-container *ngIf="nodeTemplate(row.node) as tpl; else plainLabel">
              <ng-container *ngTemplateOutlet="tpl; context: { $implicit: row.node }"></ng-container>
            </ng-container>
            <ng-template #plainLabel>{{ row.node.label }}</ng-template>
          </span>
        </div>
      </li>
    </ul>
    <ng-template #noRows>
      <div *ngIf="!loading" class="wt-tree-empty p-tree-empty-message" [id]="treeId">
        <ng-container *ngIf="emptyTemplate; else emptyLabel">
          <ng-container *ngTemplateOutlet="emptyTemplate"></ng-container>
        </ng-container>
        <ng-template #emptyLabel>{{ emptyText }}</ng-template>
      </div>
    </ng-template>
    <div *ngIf="loading" class="wt-tree-mask p-tree-mask" role="status" [attr.aria-label]="t.loading">
      <span class="wt-tree-spinner wt-tree-spinner-lg" aria-hidden="true"></span>
    </div>
  </div>
  <div *ngIf="footerTemplate" class="wt-tree-footer p-tree-footer">
    <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
  </div>
</div>
