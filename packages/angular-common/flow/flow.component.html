<div
  #root
  class="wu-flow"
  [class]="styleClass || ''"
  [style]="rootStyle"
  tabindex="0"
  role="application"
  [attr.aria-label]="ariaLabel || text('flowLabel')"
  [attr.aria-describedby]="paneHintId"
>
  <div class="wu-flow-backgrounds">
    <ng-content select="wu-flow-background, [wuFlowBackground]"></ng-content>
  </div>
  <div #pane class="wu-flow-pane" [class.wu-flow-pane-pannable]="panOnDrag !== false">
    <div #viewportEl class="wu-flow-viewport">
      <svg class="wu-flow-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
          <svg:marker
            *ngFor="let m of markers; trackBy: trackById"
            [attr.id]="m.id"
            [attr.viewBox]="markerViewBox"
            [attr.refX]="markerRef.x"
            [attr.refY]="markerRef.y"
            [attr.markerWidth]="m.width"
            [attr.markerHeight]="m.height"
            markerUnits="userSpaceOnUse"
            orient="auto-start-reverse"
          >
            <svg:path
              [attr.d]="m.shape"
              [attr.class]="m.className"
              [attr.fill]="m.fill"
              [attr.stroke]="m.stroke"
              [attr.stroke-width]="m.strokeWidth"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></svg:path>
          </svg:marker>
        </defs>
      </svg>

      <!-- Nodes come first so Tab reaches them before edges. z-index is doubled: edges even (under the nodes of their level), nodes and edge labels odd (labels after the nodes in the DOM, so a label stays readable over a node it crosses). -->
      <div class="wu-flow-nodes">
        <div
          *ngFor="let n of renderedNodes; trackBy: trackById"
          [wuFlowNodeWrapper]="n.id"
          class="wu-flow-node"
          [class]="n.classes"
          [attr.data-id]="n.id"
          [style]="n.style"
          [style.transform]="n.transform"
          [style.z-index]="n.z * 2 + 1"
          [style.width.px]="n.styleWidth"
          [style.height.px]="n.styleHeight"
          [attr.tabindex]="n.focusable ? 0 : null"
          role="group"
          [attr.aria-roledescription]="text('flowNode')"
          [attr.aria-label]="n.ariaLabel"
          [attr.aria-describedby]="n.focusable ? nodeHintId : null"
        >
          <ng-container [ngSwitch]="n.render">
            <ng-container *ngSwitchCase="'template'">
              <ng-container *ngTemplateOutlet="n.template; context: n.ctx; injector: n.injector"></ng-container>
            </ng-container>
            <ng-container *ngSwitchCase="'component'">
              <ng-container [wuFlowNodeComponent]="n.component" [wuFlowNodeContext]="n.ctx"></ng-container>
            </ng-container>
            <ng-container *ngSwitchDefault>
              <wu-flow-handle *ngIf="n.hasTarget" type="target" [position]="n.targetPosition"></wu-flow-handle>
              <div *ngIf="n.label" class="wu-flow-node-label">{{ n.label }}</div>
              <wu-flow-handle *ngIf="n.hasSource" type="source" [position]="n.sourcePosition"></wu-flow-handle>
            </ng-container>
          </ng-container>
        </div>
      </div>

      <svg *ngFor="let layer of edgeLayers; trackBy: trackLayer" class="wu-flow-edges" [style.z-index]="layer.z * 2">
        <svg:g
          *ngFor="let e of layer.edges; trackBy: trackById"
          class="wu-flow-edge"
          [class]="e.classes"
          [attr.data-id]="e.id"
          [attr.tabindex]="e.focusable ? 0 : null"
          [attr.role]="e.focusable ? 'group' : null"
          [attr.aria-roledescription]="e.focusable ? text('flowEdge') : null"
          [attr.aria-label]="e.focusable ? e.ariaLabel : null"
          [attr.aria-describedby]="e.focusable ? edgeHintId : null"
        >
          <ng-container *ngIf="e.template; else plainEdge">
            <ng-container *ngTemplateOutlet="e.template; context: e.ctx"></ng-container>
          </ng-container>
          <ng-template #plainEdge>
            <svg:path
              class="wu-flow-edge-path"
              [attr.d]="e.path"
              [attr.marker-start]="e.markerStart"
              [attr.marker-end]="e.markerEnd"
              [style]="e.style"
            ></svg:path>
          </ng-template>
          <svg:path *ngIf="e.interactionWidth > 0" class="wu-flow-edge-interaction" [attr.d]="e.path" [attr.stroke-width]="e.interactionWidth"></svg:path>
          <svg:circle *ngIf="e.updateSource" class="wu-flow-edge-updater" data-end="source" [attr.cx]="e.sourceX" [attr.cy]="e.sourceY" [attr.r]="reconnectRadius"></svg:circle>
          <svg:circle *ngIf="e.updateTarget" class="wu-flow-edge-updater" data-end="target" [attr.cx]="e.targetX" [attr.cy]="e.targetY" [attr.r]="reconnectRadius"></svg:circle>
        </svg:g>
      </svg>

      <div class="wu-flow-edge-labels">
        <div
          *ngFor="let e of labelEdges; trackBy: trackById"
          class="wu-flow-edge-label"
          [class]="e.labelClasses"
          [attr.data-id]="e.id"
          [style]="e.labelBoxStyle"
          [style.transform]="e.labelTransform"
          [style.z-index]="e.z * 2 + 1"
        >
          <ng-container *ngIf="e.labelTemplate; else labelText">
            <ng-container *ngTemplateOutlet="e.labelTemplate; context: e.ctx"></ng-container>
          </ng-container>
          <ng-template #labelText>
            <span class="wu-flow-edge-label-text" [style]="e.labelStyle">{{ e.label }}</span>
          </ng-template>
        </div>
      </div>

      <svg *ngIf="connectionLine || guides.length" class="wu-flow-overlay" aria-hidden="true">
        <svg:g
          *ngIf="connectionLine as line"
          class="wu-flow-connection"
          [class.wu-flow-connection-valid]="line.valid === true"
          [class.wu-flow-connection-invalid]="line.valid === false"
        >
          <ng-container *ngIf="connectionLineTemplate; else plainLine">
            <ng-container *ngTemplateOutlet="connectionLineTemplate; context: line.ctx"></ng-container>
          </ng-container>
          <ng-template #plainLine>
            <svg:path class="wu-flow-connection-path" [attr.d]="line.path" [style]="connectionLineStyle || null"></svg:path>
          </ng-template>
        </svg:g>
        <ng-container *ngFor="let gd of guides; trackBy: trackGuide">
          <svg:line
            *ngIf="gd.orientation === 'vertical'"
            class="wu-flow-guide"
            [attr.x1]="gd.at"
            [attr.x2]="gd.at"
            [attr.y1]="gd.from"
            [attr.y2]="gd.to"
          ></svg:line>
          <svg:line
            *ngIf="gd.orientation === 'horizontal'"
            class="wu-flow-guide"
            [attr.x1]="gd.from"
            [attr.x2]="gd.to"
            [attr.y1]="gd.at"
            [attr.y2]="gd.at"
          ></svg:line>
        </ng-container>
      </svg>
    </div>

    <div
      *ngIf="selectionRect as r"
      class="wu-flow-selection"
      [style.left.px]="r.x"
      [style.top.px]="r.y"
      [style.width.px]="r.width"
      [style.height.px]="r.height"
    ></div>
  </div>

  <ng-content></ng-content>

  <div class="wu-flow-sr-only" [attr.id]="paneHintId">{{ text('flowPaneHint') }}</div>
  <div class="wu-flow-sr-only" [attr.id]="nodeHintId">{{ text('flowNodeHint') }}</div>
  <div class="wu-flow-sr-only" [attr.id]="edgeHintId">{{ text('flowEdgeHint') }}</div>
  <div #live class="wu-flow-sr-only" aria-live="polite" aria-atomic="true"></div>
</div>
