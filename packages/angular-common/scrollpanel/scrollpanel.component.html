<div class="wu-scrollpanel p-scrollpanel p-component" [class]="styleClass || ''" [style]="rootStyle">
  <div
    #content
    class="wu-scrollpanel-content p-scrollpanel-content"
    tabindex="0"
    role="region"
    [attr.aria-label]="ariaLabel || null"
    (keydown)="keydown($event)"
  >
    <ng-content></ng-content>
    <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  </div>
</div>
