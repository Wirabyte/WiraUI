<nav class="wu-breadcrumb p-breadcrumb p-component" [class]="styleClass || ''" [class.wu-breadcrumb-plain]="variant === 'plain'" [style]="rootStyle" [attr.aria-label]="ariaLabel || t.breadcrumb">
  <ol class="wu-breadcrumb-list p-breadcrumb-list p-menuitem-list">
    <li
      *ngIf="home"
      class="wu-breadcrumb-item wu-breadcrumb-home p-breadcrumb-home-item p-menuitem"
      [ngClass]="home.styleClass || ''"
      [ngStyle]="home.style || null"
      [class.wu-breadcrumb-item-disabled]="home.disabled"
      [class.p-disabled]="home.disabled"
    >
      <ng-container *ngTemplateOutlet="link; context: { $implicit: home, isHome: true, last: !items.length }"></ng-container>
    </li>
    <ng-container *ngFor="let item of items; let i = index; let last = last">
      <li *ngIf="home || i > 0" class="wu-breadcrumb-separator p-breadcrumb-separator p-menuitem-separator" aria-hidden="true">
        <ng-container *ngIf="separatorTemplate; else chevron">
          <ng-container *ngTemplateOutlet="separatorTemplate"></ng-container>
        </ng-container>
        <ng-template #chevron>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 3.5 4.5 4.5-4.5 4.5"></path></svg>
        </ng-template>
      </li>
      <li
        class="wu-breadcrumb-item p-breadcrumb-item p-menuitem"
        [ngClass]="item.styleClass || ''"
        [ngStyle]="item.style || null"
        [class.wu-breadcrumb-item-disabled]="item.disabled"
        [class.p-disabled]="item.disabled"
        [class.wu-breadcrumb-current]="last"
      >
        <ng-container *ngTemplateOutlet="link; context: { $implicit: item, isHome: false, last: last }"></ng-container>
      </li>
    </ng-container>
  </ol>
</nav>

<ng-template #link let-item let-isHome="isHome" let-last="last">
  <a
    *ngIf="routed(item); else plain"
    class="wu-breadcrumb-link p-breadcrumb-item-link p-menuitem-link"
    [attr.aria-label]="isHome && !item.label ? homeLabel : null"
    [attr.aria-current]="last ? 'page' : null"
    [attr.title]="item.title || null"
    [attr.target]="item.target || null"
    [attr.data-automationid]="item.automationId || null"
    [routerLink]="item.routerLink"
    [queryParams]="item.queryParams"
    [queryParamsHandling]="item.queryParamsHandling"
    [fragment]="item.fragment"
    [preserveFragment]="!!item.preserveFragment"
    [skipLocationChange]="!!item.skipLocationChange"
    [replaceUrl]="!!item.replaceUrl"
    [state]="item.state"
    routerLinkActive="wu-breadcrumb-link-active p-menuitem-link-active"
    [routerLinkActiveOptions]="item.routerLinkActiveOptions || { exact: true }"
    (click)="itemClick($event, item)"
  >
    <ng-container *ngTemplateOutlet="content; context: { $implicit: item, isHome: isHome }"></ng-container>
  </a>
  <ng-template #plain>
    <a
      class="wu-breadcrumb-link p-breadcrumb-item-link p-menuitem-link"
      [class.wu-breadcrumb-link-static]="!item.url && !item.command"
      [attr.href]="hrefOf(item)"
      [attr.role]="!item.url && item.command ? 'button' : null"
      [attr.tabindex]="!item.url && item.command && !item.disabled ? 0 : null"
      [attr.aria-label]="isHome && !item.label ? homeLabel : null"
      [attr.aria-current]="last ? 'page' : null"
      [attr.aria-disabled]="item.disabled || null"
      [attr.title]="item.title || null"
      [attr.target]="item.url ? item.target || null : null"
      [attr.data-automationid]="item.automationId || null"
      (click)="itemClick($event, item)"
      (keydown.enter)="!item.url && itemClick($any($event), item)"
    >
      <ng-container *ngTemplateOutlet="content; context: { $implicit: item, isHome: isHome }"></ng-container>
    </a>
  </ng-template>
</ng-template>

<ng-template #content let-item let-isHome="isHome">
  <ng-container *ngIf="itemTemplate; else defaultContent">
    <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
  </ng-container>
  <ng-template #defaultContent>
    <span *ngIf="item.icon" class="wu-breadcrumb-icon p-breadcrumb-item-icon p-menuitem-icon" [ngClass]="item.icon" [ngStyle]="item.iconStyle || null" aria-hidden="true"></span>
    <svg *ngIf="isHome && !item.icon" class="wu-breadcrumb-icon wu-breadcrumb-home-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 7.25 8 2.75l5.5 4.5"></path>
      <path d="M4 6.25v7h3V10h2v3.25h3v-7"></path>
    </svg>
    <span *ngIf="item.label && item.escape !== false" class="wu-breadcrumb-label p-breadcrumb-item-label p-menuitem-text">{{ item.label }}</span>
    <span *ngIf="item.label && item.escape === false" class="wu-breadcrumb-label p-breadcrumb-item-label p-menuitem-text" [innerHTML]="item.label"></span>
  </ng-template>
</ng-template>
