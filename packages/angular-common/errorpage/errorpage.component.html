<div
  class="wt-error-page"
  [class]="styleClass || ''"
  [class.wt-error-page-kawaii]="kawaii"
  [class.wt-error-page-formal]="!kawaii"
  [class.wt-error-page-full]="fullPage"
  [style]="rootStyle"
  [attr.data-code]="code"
  [attr.data-kind]="kind"
>
  <div class="wt-ep-art" aria-hidden="true">
    <ng-container *ngIf="!kawaii; else cute">
      <span class="wt-ep-badge">
        <svg viewBox="0 0 24 24" focusable="false"><path [attr.d]="icon"></path></svg>
      </span>
      <span class="wt-ep-label">{{ words.error }}</span>
      <span class="wt-ep-code">{{ code }}</span>
    </ng-container>
    <ng-template #cute>
      <svg class="wt-ep-mascot" viewBox="0 0 260 220" focusable="false">
        <path class="wt-ep-k-blob" d="M44 118C38 62 86 24 138 28s94 42 88 96-50 76-100 74S50 172 44 118Z"></path>
        <path class="wt-ep-k-spark" d="M44 43Q44 52 53 52Q44 52 44 61Q44 52 35 52Q44 52 44 43Z"></path>
        <path class="wt-ep-k-spark wt-ep-k-spark-2" d="M222 143Q222 150 229 150Q222 150 222 157Q222 150 215 150Q222 150 222 143Z"></path>
        <path class="wt-ep-k-spark wt-ep-k-spark-3" d="M210 32Q210 38 216 38Q210 38 210 44Q210 38 204 38Q210 38 210 32Z"></path>
        <path class="wt-ep-k-spark wt-ep-k-spark-2" d="M34 162Q34 168 40 168Q34 168 34 174Q34 168 28 168Q34 168 34 162Z"></path>
        <ellipse class="wt-ep-k-shadow" cx="130" cy="204" rx="58" ry="7"></ellipse>
        <g class="wt-ep-k-bob">
          <path class="wt-ep-k-body" d="M88 96 92 64 116 84ZM172 96 168 64 144 84Z"></path>
          <path class="wt-ep-k-blush" d="M95 88 97 72 109 83ZM165 88 163 72 151 83Z"></path>
          <path class="wt-ep-k-body" d="M66 150C66 104 96 76 130 76s64 28 64 74c0 26-28 36-64 36s-64-10-64-36Z"></path>
          <ellipse class="wt-ep-k-blush" cx="100" cy="134" rx="9" ry="5.5"></ellipse>
          <ellipse class="wt-ep-k-blush" cx="160" cy="134" rx="9" ry="5.5"></ellipse>
          <ng-container [ngSwitch]="kind">
            <g *ngSwitchCase="'server'" class="wt-ep-k-line">
              <path d="M110 118m-1.5 0a1.5 1.5 0 1 1 3 0a3 3 0 1 1-6 0a4.5 4.5 0 1 1 9 0a6 6 0 1 1-12 0"></path>
              <path d="M150 118m-1.5 0a1.5 1.5 0 1 1 3 0a3 3 0 1 1-6 0a4.5 4.5 0 1 1 9 0a6 6 0 1 1-12 0"></path>
            </g>
            <g *ngSwitchCase="'down'" class="wt-ep-k-line">
              <path d="M102 119q8 7 16 0M142 119q8 7 16 0"></path>
            </g>
            <g *ngSwitchCase="'time'" class="wt-ep-k-line">
              <path d="M102 119q8 7 16 0M142 119q8 7 16 0"></path>
            </g>
            <g *ngSwitchCase="'busy'" class="wt-ep-k-line">
              <path d="M104 112l9 6-9 6M156 112l-9 6 9 6"></path>
            </g>
            <g *ngSwitchDefault class="wt-ep-k-eyes">
              <circle class="wt-ep-k-ink" cx="110" cy="118" r="6.5"></circle>
              <circle class="wt-ep-k-ink" cx="150" cy="118" r="6.5"></circle>
              <circle class="wt-ep-k-shine" cx="112.5" cy="115.5" r="2.2"></circle>
              <circle class="wt-ep-k-shine" cx="152.5" cy="115.5" r="2.2"></circle>
            </g>
          </ng-container>
          <ng-container [ngSwitch]="kind">
            <circle *ngSwitchCase="'missing'" class="wt-ep-k-ink" cx="130" cy="137" r="4"></circle>
            <circle *ngSwitchCase="'time'" class="wt-ep-k-ink" cx="130" cy="137" r="3.5"></circle>
            <path *ngSwitchCase="'server'" class="wt-ep-k-line" d="M120 137q5-5 10 0t10 0"></path>
            <path *ngSwitchCase="'gateway'" class="wt-ep-k-line" d="M120 137q5-5 10 0t10 0"></path>
            <path *ngSwitchCase="'forbidden'" class="wt-ep-k-line" d="M123 137h14"></path>
            <path *ngSwitchCase="'busy'" class="wt-ep-k-ink" d="M123 133q7 12 14 0Z"></path>
            <path *ngSwitchCase="'down'" class="wt-ep-k-line" d="M125 136q5 4 10 0"></path>
            <path *ngSwitchDefault class="wt-ep-k-line" d="M122 134q4 5 8 0q4 5 8 0"></path>
          </ng-container>
          <rect class="wt-ep-k-sign" x="90" y="146" width="80" height="40" rx="12"></rect>
          <text class="wt-ep-k-code" x="130" y="174" text-anchor="middle">{{ code }}</text>
          <circle class="wt-ep-k-body" cx="92" cy="158" r="8"></circle>
          <circle class="wt-ep-k-body" cx="168" cy="158" r="8"></circle>
          <ng-container [ngSwitch]="kind">
            <g *ngSwitchCase="'missing'">
              <circle class="wt-ep-k-bubble" cx="206" cy="72" r="17"></circle>
              <text class="wt-ep-k-mark" x="206" y="80" text-anchor="middle">?</text>
            </g>
            <g *ngSwitchCase="'request'">
              <circle class="wt-ep-k-bubble" cx="206" cy="72" r="17"></circle>
              <text class="wt-ep-k-mark" x="206" y="80" text-anchor="middle">!</text>
            </g>
            <g *ngSwitchCase="'auth'">
              <rect class="wt-ep-k-bubble" x="186" y="58" width="38" height="28" rx="6"></rect>
              <circle class="wt-ep-k-blush" cx="197" cy="69" r="4.5"></circle>
              <path class="wt-ep-k-line wt-ep-k-thin" d="M206 67h12M206 75h8"></path>
            </g>
            <g *ngSwitchCase="'forbidden'">
              <path class="wt-ep-k-line wt-ep-k-thin" d="M101 105l14 5M159 105l-14 5"></path>
              <path class="wt-ep-k-line" d="M198 74v-6a8 8 0 0 1 16 0v6"></path>
              <rect class="wt-ep-k-sign wt-ep-k-outline" x="191" y="72" width="30" height="24" rx="6"></rect>
              <circle class="wt-ep-k-shine" cx="206" cy="83" r="3.2"></circle>
            </g>
            <g *ngSwitchCase="'time'">
              <circle class="wt-ep-k-bubble" cx="206" cy="70" r="17"></circle>
              <path class="wt-ep-k-line wt-ep-k-thin" d="M206 70v-9M206 70l6 4"></path>
            </g>
            <g *ngSwitchCase="'busy'">
              <path class="wt-ep-k-drop" d="M188 86c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12Z"></path>
              <path class="wt-ep-k-drop wt-ep-k-drop-2" d="M70 98c3 4.5 4.5 7 4.5 9a4.5 4.5 0 0 1-9 0c0-2 1.5-4.5 4.5-9Z"></path>
            </g>
            <g *ngSwitchCase="'server'" class="wt-ep-k-orbit">
              <path class="wt-ep-k-spark" d="M98 56Q98 62 104 62Q98 62 98 68Q98 62 92 62Q98 62 98 56Z"></path>
              <path class="wt-ep-k-spark" d="M162 52Q162 58 168 58Q162 58 162 64Q162 58 156 58Q162 58 162 52Z"></path>
              <path class="wt-ep-k-spark" d="M130 40Q130 45 135 45Q130 45 130 50Q130 45 125 45Q130 45 130 40Z"></path>
            </g>
            <g *ngSwitchCase="'gateway'">
              <path class="wt-ep-k-line" d="M176 156c22-4 26-34 20-52"></path>
              <rect class="wt-ep-k-sign wt-ep-k-outline" x="186" y="86" width="22" height="18" rx="5"></rect>
              <path class="wt-ep-k-line" d="M192 86v-8M202 86v-8"></path>
            </g>
            <g *ngSwitchCase="'down'" class="wt-ep-k-snore">
              <text class="wt-ep-k-mark" x="196" y="78">Z</text>
              <text class="wt-ep-k-mark wt-ep-k-small" x="214" y="58">z</text>
            </g>
          </ng-container>
        </g>
      </svg>
    </ng-template>
  </div>
  <div class="wt-ep-title" role="heading" [attr.aria-level]="headingLevel">{{ titleText }}</div>
  <p *ngIf="descriptionText" class="wt-ep-description">{{ descriptionText }}</p>
  <div class="wt-ep-actions">
    <ng-container *ngFor="let b of buttons; let first = first">
      <a *ngIf="b.href !== null; else plain" class="wt-ep-button" [class.wt-ep-button-main]="first" [attr.href]="b.href" [attr.data-action]="b.action" (click)="run(b.action, $event)">{{ b.label }}</a>
      <ng-template #plain>
        <button type="button" class="wt-ep-button" [class.wt-ep-button-main]="first" [attr.data-action]="b.action" (click)="run(b.action, $event)">{{ b.label }}</button>
      </ng-template>
    </ng-container>
    <ng-content select="[wtErrorAction]"></ng-content>
  </div>
  <p *ngIf="reference" class="wt-ep-reference">
    {{ words.reference }} <code>{{ reference }}</code>
  </p>
  <div class="wt-ep-content"><ng-content></ng-content></div>
</div>
