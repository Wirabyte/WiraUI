<div
  class="wt-empty-state"
  [ngClass]="sizeClass"
  [class]="styleClass || ''"
  [style]="rootStyle"
  [attr.data-type]="type"
>
  <ng-container *ngIf="pictured">
    <img *ngIf="image; else drawn" class="wt-empty-state-image" [src]="image" [attr.alt]="imageAlt || ''" />
    <ng-template #drawn>
      <span *ngIf="icon; else art" class="wt-empty-state-icon" aria-hidden="true"><i [ngClass]="icon"></i></span>
    </ng-template>
    <ng-template #art>
      <svg class="wt-empty-state-art" viewBox="0 0 160 120" aria-hidden="true" focusable="false" [ngSwitch]="type">
        <g *ngSwitchCase="'search'">
          <ellipse class="wt-es-bg" cx="80" cy="104" rx="44" ry="6"></ellipse>
          <rect class="wt-es-paper" x="42" y="16" width="58" height="76" rx="7"></rect>
          <path class="wt-es-line" d="M53 32h30M53 43h36M53 54h22"></path>
          <circle class="wt-es-lens" cx="102" cy="72" r="17"></circle>
          <path class="wt-es-accent wt-es-thick" d="m114.5 84.5 12 12"></path>
          <path class="wt-es-accent" d="M97.5 67.5a4.5 4.5 0 1 1 6.5 4c-1.6.9-2.5 2-2.5 3.5"></path>
          <circle class="wt-es-accent-fill" cx="101.5" cy="80" r="1.6"></circle>
        </g>
        <g *ngSwitchCase="'inbox'">
          <ellipse class="wt-es-bg" cx="80" cy="104" rx="50" ry="6"></ellipse>
          <path class="wt-es-paper" d="M36 66 52 38h56l16 28v26a6 6 0 0 1-6 6H42a6 6 0 0 1-6-6z"></path>
          <path class="wt-es-tray" d="M36 66h24l5 9h30l5-9h24v26a6 6 0 0 1-6 6H42a6 6 0 0 1-6-6z"></path>
          <path class="wt-es-accent" d="M80 10v20m-8-8 8 8 8-8"></path>
        </g>
        <g *ngSwitchCase="'folder'">
          <ellipse class="wt-es-bg" cx="80" cy="104" rx="50" ry="6"></ellipse>
          <path class="wt-es-paper" d="M34 34a6 6 0 0 1 6-6h24l8 9h48a6 6 0 0 1 6 6v49a6 6 0 0 1-6 6H40a6 6 0 0 1-6-6z"></path>
          <path class="wt-es-line" d="M34 48h92"></path>
          <circle class="wt-es-soft" cx="80" cy="72" r="13"></circle>
          <path class="wt-es-accent" d="M80 66v12m-6-6h12"></path>
        </g>
        <g *ngSwitchCase="'error'">
          <ellipse class="wt-es-bg" cx="80" cy="104" rx="46" ry="6"></ellipse>
          <path class="wt-es-paper" d="M50 90h62a19 19 0 0 0 1.5-37.9A26 26 0 0 0 63 48.5 21 21 0 0 0 50 90z"></path>
          <path class="wt-es-danger" d="m72 62 16 16m0-16-16 16"></path>
        </g>
        <g *ngSwitchCase="'offline'">
          <circle class="wt-es-bg" cx="80" cy="64" r="44"></circle>
          <path class="wt-es-line" d="M54.5 58.5a36 36 0 0 1 51 0M63 67a24 24 0 0 1 34 0M71.5 75.5a12 12 0 0 1 17 0"></path>
          <circle class="wt-es-line-fill" cx="80" cy="84" r="3.5"></circle>
          <path class="wt-es-danger" d="m52 40 56 58"></path>
        </g>
        <g *ngSwitchDefault>
          <ellipse class="wt-es-bg" cx="80" cy="102" rx="50" ry="7"></ellipse>
          <path class="wt-es-soft" d="M44 54 80 42l36 12-36 12z"></path>
          <path class="wt-es-paper" d="M44 54v36l36 12 36-12V54L80 66z"></path>
          <path class="wt-es-line" d="M80 66v36"></path>
          <path class="wt-es-paper" d="M44 54 31 42l36-12 13 12z"></path>
          <path class="wt-es-paper" d="m116 54 13-12-36-12-13 12z"></path>
          <path class="wt-es-accent" d="M80 12v12m-6-6h12"></path>
          <circle class="wt-es-accent-fill" cx="56" cy="20" r="2.5"></circle>
          <circle class="wt-es-accent-fill" cx="106" cy="16" r="2"></circle>
        </g>
      </svg>
    </ng-template>
  </ng-container>
  <p *ngIf="titleText" class="wt-empty-state-title">{{ titleText }}</p>
  <p *ngIf="descriptionText" class="wt-empty-state-description">{{ descriptionText }}</p>
  <div class="wt-empty-state-actions"><ng-content></ng-content></div>
</div>
