<ng-container *ngIf="popup; else inline">
  <div
    *ngIf="visible"
    #panel
    popover="manual"
    class="wu-tieredmenu wu-tieredmenu-overlay p-tieredmenu p-tieredmenu-overlay p-component"
    [ngClass]="styleClass || ''"
    [ngStyle]="style || null"
    (focusin)="focusIn($event)"
    (keydown)="keydown($event)"
  >
    <ng-container *ngTemplateOutlet="list; context: { $implicit: visibleOf(model), parent: '', root: true }"></ng-container>
  </div>
</ng-container>
<ng-template #inline>
  <div
    class="wu-tieredmenu p-tieredmenu p-component"
    [ngClass]="styleClass || ''"
    [ngStyle]="style || null"
    [class.wu-tieredmenu-disabled]="disabled"
    [class.p-disabled]="disabled"
    (focusin)="focusIn($event)"
    (focusout)="focusOut($event)"
    (keydown)="keydown($event)"
  >
    <ng-container *ngTemplateOutlet="list; context: { $implicit: visibleOf(model), parent: '', root: true }"></ng-container>
  </div>
</ng-template>

<ng-template #list let-items let-parent="parent" let-root="root">
  <ul
    [class]="root ? 'wu-tieredmenu-root-list p-tieredmenu-root-list' : 'wu-tieredmenu-submenu p-tieredmenu-submenu p-submenu-list'"
    role="menu"
    [attr.aria-label]="root ? ariaLabel || null : null"
    [attr.aria-labelledby]="root ? ariaLabelledBy || null : parent ? itemId(parent) : null"
  >
    <ng-container *ngFor="let item of items; let i = index">
      <li *ngIf="item.separator; else entry" class="wu-tieredmenu-separator p-tieredmenu-separator p-menuitem-separator" role="separator"></li>
      <ng-template #entry>
        <li
          class="wu-tieredmenu-item p-tieredmenu-item p-menuitem"
          role="none"
          [ngClass]="item.styleClass || ''"
          [ngStyle]="item.style || null"
          [class.wu-tieredmenu-item-active]="isOpen(keyOf(parent, i))"
          [class.p-tieredmenu-item-active]="isOpen(keyOf(parent, i))"
          [class.p-menuitem-active]="isOpen(keyOf(parent, i))"
          [class.wu-tieredmenu-item-disabled]="item.disabled"
          [class.p-disabled]="item.disabled"
          (mouseenter)="itemEnter(item, keyOf(parent, i))"
        >
          <div class="wu-tieredmenu-item-content p-tieredmenu-item-content">
            <a
              *ngIf="routed(item) && !hasChildren(item); else plain"
              class="wu-tieredmenu-item-link p-tieredmenu-item-link p-menuitem-link"
              role="menuitem"
              [id]="itemId(keyOf(parent, i))"
              [attr.data-wu-key]="keyOf(parent, i)"
              [attr.tabindex]="tabindexOf(keyOf(parent, i))"
              [attr.title]="item.title || null"
              [attr.target]="item.target || null"
              [attr.data-automationid]="item.automationId || null"
              [routerLink]="item.routerLink"
              [queryParams]="item.queryParams"
              [queryParamsHandling]="item.queryParamsHandling"
              [fragment]="item.fragment"
              [preserveFragment]="!!item.preserveFragment"
              [skipLocationChange]="!!item.skipLocationChange"
              [replaceUrl]="!!item.replaceUrl"
              [state]="item.state"
              routerLinkActive="wu-tieredmenu-link-active p-menuitem-link-active"
              [routerLinkActiveOptions]="item.routerLinkActiveOptions || { exact: false }"
              (click)="itemClick($event, item, keyOf(parent, i))"
            >
              <ng-container *ngTemplateOutlet="content; context: { $implicit: item }"></ng-container>
            </a>
            <ng-template #plain>
              <a
                class="wu-tieredmenu-item-link p-tieredmenu-item-link p-menuitem-link"
                role="menuitem"
                [id]="itemId(keyOf(parent, i))"
                [attr.data-wu-key]="keyOf(parent, i)"
                [attr.tabindex]="tabindexOf(keyOf(parent, i))"
                [attr.href]="hasChildren(item) ? null : hrefOf(item)"
                [attr.title]="item.title || null"
                [attr.target]="item.url ? item.target || null : null"
                [attr.data-automationid]="item.automationId || null"
                [attr.aria-haspopup]="hasChildren(item) ? 'menu' : null"
                [attr.aria-expanded]="hasChildren(item) ? isOpen(keyOf(parent, i)) : null"
                [attr.aria-disabled]="item.disabled || null"
                (click)="itemClick($event, item, keyOf(parent, i))"
              >
                <ng-container *ngTemplateOutlet="content; context: { $implicit: item }"></ng-container>
              </a>
            </ng-template>
          </div>
          <ng-container *ngIf="hasChildren(item) && isOpen(keyOf(parent, i))">
            <ng-container *ngTemplateOutlet="list; context: { $implicit: visibleOf(item.items), parent: keyOf(parent, i), root: false }"></ng-container>
          </ng-container>
        </li>
      </ng-template>
    </ng-container>
  </ul>
</ng-template>

<ng-template #content let-item>
  <ng-container *ngIf="itemTemplate; else defaultContent">
    <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item, hasSubmenu: hasChildren(item) }"></ng-container>
  </ng-container>
  <ng-template #defaultContent>
    <span *ngIf="item.icon" class="wu-tieredmenu-item-icon p-tieredmenu-item-icon p-menuitem-icon" [ngClass]="item.icon" [ngStyle]="item.iconStyle || null" aria-hidden="true"></span>
    <span *ngIf="item.escape !== false; else html" class="wu-tieredmenu-item-label p-tieredmenu-item-label p-menuitem-text">{{ item.label }}</span>
    <ng-template #html><span class="wu-tieredmenu-item-label p-tieredmenu-item-label p-menuitem-text" [innerHTML]="item.label"></span></ng-template>
    <span *ngIf="item.badge" class="wu-tieredmenu-badge p-badge" [ngClass]="item.badgeStyleClass || ''">{{ item.badge }}</span>
  </ng-template>
  <ng-container *ngIf="hasChildren(item)">
    <ng-container *ngIf="submenuIconTemplate; else chevron">
      <ng-container *ngTemplateOutlet="submenuIconTemplate"></ng-container>
    </ng-container>
    <ng-template #chevron>
      <svg class="wu-tieredmenu-submenu-icon p-tieredmenu-submenu-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.5 3.5 4.5 4.5-4.5 4.5"></path></svg>
    </ng-template>
  </ng-container>
</ng-template>
