<label
  class="wu-toggleswitch"
  [class]="styleClass() || ''"
  [style]="rootStyle()"
  [class.wu-toggleswitch-checked]="checked()"
  [class.wu-toggleswitch-disabled]="isDisabled()"
  [class.wu-invalid]="invalid()"
>
  <input
    type="checkbox"
    role="switch"
    class="wu-toggleswitch-input p-toggleswitch-input"
    [id]="id()"
    [attr.name]="name() || null"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-checked]="checked()"
    [attr.aria-invalid]="invalid() || null"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-label]="ariaLabel() || null"
    (change)="toggle($event)"
    (blur)="onTouched()"
  />
  <span
    class="wu-toggleswitch-control p-toggleswitch p-component"
    [class.p-toggleswitch-checked]="checked()"
    [class.p-disabled]="isDisabled()"
    [class.p-invalid]="invalid()"
    aria-hidden="true"
  >
    <span class="wu-toggleswitch-track p-toggleswitch-slider"><span class="wu-toggleswitch-handle p-toggleswitch-handle"></span></span>
  </span>
  @if (label()) {
    <span class="wu-toggleswitch-label">{{ label() }}</span>
  }
</label>
