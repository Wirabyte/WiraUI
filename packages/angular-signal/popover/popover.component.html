@if (overlayVisible) {
  <div
    #panel
    popover="manual"
    role="dialog"
    class="wt-popover p-popover p-component"
    [ngClass]="styleClass || ''"
    [ngStyle]="style || null"
    (keydown)="keydown($event)"
  >
    <div class="wt-popover-content p-popover-content">
      <ng-content></ng-content>
      @if (contentTemplate) {
        <ng-container *ngTemplateOutlet="contentTemplate; context: contentContext"></ng-container>
      }
    </div>
    @if (showCloseIcon) {
      <button type="button" class="wt-popover-close p-popover-close-button" [attr.aria-label]="ariaCloseLabel || t.close" (click)="hide()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
      </button>
    }
  </div>
}
