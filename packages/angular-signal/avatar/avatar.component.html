<div [class]="classes()" [style]="rootStyle()" [attr.role]="ariaLabel() ? 'img' : null" [attr.aria-label]="ariaLabel() || null">
  @if (showImage()) {
    <img [src]="image()" [alt]="ariaLabel() || label() || ''" (error)="imageError($event)" />
  } @else if (label()) {
    <span class="wu-avatar-text p-avatar-label">{{ label() }}</span>
  } @else if (icon()) {
    <span [class]="'wu-avatar-icon p-avatar-icon ' + icon()" aria-hidden="true"></span>
  }
  <ng-content></ng-content>
</div>
