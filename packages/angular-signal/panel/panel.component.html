<div [class]="classes()" [style]="rootStyle()">
  <div class="wu-panel-header p-panel-header" [style.cursor]="toggleable() && toggler() === 'header' ? 'pointer' : null" (click)="headerClick()">
    @if (header()) {
      <span class="wu-panel-title p-panel-title" [id]="titleId">{{ header() }}</span>
    }
    @if (headerTemplate(); as t) {
      <ng-container *ngTemplateOutlet="t"></ng-container>
    }
    <ng-content select="[wuPanelHeader], wu-header"></ng-content>
    <div class="wu-panel-icons p-panel-icons">
      <ng-content select="[wuPanelIcons]"></ng-content>
      @if (iconsTemplate(); as t) {
        <ng-container *ngTemplateOutlet="t"></ng-container>
      }
      @if (toggleable()) {
        <button
          type="button"
          class="wu-panel-toggler p-panel-toggler"
          [attr.aria-expanded]="!isCollapsed()"
          [attr.aria-controls]="contentId"
          [attr.aria-label]="togglerLabel()"
          (click)="toggle($event)"
        >
          @if (isCollapsed()) {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
          } @else {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"></path></svg>
          }
        </button>
      }
    </div>
  </div>
  <div
    class="wu-panel-content-container p-panel-content-container"
    [id]="contentId"
    role="region"
    [attr.aria-labelledby]="header() ? titleId : null"
    [attr.inert]="isCollapsed() ? '' : null"
  >
    <div class="wu-panel-content-inner">
      <div class="wu-panel-content p-panel-content"><ng-content></ng-content></div>
      <div class="wu-panel-footer p-panel-footer">
        <ng-content select="[wuPanelFooter], wu-footer"></ng-content>
        @if (footerTemplate(); as t) {
          <ng-container *ngTemplateOutlet="t"></ng-container>
        }
      </div>
    </div>
  </div>
</div>
