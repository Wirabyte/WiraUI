<div [class]="classes()" [style]="rootStyle()" [attr.role]="sev() === 'danger' || sev() === 'warn' ? 'alert' : 'status'">
  <span class="wu-message-icon p-message-icon" aria-hidden="true">
    @if (icon()) {
      <span [class]="icon()"></span>
    } @else {
      @switch (sev()) {
        @case ('success') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path></svg>
        }
        @case ('warn') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4M12 17h.01"></path></svg>
        }
        @case ('danger') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
        }
      }
    }
  </span>
  <div class="wu-message-text p-message-text">
    @if (text()) {
      @if (escape()) {
        {{ text() }}
      } @else {
        <span [innerHTML]="text()"></span>
      }
    }
    <ng-content></ng-content>
  </div>
  @if (closable()) {
    <button type="button" class="wu-message-close p-message-close-button" [attr.aria-label]="closeLabel()" (click)="close($event)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
    </button>
  }
</div>
