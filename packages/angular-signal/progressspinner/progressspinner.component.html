<div
  class="wt-progress-spinner p-progressspinner p-component"
  [class]="styleClass() || ''"
  [style]="rootStyle()"
  [style.width]="labelled() ? ringSize() : null"
  [style.height]="labelled() ? ringSize() : null"
  role="progressbar"
  aria-busy="true"
  [attr.aria-label]="ariaText()"
>
  <svg class="wt-progress-spinner-svg p-progressspinner-spin" viewBox="25 25 50 50" [style.animation-duration]="animationDuration()">
    <circle
      class="wt-progress-spinner-circle p-progressspinner-circle"
      cx="50"
      cy="50"
      r="20"
      [attr.fill]="fill()"
      [attr.stroke-width]="strokeWidth()"
      stroke-miterlimit="10"
    />
  </svg>
</div>
@if (labelled()) {
  <div class="wt-progress-spinner-label" aria-hidden="true">
    @if (labelTemplate(); as tpl) {
      <ng-container *ngTemplateOutlet="tpl"></ng-container>
    } @else {
      {{ label() }}
    }
  </div>
}
