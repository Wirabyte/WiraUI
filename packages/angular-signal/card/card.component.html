<div [class]="classes()" [attr.aria-busy]="loading() || null">
  <div class="wt-card-header p-card-header"><ng-content select="[wtCardHeader]"></ng-content></div>
  <div class="wt-card-body p-card-body">
    <div class="wt-card-caption">
      @if (header() || subheader()) {
        <div class="wt-card-titles p-card-caption">
          @if (header()) {
            <div class="wt-card-title p-card-title">{{ header() }}</div>
          }
          @if (subheader()) {
            <div class="wt-card-subtitle p-card-subtitle">{{ subheader() }}</div>
          }
        </div>
      }
      <div class="wt-card-actions"><ng-content select="[wtCardActions]"></ng-content></div>
    </div>
    @if (loading()) {
      <div class="wt-card-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    }
    <div class="wt-card-content p-card-content" [hidden]="loading()"><ng-content></ng-content></div>
    <div class="wt-card-footer p-card-footer"><ng-content select="[wtCardFooter]"></ng-content></div>
  </div>
</div>
