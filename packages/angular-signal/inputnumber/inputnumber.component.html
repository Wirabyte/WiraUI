<span [class]="classes()" [style]="rootStyle()">
  @if (showButtons() && buttonLayout() === 'horizontal') {
    <button
      type="button"
      class="wu-inputnumber-button p-inputnumber-decrement-button" [class]="decrementButtonClass() || ''"
      tabindex="-1"
      aria-hidden="true"
      [disabled]="isDisabled() || readonly() || atMin()"
      (pointerdown)="startRepeat($event, -1)"
      (pointerup)="stopRepeat()"
      (pointerleave)="stopRepeat()"
      (pointercancel)="stopRepeat()"
    >
      @if (decrementButtonIcon()) {
        <span [class]="decrementButtonIcon()" aria-hidden="true"></span>
      } @else {
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10"></path></svg>
      }
    </button>
  }
  <input
    type="text"
    role="spinbutton"
    class="wu-inputtext p-inputtext p-component p-inputnumber-input"
    [class.wu-inputtext-sm]="sizeKey() === 'sm'"
    [class.p-inputtext-sm]="sizeKey() === 'sm'"
    [class.wu-inputtext-lg]="sizeKey() === 'lg'"
    [class.p-inputtext-lg]="sizeKey() === 'lg'"
    [class.wu-invalid]="invalid()"
    [class.wu-filled]="value() !== null"
    [id]="id()"
    [attr.name]="name() || null"
    [class]="inputStyleClass() || ''"
    [style]="inputStyleObject()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.inputmode]="maxDigits() > 0 ? 'decimal' : 'numeric'"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemin]="min()"
    [attr.aria-valuemax]="max()"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-invalid]="invalid() || null"
    [attr.placeholder]="placeholder() || null"
    [value]="display()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    (focus)="focus($event)"
    (beforeinput)="guard($any($event))"
    (input)="typed($event)"
    (blur)="blur($event)"
    (keydown)="keydown($event)"
  />
  @if (showClearButton()) {
    <button type="button" class="wu-inputnumber-clear p-inputnumber-clear-icon" [attr.aria-label]="clearLabel()" (click)="clear()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"></path></svg></button>
  }
  @if (showButtons() && buttonLayout() === 'stacked') {
    <span class="wu-inputnumber-buttons p-inputnumber-button-group">
      <button
        type="button"
        class="wu-inputnumber-button p-inputnumber-increment-button" [class]="incrementButtonClass() || ''"
        tabindex="-1"
        aria-hidden="true"
        [disabled]="isDisabled() || readonly() || atMax()"
        (pointerdown)="startRepeat($event, 1)"
        (pointerup)="stopRepeat()"
        (pointerleave)="stopRepeat()"
        (pointercancel)="stopRepeat()"
      >
        @if (incrementButtonIcon()) {
        <span [class]="incrementButtonIcon()" aria-hidden="true"></span>
      } @else {
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"></path></svg>
      }
      </button>
      <button
        type="button"
        class="wu-inputnumber-button p-inputnumber-decrement-button" [class]="decrementButtonClass() || ''"
        tabindex="-1"
        aria-hidden="true"
        [disabled]="isDisabled() || readonly() || atMin()"
        (pointerdown)="startRepeat($event, -1)"
        (pointerup)="stopRepeat()"
        (pointerleave)="stopRepeat()"
        (pointercancel)="stopRepeat()"
      >
        @if (decrementButtonIcon()) {
        <span [class]="decrementButtonIcon()" aria-hidden="true"></span>
      } @else {
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
      }
      </button>
    </span>
  }
  @if (showButtons() && buttonLayout() === 'horizontal') {
    <button
      type="button"
      class="wu-inputnumber-button p-inputnumber-increment-button" [class]="incrementButtonClass() || ''"
      tabindex="-1"
      aria-hidden="true"
      [disabled]="isDisabled() || readonly() || atMax()"
      (pointerdown)="startRepeat($event, 1)"
      (pointerup)="stopRepeat()"
      (pointerleave)="stopRepeat()"
      (pointercancel)="stopRepeat()"
    >
      @if (incrementButtonIcon()) {
        <span [class]="incrementButtonIcon()" aria-hidden="true"></span>
      } @else {
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
      }
    </button>
  }
</span>
