<nav
  class="wu-steps p-steps p-component"
  [class.wu-steps-readonly]="readonly"
  [class.p-readonly]="readonly"
  [class.wu-steps-label-right]="labelPosition === 'right' && orientation !== 'vertical'"
  [class.wu-steps-vertical]="orientation === 'vertical'"
  [ngClass]="styleClass || ''" [ngStyle]="style || null">
  <ol class="wu-steps-list p-steps-list" (keydown)="keydown($event)">
    @for (item of items; track $index; let i = $index) {
      <li
        class="wu-steps-item p-steps-item"
        [ngClass]="item.styleClass || ''"
        [ngStyle]="item.style || null"
        [class.wu-steps-item-active]="isActive(i)"
        [class.p-steps-item-active]="isActive(i)"
        [class.wu-steps-item-complete]="isComplete(i)"
        [class.wu-steps-item-disabled]="item.disabled"
        [class.p-disabled]="item.disabled"
      >
        @if (routed(item)) {
          <a
            class="wu-steps-link p-steps-item-link"
            [id]="itemId(i)"
            [attr.data-wu-index]="i"
            [attr.tabindex]="tabindexOf(i)"
            [attr.aria-current]="isActive(i) ? 'step' : null"
            [attr.title]="item.title || null"
            [routerLink]="item.routerLink"
            [queryParams]="item.queryParams"
            [fragment]="item.fragment"
            [replaceUrl]="!!item.replaceUrl"
            [state]="item.state"
            (click)="itemClick($event, item, i)"
          >
            <ng-container *ngTemplateOutlet="content; context: { $implicit: item, index: i }"></ng-container>
          </a>
        } @else {
          <a
            class="wu-steps-link p-steps-item-link"
            [id]="itemId(i)"
            [attr.data-wu-index]="i"
            [attr.href]="hrefOf(item)"
            [attr.tabindex]="tabindexOf(i)"
            [attr.role]="pickable(item) && !hrefOf(item) ? 'button' : null"
            [attr.aria-current]="isActive(i) ? 'step' : null"
            [attr.aria-disabled]="item.disabled || null"
            [attr.title]="item.title || null"
            (click)="itemClick($event, item, i)"
          >
            <ng-container *ngTemplateOutlet="content; context: { $implicit: item, index: i }"></ng-container>
          </a>
        }
      </li>
    }
  </ol>
</nav>

<ng-template #content let-item let-index="index">
  <span class="wu-steps-number p-steps-item-number" aria-hidden="true">{{ index + 1 }}</span>
  <span class="wu-steps-text">
    <span class="wu-steps-label p-steps-item-label">{{ item.label }}</span>
    @if ($any(item).subtitle) {
      <span class="wu-steps-subtitle">{{ $any(item).subtitle }}</span>
    }
  </span>
</ng-template>
