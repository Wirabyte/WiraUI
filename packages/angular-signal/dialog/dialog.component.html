@if (rendered) {
  <dialog
    #mask
    class="wt-dialog-mask p-dialog-mask p-overlay-mask p-overlay-mask-enter"
    [ngClass]="(maskStyleClass || '') + ' ' + positionClasses"
    [class.wt-dialog-modal]="modal"
    [class.wt-dialog-leaving]="leaving"
    [attr.aria-labelledby]="labelledBy"
    (keydown)="keydown($event)"
    (cancel)="cancel($event)"
    (close)="nativeClose()"
    (pointerdown)="maskPointerdown($event)"
    (click)="maskClick($event)"
  >
    <div
      #panel
      tabindex="-1"
      class="wt-dialog p-dialog p-component"
      [ngClass]="styleClass || ''"
      [ngStyle]="panelStyle"
      [class.wt-dialog-maximized]="maximized"
      [class.p-dialog-maximized]="maximized"
      [class.wt-dialog-draggable]="draggable"
      [class.wt-dialog-headerless]="!showHeader"
    >
      @if (headlessTemplate) {
        <ng-container [ngTemplateOutlet]="headlessTemplate"></ng-container>
      } @else {
        @if (showHeader) {
          <div class="wt-dialog-header p-dialog-header" (pointerdown)="headerPointerdown($event)">
            @if (headerTemplate) {
              <div class="wt-dialog-title p-dialog-title" [id]="titleId"><ng-container [ngTemplateOutlet]="headerTemplate"></ng-container></div>
            } @else {
              <span class="wt-dialog-title p-dialog-title" [id]="titleId">{{ header }}</span>
            }
            <div class="wt-dialog-header-actions p-dialog-header-actions">
              @if (maximizable) {
                <button type="button" class="wt-dialog-icon p-dialog-maximize-button" [attr.aria-label]="maximized ? t.collapse : t.expand" (click)="toggleMaximize()">
                  @if (maximized ? minimizeIcon : maximizeIcon) {
                    <i [class]="(maximized ? minimizeIcon : maximizeIcon) || ''"></i>
                  } @else if (maximized) {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 2.5 9 7M9 3v4h4M2.5 13.5 7 9M7 13V9H3"></path></svg>
                  } @else {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"></path></svg>
                  }
                </button>
              }
              @if (closable) {
                <button type="button" class="wt-dialog-icon p-dialog-close-button" [attr.aria-label]="closeAriaLabel || t.close" (click)="close($event)">
                  @if (closeIconTemplate) {
                    <ng-container [ngTemplateOutlet]="closeIconTemplate"></ng-container>
                  } @else if (closeIcon) {
                    <i [class]="closeIcon"></i>
                  } @else {
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
                  }
                </button>
              }
            </div>
          </div>
        }
        <div class="wt-dialog-content p-dialog-content" [ngClass]="contentStyleClass || ''" [ngStyle]="contentStyle || null">
          <ng-content></ng-content>
          @if (contentTemplate) {
            <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
          }
        </div>
        @if (hasFooter) {
          <div class="wt-dialog-footer p-dialog-footer">
            <ng-content select="[wtDialogFooter], wt-footer"></ng-content>
            @if (footerTemplate) {
              <ng-container [ngTemplateOutlet]="footerTemplate"></ng-container>
            }
          </div>
        }
      }
    </div>
  </dialog>
}
