<button
  [attr.type]="type()"
  [class]="classes()"
  [disabled]="disabled() || busy()"
  [attr.aria-busy]="busy() || null"
  [attr.aria-label]="ariaLabel() || null"
  (click)="handleClick($event)"
  (pointerdown)="handlePointerDown($event)"
>
  @if (busy()) {
    <span class="wt-btn-spinner" aria-hidden="true"></span>
  }
  @if (showIcon() && iconPos() === 'left') {
    <span [class]="'wt-btn-icon ' + icon()" aria-hidden="true"></span>
  }
  @if (label()) {
    <span class="wt-btn-label">{{ label() }}</span>
  }
  <ng-content></ng-content>
  @if (showIcon() && iconPos() === 'right') {
    <span [class]="'wt-btn-icon ' + icon()" aria-hidden="true"></span>
  }
  @if (badge() !== undefined && badge() !== null && badge() !== '') {
    <span class="wt-btn-badge">{{ badge() }}</span>
  }
</button>
