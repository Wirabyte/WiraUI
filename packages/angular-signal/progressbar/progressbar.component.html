<div
  [class]="classes()" [style]="rootStyle()"
  role="progressbar"
  aria-valuemin="0"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuenow]="mode() === 'determinate' ? done() : null"
  [attr.aria-valuetext]="mode() === 'determinate' && (max() !== 100 || text()) ? shown() : null"
  [attr.aria-label]="label()"
>
  @if (mode() === 'determinate') {
    <div class="wt-progressbar-value p-progressbar-value" [style.width.%]="percent()" [style.background]="color() || null">
      @if (showValue() && percent() > 0) {
        <div class="wt-progressbar-label p-progressbar-label">
          @if (contentTemplate(); as tpl) {
            <ng-container *ngTemplateOutlet="tpl; context: context()"></ng-container>
          } @else {
            {{ shown() }}
          }
        </div>
      }
    </div>
  } @else {
    <div class="wt-progressbar-value p-progressbar-value" [style.background]="color() || null"></div>
  }
</div>
