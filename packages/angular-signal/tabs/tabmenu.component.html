<div class="wt-tabmenu p-tabmenu p-component" [ngClass]="styleClass || ''" [ngStyle]="style || null">
  <div class="wt-tabs-nav">
    @if (canPrev) {
      <button type="button" class="wt-tabs-nav-btn wt-tabs-prev p-tabmenu-nav-prev" tabindex="-1" aria-hidden="true" (click)="page(-1)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    }
    <ul
      #list
      class="wt-tablist wt-tabmenu-list p-tabmenu-tablist"
      role="tablist"
      [attr.aria-label]="ariaLabel || null"
      [attr.aria-labelledby]="ariaLabelledBy || null"
      (scroll)="updateArrows()"
      (keydown)="keydown($event)"
    >
      @for (item of items; track $index; let i = $index) {
        <li
          class="wt-tabmenu-item p-tabmenu-item"
          role="presentation"
          [ngClass]="item.styleClass || ''"
          [ngStyle]="item.style || null"
          [class.p-tabmenu-item-active]="isActive(item)"
          [class.p-disabled]="item.disabled"
        >
          @if (routed(item)) {
            <a
              #rla="routerLinkActive"
              class="wt-tab p-tabmenu-item-link"
              role="tab"
              [class.wt-tab-active]="isActive(item)"
              [id]="itemId(i)"
              [attr.data-wt-index]="i"
              [attr.tabindex]="tabindexOf(i)"
              [attr.aria-selected]="activeItem ? isActive(item) : rla.isActive"
              [attr.title]="item.title || null"
              [attr.target]="item.target || null"
              [routerLink]="item.routerLink"
              [queryParams]="item.queryParams"
              [queryParamsHandling]="item.queryParamsHandling"
              [fragment]="item.fragment"
              [preserveFragment]="!!item.preserveFragment"
              [skipLocationChange]="!!item.skipLocationChange"
              [replaceUrl]="!!item.replaceUrl"
              [state]="item.state"
              [routerLinkActive]="activeItem ? [] : routerActiveClasses"
              [routerLinkActiveOptions]="item.routerLinkActiveOptions || { exact: false }"
              (click)="itemClick($event, item, i)"
            >
              <ng-container *ngTemplateOutlet="content; context: { $implicit: item, index: i }"></ng-container>
            </a>
          } @else {
            <a
              class="wt-tab p-tabmenu-item-link"
              role="tab"
              [class.wt-tab-active]="isActive(item)"
              [id]="itemId(i)"
              [attr.data-wt-index]="i"
              [attr.tabindex]="tabindexOf(i)"
              [attr.aria-selected]="isActive(item)"
              [attr.aria-disabled]="item.disabled || null"
              [attr.href]="hrefOf(item)"
              [attr.title]="item.title || null"
              [attr.target]="item.url ? item.target || null : null"
              (click)="itemClick($event, item, i)"
            >
              <ng-container *ngTemplateOutlet="content; context: { $implicit: item, index: i }"></ng-container>
            </a>
          }
        </li>
      }
    </ul>
    @if (canNext) {
      <button type="button" class="wt-tabs-nav-btn wt-tabs-next p-tabmenu-nav-next" tabindex="-1" aria-hidden="true" (click)="page(1)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    }
  </div>
</div>

<ng-template #content let-item let-index="index">
  @if (itemTemplate) {
    <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item, index: index }"></ng-container>
  } @else {
    @if (item.icon) {
      <span class="wt-tab-icon p-tabmenu-item-icon" [ngClass]="item.icon" [ngStyle]="item.iconStyle || null" aria-hidden="true"></span>
    }
    <span class="wt-tabmenu-label p-tabmenu-item-label">{{ item.label }}</span>
    @if (item.badge) {
      <span class="wt-tabmenu-badge p-badge" [ngClass]="item.badgeStyleClass || ''">{{ item.badge }}</span>
    }
  }
</ng-template>
