@if (model()) {
  <wu-tabmenu
    [model]="model()"
    [activeItem]="activeItem()"
    (activeItemChange)="activeItem.set($event)"
    [ariaLabel]="ariaLabel()"
    [styleClass]="styleClass() || undefined"
    [style]="rootStyle()"
  ></wu-tabmenu>
} @else {
<div class="wu-tabs p-tabs p-component" [class]="styleClass() || ''" [style]="rootStyle()">
  @if (!valueMode()) {
  <div class="wu-tabs-nav p-tablist">
  @if (canPrev()) {
    <button type="button" class="wu-tabs-nav-btn wu-tabs-prev p-tablist-prev-button" tabindex="-1" aria-hidden="true" (click)="page(-1)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  }
  <div #list class="wu-tablist p-tablist-tab-list" role="tablist" [attr.aria-label]="ariaLabel() || null" (scroll)="updateArrows()">
    @for (panel of panels(); track panel; let i = $index) {
      <button
        type="button"
        role="tab"
        [class]="tabClasses(i)"
        [id]="baseId + '-tab-' + i"
        [attr.aria-selected]="i === activeIndex()"
        [attr.aria-controls]="baseId + '-panel-' + i"
        [attr.tabindex]="i === activeIndex() ? 0 : -1"
        [disabled]="panel.disabled()"
        (click)="select(i, $event)"
        (keydown)="onKeydown($event, i)"
      >
        @if (panel.leftIcon()) {
          <span [class]="'wu-tab-icon ' + panel.leftIcon()" aria-hidden="true"></span>
        }
        @if (panel.headerTemplate(); as t) {
          <ng-container *ngTemplateOutlet="t"></ng-container>
        } @else {
          {{ panel.header() }}
        }
      </button>
    }
  </div>
  @if (canNext()) {
    <button type="button" class="wu-tabs-nav-btn wu-tabs-next p-tablist-next-button" tabindex="-1" aria-hidden="true" (click)="page(1)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  }
  </div>
  }
  <!-- By value the content is the wu-tablist and wu-tabpanels themselves. -->
  <div [class]="valueMode() ? 'wu-tabs-content' : 'wu-tabpanels p-tabpanels'"><ng-content></ng-content></div>
</div>
}
