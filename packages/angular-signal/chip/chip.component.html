<div [class]="classes()" [style]="rootStyle()">
  @if (image()) {
    <img class="wu-chip-image p-chip-image" [src]="image()" [alt]="alt() || label() || ''" (error)="onImageError.emit($event)" />
  } @else if (icon()) {
    <span [class]="'wu-chip-icon p-chip-icon ' + icon()" aria-hidden="true"></span>
  }
  @if (label()) {
    <span class="wu-chip-label p-chip-label">{{ label() }}</span>
  }
  <ng-content></ng-content>
  @if (removable()) {
    <button type="button" class="wu-chip-remove p-chip-remove-icon" [attr.aria-label]="removeLabel() + (label() ? ' ' + label() : '')" (click)="remove($event)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
    </button>
  }
</div>
