name: Publish

# Run by hand from the Actions tab, for one package or for `all` of them. It is a dry run unless `dry_run` is turned off,
# and a real run does a dry run of every chosen package first, so a package that cannot go up stops it before any upload.
# `all` goes in the order v3, v2, v1, icons: npm points `latest` at the first version a package ever publishes.
# Needs the secret NPM_TOKEN. The repository variable WU_NPM_REGISTRY sets another registry (default: npmjs).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package
        type: choice
        required: true
        options: [all, v3, v2, v1, icons]
      dry_run:
        description: Dry run (uploads nothing)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ inputs.package }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: ${{ vars.WU_NPM_REGISTRY || 'https://registry.npmjs.org' }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          CI: 'true'
        run: pnpm pack:all
      - name: Test
        run: pnpm test
      - name: Dry run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES: ${{ inputs.package == 'all' && 'v3 v2 v1 icons' || inputs.package }}
        run: |
          for package in $PACKAGES; do
            node tools/publish.mjs "$package" --dry-run
          done
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES: ${{ inputs.package == 'all' && 'v3 v2 v1 icons' || inputs.package }}
        run: |
          for package in $PACKAGES; do
            node tools/publish.mjs "$package"
          done
