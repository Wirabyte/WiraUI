name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

# Every job runs on the Wirabyte self-hosted runners; the repository variable WU_RUNNER names another label instead.
# This file has no `pull_request` trigger, but that alone does not protect those machines: a pull request from a fork
# runs the workflow files in that pull request. The public repository must therefore limit pull requests to
# collaborators and require approval for every outside contributor (DESIGN.md §12.27).

jobs:
  build:
    name: Build and test (Node 24)
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Core
        run: |
          pnpm --filter @wiraui/core build
          pnpm --filter @wiraui/core test
          node packages/core/node_modules/typescript-49/bin/tsc -p packages/core/tsconfig.ts49.json

      - name: Themes (SCSS ↔ TypeScript parity on Sass 1.58 and current)
        run: |
          pnpm --filter @wiraui/themes build
          pnpm --filter @wiraui/themes test

      - name: Schematics
        run: pnpm --filter @wiraui/schematics test

      - name: Build @wirabyte/ui v1 (Angular 15), v2 (18), v3 (21)
        env:
          CI: 'true'
        run: |
          mkdir -p packs
          for v in v1 v2 v3; do pnpm --filter @wiraui-build/angular-$v build; done
          for v in v1 v2 v3; do (cd packages/angular-$v/dist && npm pack --pack-destination ../../../packs); done

      - name: Build @wirabyte/icons
        run: pnpm --filter @wiraui-build/icons test

      # Reads the v3 themes built above and the icon SVGs in Chromium (the icons step above only checks them, so build
      # them here); fails when a visual entry point has no component in the kit or a preset lacks a token the kit uses.
      - name: Figma UI Kit (every visual component, every preset)
        run: |
          pnpm build:icons
          pnpm --filter @wiraui/e2e exec playwright install chromium
          pnpm test:figma

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: packs/*.tgz

  install:
    name: ng add on Angular ${{ matrix.angular }} / Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest Node each @wirabyte/ui major promises (DESIGN.md §3)
          - { wu: 1, angular: '15', node: '18', flags: '--style=scss' }
          - { wu: 1, angular: '17', node: '18', flags: '--style=css --standalone=false' }
          - { wu: 2, angular: '18', node: '18.19', flags: '--style=scss --standalone=false' }
          - { wu: 2, angular: '20', node: '20.19', flags: '--style=scss' }
          # The npm that ships with Node 20.19 fails inside `ng new` for Angular 21 ("reading 'edgesOut'"): npm 11 there.
          - { wu: 3, angular: '21', node: '20.19', npm: '11', flags: '--style=css --zoneless' }
          # v3 has no upper Angular limit, so CI watches the newest release too: a new major that breaks it turns this red.
          - { wu: 3, angular: '22', node: '22.22.3', flags: '--style=scss' }
          - { wu: 3, angular: 'latest', node: '24', flags: '--style=css' }
    # No checkout here, so everything goes in runner.temp, which every job starts empty. A self-hosted runner keeps
    # the workspace between jobs: there it still holds another job's checkout (whose package.json makes setup-node v5
    # turn on pnpm caching without pnpm) and the `app` of the previous matrix entry.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: ${{ runner.temp }}/packs
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Into runner.temp, not -g: on a self-hosted runner -g would change the cached Node 20.19 for the next jobs.
      - if: matrix.npm
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm" npm@${{ matrix.npm }}
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: New Angular ${{ matrix.angular }} app
        working-directory: ${{ runner.temp }}
        run: npx -y @angular/cli@${{ matrix.angular }} new app --defaults --skip-git --skip-tests --routing=false ${{ matrix.flags }}
      # Install the packed tarball first: Angular CLI 21 cannot `ng add` a file: spec directly.
      - name: ng add @wirabyte/ui@${{ matrix.wu }} from the packed tarball
        working-directory: ${{ runner.temp }}/app
        run: |
          npm install --no-audit --no-fund "$(ls ../packs/wirabyte-ui-${{ matrix.wu }}.*.tgz)"
          npx ng add @wirabyte/ui --defaults --skip-confirmation
      - name: Build
        working-directory: ${{ runner.temp }}/app
        run: npx ng build

  version-lock:
    name: '@wirabyte/ui@1 must not install on Angular 18'
    needs: build
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    # In runner.temp for the same reason as the job above.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packs
          path: ${{ runner.temp }}/packs
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - working-directory: ${{ runner.temp }}
        run: npx -y @angular/cli@18 new app --defaults --skip-git --skip-tests --skip-install --routing=false --style=css
      - name: npm install must fail with ERESOLVE
        working-directory: ${{ runner.temp }}/app
        run: |
          npm install --no-audit --no-fund
          if npm install "$(ls ../packs/wirabyte-ui-1.*.tgz)" > install.log 2>&1; then
            echo "@wirabyte/ui@1 installed on Angular 18, the peer range lock is broken"; exit 1
          fi
          grep -q ERESOLVE install.log

  # The apps the browsers test (playgrounds v1–v3 built with `ng add` from the packed tarballs, and the docs site),
  # built once and shared with the e2e jobs below.
  apps:
    name: Build the playgrounds and the docs site
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack @wirabyte/ui v1–v3 and @wirabyte/icons
        run: pnpm pack:all
      - name: npm ci in the apps
        run: for app in playground-v1 playground-v2 playground-v3 docs; do (cd apps/$app && npm ci --no-audit --no-fund); done
      - name: ng add + build the playgrounds
        run: pnpm run playgrounds
      # `pnpm docs` would be pnpm's own command (it opens the package page): the script needs `pnpm run`.
      - name: Build the docs site (v1, v2, v3 lazy-loaded on Angular 21)
        run: pnpm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            apps/playground-v1/dist
            apps/playground-v2/dist
            apps/playground-v3/dist
            apps/docs/dist
          retention-days: 3

  e2e:
    name: Playwright · ${{ matrix.name }}
    needs: apps
    runs-on: ${{ vars.WU_RUNNER || 'self-hosted' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # v2 and v1 compare against the screenshots v3 writes, so they run in the same job.
          - { name: 'components · Chromium (v3, v2, v1)', browser: chromium, projects: '--project=v3 --project=v2 --project=v1' }
          - { name: 'components · WebKit', browser: webkit, projects: '--project=v3-webkit' }
          - { name: 'components · Firefox', browser: firefox, projects: '--project=v3-firefox' }
          - { name: 'docs · Chromium', browser: chromium, projects: '--project=docs' }
          - { name: 'docs · WebKit', browser: webkit, projects: '--project=docs-webkit' }
          - { name: 'docs · Firefox', browser: firefox, projects: '--project=docs-firefox' }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @wiraui/e2e
      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: apps
      # The system libraries need root: on a self-hosted runner install them once by hand (npx playwright install-deps).
      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @wiraui/e2e exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} ${{ matrix.browser }}
      - name: Test
        run: pnpm --filter @wiraui/e2e exec playwright test ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: e2e/test-results
          retention-days: 7
