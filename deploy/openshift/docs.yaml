# The WiraUI docs site on OpenShift. The cluster does not build it (a build needs more memory than it has): a machine
# with podman builds the image, pushes it to our own registry, and the cluster pulls it from there. deploy/docs.sh does
# all of it and puts the image it pushed in place of WU_DOCS_IMAGE below; apply this file through it, not by hand.
# The Route serves ui.wirabyte.com; point its DNS at the cluster's router. Without a certificate here the Route uses the
# router's default one, which only fits if it covers this host name: otherwise add tls.certificate and tls.key below,
# or let cert-manager fill them in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiraui-docs
  labels:
    app: wiraui-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wiraui-docs
  template:
    metadata:
      labels:
        app: wiraui-docs
    spec:
      containers:
        - name: docs
          image: WU_DOCS_IMAGE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wiraui-docs
  labels:
    app: wiraui-docs
spec:
  selector:
    app: wiraui-docs
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wiraui-docs
  labels:
    app: wiraui-docs
spec:
  host: ui.wirabyte.com
  to:
    kind: Service
    name: wiraui-docs
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
